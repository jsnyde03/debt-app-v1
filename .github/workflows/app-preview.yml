# 3.5.8 — the App-Preview capture pipeline. One dispatch produces the submittable video, with no Mac in
# Jason's hands: boot the largest iPhone simulator → force DARK → install → deep-link straight into the
# scripted demo → `xcrun simctl io recordVideo` → ffmpeg conform to Apple's 886x1920 → upload.
#
# ⚠️ THE TOOLING WAS RESEARCHED, NOT ASSUMED ([D20], 2026-08-06). Maestro is already wired for native e2e,
# which made it the convenient answer and not the right one. `maestro record` composites its flow-command
# panel beside the app, defaults to 2x speed, and renders in the cloud behind a signed URL — a
# share-your-test artifact, not marketing footage. So Maestro records nothing here; `simctl` does, through
# the simulator's real Metal/Skia path, which is also the path that painted correctly in the 2026-08-06
# Maestro run when the web CanvasKit one did not.
#
# ⚠️ NOTHING DRIVES THE APP, AND THAT IS DELIBERATE. The demo run is TIMED (`DEMO_STAGES`: 0/4/9/14/20s),
# so it plays itself and the capture only has to watch. The one interaction the storyboard wants — tapping
# the payoff invitation at t=20s to fire the real celebration — is NOT here, because this Maestro build
# cannot wait out a timed sequence: `extendedWaitUntilVisible` is absent and `timeout` is not a valid
# assertion property, established over three CI cycles at ~40 minutes each (see
# `apps/rn/.maestro/06-tutorial-interactions.yaml`). Adding a coordinate tap or a pre-warmed driver would
# put unproven machinery in the way of the artifact. Decide from the first cut whether the celebration is
# worth a second cycle.
#
# ⚠️ THE BUILD RECIPE BELOW IS DUPLICATED FROM `native-e2e.yml`, ON PURPOSE AND WITH A COST. That recipe
# carries expensive native fixes (the ios-utilities rootcontentview plugin, SENTRY_DISABLE_AUTO_UPLOAD,
# pod install as its own step because prebuild masks its errors with exit 0). Extracting a shared
# composite action is the right long-term shape and is FILED — it was not done in the same change that
# first proves this pipeline, because a bug in the extraction would break the proven native gate as well
# as this. Keep the two in sync until the extraction lands.
name: App Preview (capture · iOS Simulator)

on:
  # MANUAL ONLY. This produces a marketing asset, not a gate — it should run when the UI has changed
  # enough to be worth re-shooting, not on a schedule and never on push.
  #
  # ⚠️ THE "Run workflow" BUTTON ONLY APPEARS ONCE THIS FILE IS ON THE DEFAULT BRANCH, which in this repo
  # is **release/v1** — not `master`, which does not exist (the comment in `native-e2e.yml` saying so is
  # wrong; that file is on release/v1, which is why its button works). Verified rather than assumed: the
  # REST API refuses it too — `gh workflow run app-preview.yml --ref v1.7-dev` returns
  # `HTTP 404: workflow app-preview.yml not found on the default branch`.
  #
  # **Nothing reaches `release/v1` until v1.7 is live and approved (Jason, 2026-08-07)**, so until then
  # this workflow is dispatched by the TAG trigger below rather than by the button. Kept anyway, because
  # it becomes the normal entry point the moment the release gate lands.
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Override the in-point (seconds into the RAW file). Leave EMPTY — the slate is found automatically. Only set this after watching a cut and wanting a different opening frame.'
        required: false
        default: ''
      duration:
        description: 'Length of the conformed video in seconds (Apple allows 15-30)'
        required: false
        default: '25'

  # The way this actually runs today. A push trigger is evaluated on the pushed REF, so it does not need
  # the default branch — which is what lets the capture run from `v1.7-dev` without putting anything on
  # `release/v1`. `native-e2e.yml` already uses the same mechanism for its release smoke.
  #
  # A dedicated tag rather than a branch push: shooting a marketing asset should be a deliberate act, not
  # something every commit to the dev branch spends ~40 minutes on.
  #
  #   git tag app-preview-$(date +%Y%m%d-%H%M) && git push origin --tags
  push:
    tags: ['app-preview-*']

concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Build · boot · record · conform
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # ⚠️ THIS is what starts the demo, and it replaced a deep link that could not.
      #
      # Metro inlines `EXPO_PUBLIC_*` at BUILD time, so this build — and only this build — comes up inside
      # `/demo?capture=1` on its own (`CaptureAutoStart`). Two CI cycles established why the obvious route
      # does not work: `xcrun simctl openurl` on a custom scheme makes iOS raise
      # "Open in 'Debt Planner (RN)'?", nothing unattended dismisses it, and it appears even with the app
      # already frontmost. A LAUNCH raises no such dialog, so the URL is gone from the path entirely.
      EXPO_PUBLIC_CAPTURE_DEMO: '1'
      APP_ID: 'com.jasonsnyder.debtplanner'
      # Seconds the recorder runs BEFORE the app is launched.
      PREROLL: '3'
      # ⚠️ `LAUNCH_ALLOWANCE` IS GONE (3.5.8.9), and deleting it rather than retuning it is the fix.
      #
      # It was the fourth attempt to answer "where does the script start in the raw file", after a guessed
      # constant, `blackdetect` and screenshot polling. Cycles 7 and 8 then measured the same build's paint
      # moment **3 seconds apart** — so it was not a number that was set wrong, it was a number that does
      # not exist. The app now marks the moment itself (`CaptureSlate`), and the step below FINDS it.
    defaults:
      run:
        working-directory: apps/rn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root + apps/rn)
        working-directory: .
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm --prefix apps/rn install --prefer-offline --no-audit --no-fund

      - name: Cache CocoaPods + Swift-PM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Caches/org.swift.swiftpm
          key: pods-spm-${{ runner.os }}-${{ hashFiles('apps/rn/package-lock.json') }}
          restore-keys: |
            pods-spm-${{ runner.os }}-

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      # ffmpeg is NOT preinstalled on the macos-15 image (verified against actions/runner-images on
      # 2026-08-06); Homebrew is. This is the one practicality the plan flagged as unknown.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Link ./core so tsc can resolve @core before Metro runs
        run: |
          [ -e core ] || ln -s ../../packages/core core
          ls -la core

      - name: Fail fast (typecheck before the slow native build)
        run: npx tsc --noEmit

      - name: Generate the native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods (fail loud — prebuild masks pod errors with exit 0)
        working-directory: apps/rn/ios
        run: pod install

      - name: Build for the iOS Simulator (no signing)
        run: |
          set -o pipefail
          ARCH="$(uname -m)"
          echo "Building single simulator arch: $ARCH"
          xcodebuild \
            -workspace ios/DebtPlannerRN.xcworkspace \
            -scheme DebtPlannerRN \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL='-Onone' GCC_OPTIMIZATION_LEVEL=0 \
            build 2>&1 | tee xcodebuild.log

      - name: Surface the build error
        if: failure()
        run: |
          echo "──────── errors / failures ────────"
          grep -nE "error:|fatal error:|\*\* BUILD FAILED \*\*|The following build commands failed|^ld: |clang: error" \
            xcodebuild.log | tail -60 || echo "(no error-shaped line matched — see the tail below)"
          echo
          tail -80 xcodebuild.log

      # ⚠️ The device choice decides the recording's aspect ratio, so it is PRINTED and carried into the
      # artifact notes. The conform handles either direction, but a reviewer needs to know what was shot.
      - name: Boot the largest iPhone, in DARK mode
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*Pro Max' | sed 's/ *$//' | sort -V | tail -1)
          if [ -z "$DEVICE" ]; then
            echo "No 'Pro Max' simulator found — falling back to the newest iPhone available."
            DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed 's/ *$//' | sort -V | tail -1)
          fi
          echo "Booting: ${DEVICE:-<none found>}"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          # Dark mode is Jason's standing preference for store assets — it reads more premium, and a shot
          # that renders light breaks the set.
          xcrun simctl ui booted appearance dark
          xcrun simctl install booted ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app

      # Cold-launch once to pay the first-launch costs — Metro-less bundle evaluation, font registration,
      # the first Skia surface — outside the recording rather than on the opening frame the video is
      # judged by.
      #
      # ⚠️ The app is TERMINATED again, and that is not a revert to cycle 1's mistake — it is required by
      # the capture flag. This build enters the demo at launch, so the warm run plays the whole script
      # before the recorder is even attached. The recorded run has to be a fresh launch.
      - name: Warm the app (pays first-launch costs), then terminate
        run: |
          mkdir -p capture-out
          xcrun simctl launch booted "$APP_ID" || true
          sleep 25
          xcrun simctl io booted screenshot capture-out/warm.png || true
          xcrun simctl terminate booted "$APP_ID" || true

      - name: Record the scripted demo
        run: |
          mkdir -p capture-out
          # `--codec h264` because ASC takes H.264; `--mask ignored` drops the rounded-corner device mask,
          # which Apple does not want baked into in-app footage.
          xcrun simctl io booted recordVideo --codec h264 --mask ignored capture-out/raw.mov &
          REC_PID=$!
          # Let the recorder actually attach before anything happens on screen. Without this the opening
          # beat is the frame most likely to be lost, and it is the one a viewer decides on.
          #
          # ⚠️ This PRE-ROLL shifts every subsequent timestamp in the raw file, and getting that wrong is
          # silent: the frames still extract, they are just of the wrong beats. So it is written down once
          # here and every offset downstream is derived from it.
          sleep "$PREROLL"

          # A LAUNCH, not an open — no system dialog. The build enters `/demo?capture=1` by itself, holds
          # the script's clock until the opening screen has painted, flashes one white frame at that
          # moment, and starts the beats as it clears. Nothing here has to estimate any of that.
          xcrun simctl launch booted "$APP_ID"

          # DEMO_STAGES: 0 / 4 / 9 / 14 / 20s, measured from the slate — plus a cold launch, plus the
          # settle before the slate. The tail is generous on purpose; the conform trims it, and that is far
          # cheaper than discovering the video stopped before its own ending. It also has to outlast the
          # LAST settled frame (slate + 20 + 3.3), or the extraction below falls back to a stale frame.
          sleep 45

          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          ls -la capture-out/

      # ⚠️ THE SHEET COMES FIRST, BEFORE ANYTHING CAN FAIL.
      #
      # Every wrong anchor so far was discovered by downloading the artifact and opening a PNG, and the one
      # cycle that produced the sheet is the one that made the timeline legible in a glance. So it is
      # emitted immediately after the recording — if the anchor step below fails, the sheet is still in the
      # artifact to say why.
      #
      # **TWO frames per second, not one** (3.5.8.9). Cycle 8's 1fps sheet proved the beats were landing on
      # unpainted screens but could not say for how long — and "how long does this app take to paint after
      # a navigation on a shared runner" is exactly the measurement 3.5.8.8 (simulator vs device) needs.
      - name: Contact sheet (the first 40s, two frames per second)
        if: always()
        run: |
          ffmpeg -y -hide_banner -loglevel error -i capture-out/raw.mov \
            -vf "fps=2,scale=176:-2,tile=10x8" \
            -frames:v 1 capture-out/contact-sheet.jpg || echo "(contact sheet unavailable)"
          ls -la capture-out/contact-sheet.jpg || true

      # ⚠️ THE ANCHOR IS FOUND, NOT DECLARED — and this is the fifth attempt, which is why it works
      # differently from the four before it (3.5.8.9).
      #
      # A guessed constant, `blackdetect`, screenshot polling and a declared `LAUNCH_ALLOWANCE` all tried to
      # RECOVER the script's start from the recording. Cycles 7 and 8 then measured the same build's paint
      # moment 3 seconds apart, which settles it: the recording does not contain that number. So the app
      # states it — `CaptureSlate` holds one full-white frame for 350ms once the opening screen has
      # actually painted, and starts the beats as it clears.
      #
      # `negate` then `blackdetect`, because there is no `whitedetect`. Inverted, the slate is the only run
      # of near-black in a file whose content is a dark UI — the exact inversion of why `blackdetect` alone
      # failed on this app. `pic_th=0.90` (not the 0.98 default) because the Dynamic Island renders as a
      # black pill, which inverts to a bright patch of about 1% of the frame.
      - name: Find the slate (the frame the app said "I am painted")
        run: |
          DET=$(ffmpeg -hide_banner -nostats -i capture-out/raw.mov \
                  -vf "negate,blackdetect=d=0.15:pix_th=0.12:pic_th=0.90" -an -f null - 2>&1 || true)
          echo "$DET" | grep -o 'black_start:[0-9.]* black_end:[0-9.]* black_duration:[0-9.]*' || true
          T0=$(echo "$DET" | grep -o 'black_end:[0-9.]*' | head -1 | cut -d: -f2)

          # ⚠️ NO FALLBACK. Four cycles shipped a confident wrong number and reported success; a silent
          # default here would make that five. If the slate is not in the file, the run has nothing to
          # anchor to and says so — the contact sheet is already uploaded.
          if [ -z "$T0" ]; then
            echo "❌ No slate found in the recording."
            echo "   The capture build should flash one full-white frame the moment its opening screen"
            echo "   paints. Not finding it means one of: the app never reached /demo?capture=1, the"
            echo "   opening screen never painted, or EXPO_PUBLIC_CAPTURE_DEMO did not reach the bundle."
            echo "   Open contact-sheet.jpg in the artifact — a white tile answers which."
            exit 1
          fi

          echo "T0=$T0" >> "$GITHUB_ENV"
          echo "✅ slate ends at ${T0}s — the script's t=0, measured rather than assumed"

      # 3.5.8.7's evidence, taken from the RAW recording rather than the trimmed one so the offsets are
      # the script's own. The hard requirement this exists for: an empty Skia chart in a store video is
      # worse than no video, and the unpainted-canvas defect (3.5.8.4b) is a FIRST-FRAME artifact — so
      # each frame is pulled just after its beat lands, where the defect would be, not mid-beat where it
      # would have healed. **Cycle 8 confirmed it is NOT web-only**, so this evidence is the gate.
      - name: Pull the first frame of every beat
        run: |
          # Beat times are the SCRIPT's (DEMO_STAGES); raw-file time is that plus T0, the slate.
          #
          # `-ss` goes AFTER `-i` — the accurate seek, not the fast keyframe one (cycle 7's fix). But that
          # is not sufficient on its own: once the script ends the screen is static and the recorder emits
          # NO further frames, so cycle 8 still lost the last settled frame. Seeking past the final frame
          # cannot return anything.
          #
          # So when a seek comes back empty, fall back to the last frame at or BEFORE the target. On a
          # static screen that is not an approximation — it is literally what was on screen at that moment,
          # and it is a far better answer than the silent gap that made cycle 8's evidence partial.
          grab() {
            ffmpeg -y -hide_banner -loglevel error -i capture-out/raw.mov -ss "$1" -frames:v 1 "$2" 2>/dev/null || true
            if [ ! -s "$2" ]; then
              ffmpeg -y -hide_banner -loglevel error -i capture-out/raw.mov \
                -vf "select='lte(t,$1)'" -fps_mode passthrough -update 1 "$2" 2>/dev/null || true
              if [ -s "$2" ]; then
                echo "  ↳ $(basename "$2"): no frame at ${1}s, used the last one before it (the screen was static)"
              else
                echo "  ↳ $(basename "$2"): NO FRAME at ${1}s and none before it"
              fi
            fi
          }

          beats="1-debts:0 2-held:4 3-absorbed:9 4-trajectory:14 5-payoff:20"
          for entry in $beats; do
            name="${entry%%:*}"; at="${entry##*:}"
            first=$(awk -v p="$T0" -v a="$at" 'BEGIN { printf "%.2f", p + a + 0.20 }')
            late=$(awk -v p="$T0" -v a="$at"  'BEGIN { printf "%.2f", p + a + 3.30 }')
            # The FIRST frame after the beat lands is the one that matters: 3.5.8.4b's unpainted Skia is a
            # first-frame artifact, so a mid-beat sample would show it already healed and report a defect
            # as absent.
            grab "$first" "capture-out/beat-${name}-FIRST.png"
            # …and a settled frame, so "never painted" can be told apart from "painted a moment later".
            grab "$late"  "capture-out/beat-${name}-settled.png"
          done
          ls -la capture-out/

      # ⚠️ THE GUARD CYCLE 1 DID NOT HAVE, and the reason it shipped a green run with no capture in it.
      #
      # That run recorded 30 seconds of the iOS Home Screen behind an "Open in…?" prompt, extracted eight
      # frames, conformed them to a spec-perfect 886x1920/25s file, reported success and uploaded it. Every
      # step did its job; nothing asked whether the SCREEN EVER CHANGED. The tell was sitting in the
      # artifact listing — seven of the eight PNGs were byte-identical at 807686 bytes.
      #
      # This repo has now shipped that shape four times (a green Maestro run that wrote no screenshots, an
      # artifact glob that skipped a hidden path, a web-e2e red for a month against a retired app, and
      # this). So the check is on the ARTIFACT, not on the exit codes: five beats that are supposed to
      # show three different screens cannot all hash the same.
      - name: Fail if the capture never changed (a static recording is not a preview)
        run: |
          cd capture-out
          # `shopt -s nullglob` so a missing set yields an empty list rather than the literal glob. Cycle 2
          # printed "distinct settled frames: 0 of 0" and then blamed identical beats — two different
          # failures reported as one, in the very step written to make failures legible.
          shopt -s nullglob
          frames=(beat-*-settled.png)
          echo "settled frames found: ${#frames[@]}"

          if [ "${#frames[@]}" -eq 0 ]; then
            echo "❌ NO frames could be extracted from the recording."
            echo "   That is not 'the beats look alike' — ffmpeg found nothing at those timestamps, which"
            echo "   happens when the screen never changed: a static recording carries almost no frames to"
            echo "   seek to. Look at after-launch.png."
            exit 1
          fi

          distinct=$(md5 -q "${frames[@]}" | sort -u | wc -l | tr -d ' ')
          echo "distinct settled frames: $distinct of ${#frames[@]}"
          md5 -q "${frames[@]}" | sort | uniq -c | sort -rn

          if [ "$distinct" -lt 3 ]; then
            echo "❌ The beats do not differ — the app almost certainly never ran the demo."
            echo "   Look at after-launch.png: anything other than the app's own UI means the run never"
            echo "   started, which is how both earlier cycles failed."
            exit 1
          fi
          echo "✅ the screen actually changed across beats"

      - name: Conform to Apple's App Preview spec
        run: |
          chmod +x ../../scripts/conform-app-preview.sh
          # ⚠️ The `||` fallbacks are load-bearing on the TAG trigger: `inputs` only exists for
          # workflow_dispatch, so on a tag push these expand to empty strings. Empty would fall through to
          # the script's own defaults — which is exactly the kind of quiet divergence that produces a
          # correct-looking video trimmed from the wrong place.
          # Start at the SLATE, which is the app's own statement that its opening screen is painted. Cycle
          # 3 trimmed at a guessed 3.6s and opened on ~4.5s of black; cycle 8 trimmed at a declared 8.4s
          # and opened on black again. Neither was a bad guess — both were guesses at a quantity that
          # moves.
          #
          # The +0.05 clears the slate's own last frame (3 frames at 60fps, imperceptible) so no white
          # flash survives into the cut.
          #
          # An explicit dispatch input still wins, for the case where a human has watched the cut and wants
          # a different in-point. Empty on a tag push, so the found value is the normal path.
          OVERRIDE="${{ inputs.start_offset }}"
          if [ -n "$OVERRIDE" ]; then
            START="$OVERRIDE"
            echo "trimming from ${START}s (explicit override)"
          else
            START=$(awk -v t="$T0" 'BEGIN { printf "%.2f", t + 0.05 }')
            echo "trimming from ${START}s (the slate ended at ${T0}s)"
          fi
          DUR="${{ inputs.duration }}"
          [ -n "$DUR" ] || DUR=25
          ../../scripts/conform-app-preview.sh \
            capture-out/raw.mov \
            capture-out/app-preview-6.9in.mp4 \
            "$START" \
            "$DUR"

      - name: What was shot
        if: always()
        run: |
          {
            echo "device: ${SIM_DEVICE:-unknown}"
            echo "appearance: dark"
            echo "entry: EXPO_PUBLIC_CAPTURE_DEMO=1 build, launched (no deep link — iOS prompts on those)"
            # The `||` fallbacks again — cycle 1's notes read "trim: start=s duration=s" because `inputs`
            # is empty on a tag push and this line, unlike the conform's, had no default.
            echo "script t=0 (slate found at): ${T0:-NOT FOUND}s — the app's own mark, not an estimate"
            echo "trim: start=${{ inputs.start_offset || 'measured' }} duration=${{ inputs.duration || '25' }}s"
            echo "conformed: 886x1920 (covers every modern iPhone slot — 6.9/6.5/6.3/6.1)"
            echo "NOT captured: the payoff confirmation tap — see this workflow's header."
          } > capture-out/SHOT-NOTES.txt
          cat capture-out/SHOT-NOTES.txt

      - name: Upload the preview + the per-beat frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-preview
          if-no-files-found: warn
          path: apps/rn/capture-out/**
