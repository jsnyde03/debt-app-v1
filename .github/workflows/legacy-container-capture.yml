name: legacy-container-capture

# 5.1b.3 — CAPTURE A REAL v1.6 CONTAINER, ONCE.
#
# ⭐ WHY THIS EXISTS, AND WHY IT IS NOT PART OF THE NATIVE LANE.
# Phase 5's bridge has to read the WKWebView `localStorage` a v1.6 install left behind. The only honest
# fixture for that is a container an actual Capacitor build actually produced — synthesising one means
# writing a database where we GUESSED iOS puts it and then proving we can find it there, which proves
# nothing. (This repo has paid for the fixture-that-never-renders-the-real-state shape ten times.)
#
# ⛔ But the legacy tree is being DECOMMISSIONED (5.5.1 deletes it), so the probe must not take a standing
# dependency on it. 🎯 2026-08-19: *"why do we need the legacy branch on this phase? We have actively been
# decommissioning it."* Hence: run this ONCE, upload the container as an artifact, and from then on the
# recurring probe restores the artifact. After the capture, the legacy tree owes CI nothing.
#
# ⚠️ Dispatch, plus ONE tag pattern — no branch push, no schedule. It is a fixture generator, not a gate.
# (The tag trigger is not a preference; see the `on:` block. It is the only way to run this off a
# non-default branch, and it is what made run 1 check out the wrong tree.)
#
# ⚠️ NOT COVERED BY `lint:lane`, which scans `native-e2e.yml` and `app-preview.yml` only. That is an
# accepted trade for keeping the heavily-gated native lane untouched — and it is safe here precisely
# because this workflow is one-shot: a rotted one-shot is discovered the moment it is run, by the person
# running it, rather than silently.
#
# ⚡ IT ALSO ANSWERS 5.1's CORE QUESTION AS A SIDE EFFECT. The verify step prints the REAL on-disk paths of
# the localStorage databases on a real iOS simulator — the exact unknown the probe exists to resolve. Read
# that output even if the artifact is all you came for.

on:
  workflow_dispatch:
    inputs:
      legacy_ref:
        description: 'The branch holding the shipped Capacitor app'
        type: string
        default: 'v1.6-dev'
  # ⛔ THE `legacy-capture-*` TAG TRIGGER WAS RETIRED AT P6.7.1 (2026-08-21), ON ITS OWN TERMS.
  # It carried its removal condition in writing — *"REMOVE THIS TRIGGER once the artifact exists"* — and
  # the artifact exists: the capture ran, returned 22 keys, and `realContainer.test.ts` has been asserting
  # against the result ever since. A one-shot fixture generator that has fired is a standing hazard and
  # nothing else: **any push of such a tag spends a ~45-minute macOS runner** on a surface that ships
  # nowhere, and the prefix that made the trigger safe never made it cheap.
  #
  # ⚠️ It was deferred as *"retire it with the legacy tree at 5.5.1"*. **That tree then moved a whole phase
  # to P6.11, and the deferral silently moved with it** — which is why this is done independently. A
  # deferral attached to another item's date inherits that item's slippage without anyone deciding to.
  #
  # ⚠️ WHAT THIS COSTS, STATED PLAINLY: the workflow is now unrunnable until it is present on the DEFAULT
  # branch (`release/v1`), because `workflow_dispatch` registers only from there. That is correct for a
  # spent one-shot — and if it is ever needed again, the honest move is to land it on the default branch,
  # not to re-open a tag that fires a macOS runner on any push. **P6.11 deletes this file with the tree.**
  # The body is kept until then as archaeology: its verify step prints the REAL on-disk paths of the
  # localStorage databases on a real iOS simulator, which was 5.1's core unknown.

env:
  APP_ID: 'com.jasonsnyder.debtplanner'

jobs:
  capture:
    name: Build v1.6, run it, capture its container
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # ⚠️ The SHIPPED v1.6, not the legacy tree in v1.7-dev. That copy has drifted against shared
      # `packages/core` — a filter on a removed `AllocationCategory` member was silently dead — so a
      # fixture built from it would be a fixture of something we never shipped.
      # ⛔ `|| 'v1.6-dev'` IS LOAD-BEARING, AND ITS ABSENCE COST RUN 1.
      # `inputs.*` exists ONLY for `workflow_dispatch`. On the `push` trigger above it is EMPTY, so
      # `ref: ${{ inputs.legacy_ref }}` resolved to "" and checkout silently fell back to the pushed ref —
      # the tag on `v1.7-dev`. The job then built the CURRENT legacy tree, which still exists there, and
      # only failed four steps later when a v1.6 file was missing. ⚠️ **The trigger added to make this
      # runnable is what changed what it ran.** Any `inputs.*` in a workflow with a non-dispatch trigger
      # needs a default at the point of use.
      - name: Check out the shipped v1.6
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.legacy_ref || 'v1.6-dev' }}

      - name: Prove we checked out v1.6 and not something that merely builds
        run: |
          set -euo pipefail
          # v1.6 is a pure Capacitor tree. If `apps/` exists we are on a v1.7 ref and everything below
          # would produce a fixture of the wrong app — which is worse than producing none.
          if [ -d apps ] || [ -d packages ]; then
            echo "::error::checked-out ref has apps/ or packages/ — this is not the v1.6 tree"
            git log --oneline -1
            exit 1
          fi
          test -f .maestro/reconcile-smoke.yaml || { echo "::error::v1.6 smoke flow missing"; exit 1; }
          git log --oneline -1

      - name: Log the toolchain
        run: xcodebuild -version

      # Capacitor 8's CLI requires Node >= 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ⭐ `NEXT_PUBLIC_SIM_SMOKE=1` is what makes this fixture POPULATED rather than empty: that build
      # seeds nine bills into localStorage at module load, through the app's own `safeStorage.writeKey`
      # path — the same writer, the same keys, the same WKWebView store the bridge will read.
      # ⚠️ It is seeded rather than hand-typed, which is honest to state: it exercises the real WRITE
      # path, not a real user's data entry. For a MECHANISM fixture that is the property that matters.
      - name: Build the web bundle (seeded)
        run: NEXT_PUBLIC_SIM_SMOKE=1 npm run build

      - name: Sync the web bundle into the iOS project
        run: npx cap sync ios

      # Capacitor 8 uses SPM (`ios/App/CapApp-SPM`), so there is no `pod install` step here. Unsigned:
      # a simulator build needs no identity, and requiring one would make this need secrets it should not.
      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|startswith("iPhone"))][-1].udid')
          echo "Booting $UDID"
          for i in 1 2 3; do xcrun simctl boot "$UDID" && break || { echo "boot retry $i"; sleep 5; }; done
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # Recorded for the run summary only — the fixture is tied to one iOS version and a reader six
          # months from now needs to know which. ⚠️ Non-fatal: a jq expression is not worth losing a
          # 30-minute build over, and every step after this one works without it.
          RUNTIME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '[.devices|to_entries[]|select(.value[]?.udid==$u)|.key][0]' 2>/dev/null || echo unknown)
          echo "IOS_RUNTIME=${RUNTIME:-unknown}" >> "$GITHUB_ENV"

      - name: Install the app
        run: xcrun simctl install booted "ios/build/Build/Products/Debug-iphonesimulator/App.app"

      # ⛔ MAESTRO IS GONE, AND THAT IS THE SECOND FIX FROM RUN 1.
      # The app was never launched at all that run — the only thing that would have launched it was a
      # Maestro flow, and that step was deliberately NON-FATAL, so its failure passed silently and left
      # the container empty. A step that is allowed to fail must not be the only thing doing the
      # essential work. It also turns out not to be needed: the SIM_SMOKE build seeds localStorage at
      # module load, so a plain launch produces the same store with none of the UI-selector fragility.
      - name: Launch the app so it writes its storage
        run: |
          set -euo pipefail
          xcrun simctl launch booted "$APP_ID"
          # The WebView has to finish loading before the seed runs. There is no event to wait on from out
          # here, so this is a dwell — and the key-count check below is what actually decides the run.
          sleep 25
          # ⚠️ `terminate` is what makes WebKit COMMIT localStorage: it flushes lazily, so capturing a
          # running app can catch a store that is still only in memory.
          # ⛔ NOT `|| true`. Run 1 printed "found nothing to terminate" and carried on — that message was
          # the proof the app had never started, and swallowing it cost the run four more steps before
          # anything complained.
          xcrun simctl terminate booted "$APP_ID"
          sleep 5

      # ⛔ TAR FIRST, VERIFY AGAINST A COPY. Querying a SQLite database opens it read-write and can leave
      # `-wal`/`-shm` siblings behind — so verifying in place would mean shipping an artifact that the
      # verification itself had modified. Same rule the app's reader follows for the same reason.
      # ⛔ CAPTURE THE WHOLE `Library`, NOT A SUBDIRECTORY WE NAMED. Run 1 tarred `Library/WebKit`, which
      # assumed a layout — the same guess the app's reader deliberately refuses to make (it identifies the
      # database by CONTENTS, never by path). Capturing one directory up costs a few hundred KB and means
      # a fixture is still valid if Apple moves the store again. **Do not narrow this back down.**
      - name: Capture the container
        run: |
          set -euo pipefail
          CONTAINER=$(xcrun simctl get_app_container booted "$APP_ID" data)
          echo "container: $CONTAINER"
          echo "── what the app actually created ──"
          find "$CONTAINER" -maxdepth 3 -type d | sed "s|$CONTAINER|<container>|" | head -40
          if [ ! -d "$CONTAINER/Library" ]; then
            echo "::error::the container has no Library at all — the app did not run"
            exit 1
          fi
          mkdir -p capture
          tar -czf capture/webkit-container.tgz -C "$CONTAINER" Library
          echo "captured $(du -h capture/webkit-container.tgz | cut -f1)"

      # ⚡ THE STEP THAT MAKES THE ARTIFACT TRUSTWORTHY — and that answers 5.1's question directly.
      # A capture job that uploads an EMPTY container and reports success is worse than one that fails:
      # the probe would then read `keys=0`, correctly, and we would misdiagnose it as the bridge being
      # unable to read rather than the fixture having nothing in it.
      - name: Verify the captured container actually holds v1.6 data
        run: |
          set -euo pipefail
          rm -rf verify && mkdir -p verify
          tar -xzf capture/webkit-container.tgz -C verify
          echo "── localStorage databases, at their REAL on-disk paths ──"
          # ⚠️ Searched across the WHOLE captured Library, and matched on FILENAME only — no assumption
          # about which directory holds them. This output IS 5.1's answer: whatever it prints is where
          # iOS actually put the store on this runtime, which is the thing no local test could establish.
          find verify/Library \( -name '*.localstorage' -o -name 'localstorage.sqlite3' \) -print | tee found.txt
          if [ ! -s found.txt ]; then
            echo "::error::no localStorage database anywhere in the captured Library"
            echo "── the full captured tree, so the next run knows where to look instead ──"
            find verify/Library | head -120
            exit 1
          fi
          TOTAL=0
          while IFS= read -r db; do
            KEYS=$(sqlite3 "$db" "SELECT COUNT(*) FROM ItemTable WHERE key LIKE 'debtPlanner.%';" 2>/dev/null || echo 0)
            echo "  $db → $KEYS debtPlanner.* keys"
            if [ "$KEYS" -gt 0 ]; then
              echo "    sample keys:"
              sqlite3 "$db" "SELECT key FROM ItemTable WHERE key LIKE 'debtPlanner.%' ORDER BY key LIMIT 40;" | sed 's/^/      /'
            fi
            TOTAL=$((TOTAL + KEYS))
          done < found.txt
          echo "TOTAL debtPlanner.* keys: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::the container was captured but holds NO debtPlanner.* keys — the fixture would prove nothing"
            exit 1
          fi
          {
            echo "### Legacy container captured"
            echo ""
            echo "- iOS runtime: \`${IOS_RUNTIME:-unknown}\`"
            echo "- \`debtPlanner.*\` keys: **$TOTAL**"
            echo ""
            sed "s|^verify/Library/|  - \`|; s|$|\`|" found.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the container fixture
        uses: actions/upload-artifact@v4
        with:
          name: legacy-webkit-container
          path: capture/webkit-container.tgz
          if-no-files-found: error
          retention-days: 90
