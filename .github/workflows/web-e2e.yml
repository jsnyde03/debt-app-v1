name: web-e2e

# Gates lint + the tsx regression (money-math) suite + the Playwright e2e suite — the "keep suites
# green" CI backstop (v1.5 step 2.14 started the e2e gate; v1.6 step 1.1 added lint + regression).
# Runs the functional specs against the PRODUCTION static build: playwright.config.ts's
# webServer does `npm run build && serve out` with NEXT_PUBLIC_E2E=1, and reuseExistingServer
# is off under CI so every run builds fresh. Kept on GitHub Actions (not Codemagic) to conserve
# Codemagic minutes for native builds.

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels an in-progress run — don't stack builds.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast: lint + the tsx reconciliation/regression suite (the money-math backstop for
      # every refactor) run BEFORE the slow browser install + prod build + e2e. Through v1.5 these
      # were UNGATED — CI ran only Playwright, so a refactor that broke the engine math wouldn't
      # turn CI red. Gating them here is the v1.6 keep-green backstop (checkpoint #3).
      - name: Lint
        run: npm run lint

      - name: Regression tests (money-math backstop)
        run: npm run test:regression

      # Cache the downloaded browser binaries (~/.cache/ms-playwright), keyed on the
      # Playwright version pinned in package-lock. A cold Chromium+WebKit download runs
      # several minutes on a good day and has hung >20min on a bad-CDN day; caching skips
      # it entirely on every subsequent run. (v1.7 CI-hygiene, folded in early after a hang.)
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Pixel 7 → Chromium; iPhone/iPad devices → WebKit. Both needed for the 4 projects.
      # Cache MISS → full binary download + OS deps. Cache HIT → only the apt-level libs
      # (not stored in the browser cache). The per-step timeout turns a hung CDN download
      # into a fast, retryable failure instead of a 30-min job stall.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit

      # webServer (build + serve out, NEXT_PUBLIC_E2E=1) is launched by Playwright itself.
      - name: Run e2e suite
        run: npx playwright test

      # Surface the HTML report + traces on failure so a red gate is debuggable.
      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
