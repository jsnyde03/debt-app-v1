name: web-e2e

# The every-push gate. Runs every link of `validate:release:rn` except `gate:record` — the RN app's own
# typecheck + lint + engine suites, the Playwright e2e against the static web export
# (`expo export --platform web` → `dist/`, served as an SPA; `apps/rn/playwright.config.ts` builds it
# itself whenever CI is set), and the embed suite against its own separate export.
#
# ⛔ THE EQUIVALENCE ABOVE IS LOAD-BEARING AND WAS FALSE — [W1-3]. `embed-pages.yml`'s [D44] guard refuses
# to deploy any SHA without a green `web-e2e`, and that edge is built entirely on this header's claim.
# But the step list had drifted from the `validate:release:rn` chain and was missing `test:stamp`,
# `test:e2e:embed` and the `packages/core` half of the typecheck — so the guard was gating the marketing
# embed on a run that never exercised the embed. Three links were absent while the header said "runs the
# gate". ⚠️ If a link is added to `validate:release:rn`, it must be added here in the same commit, or the
# claim silently rots again — nothing compares the two lists.
#
# `gate:record` is the one deliberate omission: it writes `gate-status.json`, a local record of a pass on
# a specific tree, and a CI runner writing it into a throwaway checkout records nothing anyone reads.
#
# ⚠️ It used to gate the LEGACY Capacitor/Next app (`npm run lint`, `npm run build && serve out`), which
# was retired on 2026-07-24 when `validate:release` was repointed at the RN gate. The workflow was never
# repointed with it, so from then on this lane was red on EVERY push for a reason that had nothing to do
# with the shipping app: the root eslint config walks into `apps/rn` and rejects `require()` in
# `metro.config.js` and the Expo plugins. A permanently-red gate is worse than no gate — it trains you to
# ignore the one signal that is supposed to mean something — and it meant the real suites only ever ran
# on Jason's machine. The legacy suite is not run anywhere now, deliberately: Phase 5.5.1 deletes that
# tree, and its Next build no longer typechecks against the RN sources it has been dragged into.
#
# The native lane (`native-e2e.yml`) is the complement, not a substitute: it is manual-only and sees what
# a browser structurally cannot. This one is cheap enough to run on every push.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels an in-progress run — don't stack builds.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: RN gate (typecheck · lint · stamp · engine · e2e · embed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No npm workspaces — install root (core/tooling) then the RN app's own node_modules, the same
      # two-step the native lane needs.
      #
      # ⚠️ `npm ci` works at the root and NOT in apps/rn: that lockfile is out of sync with its
      # package.json (`npm ci` reports ~12 missing transitive entries — @testing-library/dom,
      # react-native-nitro-modules, the @react-native/metro-* chain). `npm install --prefer-offline` is
      # what the native lane has always used there and it resolves them. Filed to the backlog as its own
      # fix: an unusable lockfile means installs are not reproducible, which is worth correcting
      # deliberately rather than as a side effect of a CI change.
      - name: Install dependencies (root + apps/rn)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/rn install --prefer-offline --no-audit --no-fund

      - name: Link ./core so tsc can resolve @core
        # tsconfig maps `@core/*` → `apps/rn/core/*`, a symlink Metro creates at startup and does NOT
        # commit. tsc runs before any Metro invocation here, so on a fresh checkout every @core import
        # would fail. Metro's own `if (!exists)` guard no-ops later.
        working-directory: apps/rn
        run: |
          [ -e core ] || ln -s ../../packages/core core
          ls -la core

      # Fail fast, cheapest first: types, then lint, then the engine suites, and only then the browser.
      # `validate:release:rn` runs exactly these in one command locally; they are split here so a red run
      # names the stage it died in without opening the log.
      # ⛔ `npm run typecheck`, NOT `npm --prefix apps/rn run typecheck` — [W1-3]. The gate's first link is
      # `typecheck:core && typecheck:rn && typecheck:scripts`; the prefixed form is only the RN third, so
      # `packages/core` — where every money primitive lives — was never typechecked on any push.
      # ⚠️ `typecheck:scripts` is [P6.8.7a-1]: the 17 house guards had no compiler behind them, and the
      # only config that included them belongs to the tree P6.11 deletes.
      - name: Typecheck (core + RN + scripts)
        run: npm run typecheck

      - name: Lint (RN + the house guards)
        run: npm run lint:rn

      # Cheap and self-contained: every scenario runs against a COPY of the checklist in a temp dir, so
      # this touches nothing in the checkout. Early because it costs seconds and fails loudly.
      - name: Stamp-coverage writer proofs
        run: npm run test:stamp

      - name: Regression tests (money-math backstop)
        run: npm run test:regression

      - name: App-layer tests
        run: npm run test:app

      - name: Scenario tests
        run: npm run test:scenarios

      # Cache the downloaded browser binaries (~/.cache/ms-playwright), keyed on the Playwright version
      # pinned in package-lock. A cold download runs several minutes on a good day and has hung >20min on
      # a bad-CDN day. Chromium ONLY — the RN config declares one project (desktop-chrome), so the WebKit
      # download the legacy config needed is now pure cost.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      # The config's webServer runs `export:web` then serves `dist/` on :4319. `reuseExistingServer` is
      # off under CI, so every run builds fresh — which is also what keeps a stale `dist` from being
      # served, the local-only hazard called out in the plan's Phase-4 notes.
      - name: Run the RN e2e suite
        run: npm run test:e2e:rn

      # ⛔ THE SUITE THE [D44] PAGES GUARD IS ACTUALLY ABOUT — [W1-3]. `embed-pages.yml` refuses to deploy
      # a SHA without a green run of THIS workflow, and until now the only suite exercising the published
      # artifact was the one this workflow did not run. The `build` job's grep-for-base-path was the first
      # and only check the embed got in CI.
      #
      # ⚠️ Its own config builds a SEPARATE export (`dist-embed`, `--clear`, port 4320) — a second cold
      # Metro export, which is why `timeout-minutes` went up with this step. That cost is deliberate: the
      # `--clear` is measured, not defensive, because Metro's transform cache does not invalidate on an
      # `EXPO_PUBLIC_*` change and a warm build silently tests the wrong artifact.
      - name: Run the embed e2e suite
        run: npm run test:e2e:embed

      # Surface the traces (`trace: 'on-first-retry'`) so a red gate is debuggable. Paths resolve relative
      # to the CONFIG's directory, so they land under apps/rn, not the repo root.
      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/rn/playwright-report/
            apps/rn/test-results/
          if-no-files-found: ignore
          retention-days: 14
