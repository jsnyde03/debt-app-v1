name: ios-sim-smoke

# Renders the app in a REAL iOS Simulator (true WKWebView) and screenshots the
# payday reconciliation view — the device-only layer that Chromium AND Playwright's
# WebKit can't reproduce (this is the gate that would have caught the v1.6
# reconcile-row overlap before a TestFlight build). Runs on a GitHub-hosted macOS
# runner, which is FREE for public repos (no Codemagic Mac minutes spent) and runs
# on push, i.e. BEFORE Codemagic is ever kicked off.
#
# Manual for now (workflow_dispatch): run it before cutting a build. Once proven,
# uncomment the `push` trigger below to auto-run on UI changes.

on:
  workflow_dispatch:
  # workflow_dispatch's "Run workflow" button only appears once this file is on the
  # DEFAULT branch (release/v1). Until then, a path-filtered push trigger on the
  # active branch runs it automatically — and won't fire on doc-only commits.
  push:
    branches: ["v1.6-dev"]
    paths:
      - "components/**"
      - "app/**"
      - "lib/**"
      - ".maestro/**"
      - ".github/workflows/ios-sim-smoke.yml"

# A newer push to the same ref cancels an in-progress run — don't stack macOS jobs.
concurrency:
  group: ios-sim-smoke-${{ github.ref }}
  cancel-in-progress: true

# Sim builds are unsigned; no code-signing secrets needed.
env:
  APP_ID: "com.jasonsnyder.debtplanner" # matches .maestro/reconcile-smoke.yaml

jobs:
  ios-sim-smoke:
    # macos-15 → Xcode 16 by default, which Capacitor 8 requires (macos-14's
    # Xcode 15 fails to compile the plugins' Swift).
    runs-on: macos-15
    timeout-minutes: 40
    # Write access so the first run can auto-commit the golden baselines it captures.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # (No explicit Xcode pin: the macos-15 default Xcode compiles Capacitor 8 and
      # runs Maestro's iOS driver — pinning to the highest Xcode_16*.app risked a
      # sim-runtime the driver couldn't attach to. `xcodebuild -version` is logged
      # below for the record.)
      - name: Log Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI (npx cap sync) requires Node >=22 — higher than web-e2e's
          # Node 20 (which doesn't run cap sync, so it's fine there).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bake the SIM_SMOKE seed into the web bundle (stress fixture: 9 long-named
      # bills, payday auto-opens). Inert in every non-flagged build.
      - name: Build web (SIM_SMOKE seed)
        run: NEXT_PUBLIC_SIM_SMOKE=1 npm run build

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      # Diagnostics — if the scheme name ever changes, this surfaces it in the log.
      - name: List Xcode schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj || true

      # Cache compiled plugins + resolved SPM packages so subsequent runs skip the
      # ~10-min from-scratch plugin compile. The web bundle is re-synced (cap sync,
      # uncached) each run, so app CONTENT stays fresh — only Swift compilation is
      # reused. Busts on a plugin/version change via the lockfile + pbxproj hash.
      - name: Cache Xcode build (DerivedData + SPM)
        uses: actions/cache@v4
        with:
          path: |
            ios/build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('package-lock.json', 'ios/App/App.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build the app for the iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          # Pick any available iPhone by UDID (device names vary by runner image);
          # the smoke test just needs an iPhone-sized screen.
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|startswith("iPhone"))][-1].udid')
          echo "Booting $UDID"
          for i in 1 2 3; do xcrun simctl boot "$UDID" && break || { echo "boot retry $i"; sleep 5; }; done
          xcrun simctl bootstatus "$UDID" -b

      - name: Install the app
        run: |
          APP_PATH="ios/build/Build/Products/Debug-iphonesimulator/App.app"
          echo "Installing $APP_PATH"
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Freeze the status bar to Apple's canonical 9:41 / full signal / full battery —
      # so screenshots are DETERMINISTIC (the live clock would otherwise change every
      # run and defeat the golden-image diff) and marketing-clean.
      - name: Freeze the status bar
        run: |
          xcrun simctl status_bar booted override \
            --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Smoke test — dark theme
        run: |
          xcrun simctl ui booted appearance dark
          # Retry: Maestro's iOS driver startup is a known CI flake ("driver timed out").
          n=0; until maestro test .maestro/reconcile-smoke.yaml; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "maestro retry $n"; sleep 15;
          done
          mkdir -p artifacts/dark
          mv reconcile-*.png artifacts/dark/ 2>/dev/null || true

      - name: Smoke test — light theme
        run: |
          xcrun simctl ui booted appearance light
          n=0; until maestro test .maestro/reconcile-smoke.yaml; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "maestro retry $n"; sleep 15;
          done
          mkdir -p artifacts/light
          mv reconcile-*.png artifacts/light/ 2>/dev/null || true

      # Golden-image gate: diff the true-WKWebView screenshots against committed
      # baselines. Missing baselines are captured (bootstraps on first run); a real
      # layout regression writes a diff image + FAILS the job.
      - name: Visual regression (golden-image)
        run: node scripts/compare-ios-screenshots.mjs artifacts tests/ios-baselines

      # Persist any newly-captured baselines back to the branch (tests/** isn't in
      # the push path filter, so this doesn't re-trigger the workflow).
      - name: Commit new golden baselines
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain tests/ios-baselines)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/ios-baselines
            git commit -m "chore(ios-sim-smoke): capture golden baselines [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "baseline push skipped"
          else
            echo "no baseline changes"
          fi

      # Surface the outcome inline on the run page (no artifact download needed to
      # know what happened; the images themselves stay in the artifact).
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## iOS-Simulator smoke test — reconcile view"
            echo ""
            echo "True-WKWebView screenshots (dark + light) are in the **ios-sim-screenshots** artifact."
            echo "Golden-image diff vs \`tests/ios-baselines\`; a populated \`artifacts/diffs/\` means a layout regression (and the job failed)."
            if [ -d artifacts/diffs ] && [ -n "$(ls -A artifacts/diffs 2>/dev/null)" ]; then
              echo ""
              echo "> ⚠️ **Visual regression detected** — see \`artifacts/diffs/\`."
            else
              echo ""
              echo "> ✅ No visual regression."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WKWebView screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-screenshots
          path: |
            artifacts/**
            ~/.maestro/tests/**/*.png
          retention-days: 14
          if-no-files-found: warn
