# 3.5.7.8 — THE MARKETING EMBED, DEPLOYED TO GITHUB PAGES.
#
# [D32] chose Pages for one reason worth restating: it is **static-only by construction**. It cannot run
# server code, which is exactly the property 3.5.7's privacy claim asserts — so the host enforces the
# claim rather than being trusted to honour it. Vercel/Cloudflare would buy a CDN and an analytics
# surface a marketing demo needs neither of, and each adds an ASC privacy-label entry.
#
# ⛔ THE BASE PATH IS NOT OPTIONAL AND NOT COSMETIC. A Pages *project* site serves under `/<repo>/`, and
# `expo export` emits asset paths absolute from ROOT unless `experiments.baseUrl` is set — so a deploy
# without `EXPO_PUBLIC_BASE_URL` renders a **blank page with a 200 on the document**. Measured before it
# could ship, along with its sequel: the variable must carry the `EXPO_PUBLIC_` prefix, because Metro
# inlines only that prefix into the bundle and CanvasKit's `locateFile` needs the same value in the
# browser. Named `EXPO_BASE_URL` first, and `canvaskit.wasm` went on 404-ing at root while the HTML was
# perfectly correct.
#
# ⚠️ THE SAME VALUE IS IN `playwright.embed.config.ts`, deliberately, and that is the point rather than a
# duplication to tidy: the gate builds and serves the embed under this exact base path, so the
# configuration that is TESTED is the configuration that SHIPS. Until 3.5.7.8 the gate proved the embed
# worked at root and Pages served it from a subpath — the one arrangement nothing exercised.
name: Deploy the marketing embed (GitHub Pages)

on:
  # ⛔ MANUAL ONLY. A deploy is outward-facing, and the privacy claim it publishes is gated by
  # `validate:release:rn`, which runs separately. Publishing on every commit would mean publishing states
  # no gate had passed yet.
  #
  # ⚠️ **MANUAL IS NOT THE SAME AS SAFE, and P6.7.2 was filed believing it was.** The plan called for
  # "flipping the deploy allow-list to `release/v1`" — there is no allow-list here and never was, so
  # there was nothing to flip and the exposure was somewhere else: **`workflow_dispatch` lets whoever
  # runs it choose ANY ref.** The button is registered from the default branch (`release/v1`), but the
  # ref it runs against is a dropdown. So a dev branch could publish to the public marketing URL with no
  # gate, no push, and no allow-list involved. The guard is therefore IN THE JOB (see `guard` below),
  # where it can see the ref that was actually selected.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # [D44] reads this repo's own workflow runs to prove the SHA passed `web-e2e`. `contents: read` does not
  # cover the Actions API.
  actions: read

# One deploy at a time; never cancel one in flight, because a half-finished Pages publish is a live site.
concurrency:
  group: embed-pages
  cancel-in-progress: false

jobs:
  # ⛔ P6.7.2 + [D44] — THE TWO THINGS THAT MUST BE TRUE BEFORE ANYTHING IS BUILT, LET ALONE PUBLISHED.
  #
  # A separate job that `build` depends on, rather than steps inside `build`, and the reason is not tidiness:
  # a guard that lives inside the job it guards has already spent the export by the time it speaks, and —
  # worse — is one `if:` away from being skipped. As its own `needs:` edge it is structural. GitHub will
  # not start `build` if this fails.
  #
  # ⚠️ Neither check can be replaced by a branch filter on the trigger. There is no push trigger here at
  # all: the only way in is a dispatch, and a dispatch carries a ref chosen at run time.
  guard:
    name: Only release/v1, and only a SHA that passed the gate
    runs-on: ubuntu-latest
    steps:
      # P6.7.2 — the REF. `github.ref` is the ref the dispatcher selected, which is the thing at issue.
      - name: Refuse any ref that is not release/v1
        run: |
          set -euo pipefail
          echo "ref=${{ github.ref }}  sha=${{ github.sha }}"
          if [ "${{ github.ref }}" != "refs/heads/release/v1" ]; then
            echo "⛔ This workflow publishes to the PUBLIC marketing URL. Only release/v1 may do that."
            echo "   Selected ref: ${{ github.ref }}"
            echo "   Merge to release/v1 and dispatch from there — do not relax this to ship a preview."
            exit 1
          fi
          echo "✅ ref is release/v1"

      # [D44] — the GATE. "Deployed" and "passed the gate" were held together by discipline alone; this is
      # the edge that makes one imply the other.
      #
      # ⚠️ Asserts on THIS SHA, not on the branch and not on the latest run. A branch-level query is
      # satisfied by a green run from three commits ago, which is exactly the state that would let an
      # ungated change publish while every dashboard reads green.
      #
      # ⛔ `conclusion == 'success'` explicitly, never `!= 'failure'` — a cancelled, skipped, timed-out or
      # action-required run is not a pass, and the negative form admits all four.
      #
      # ⚠️ `web-e2e` runs on `push: ["**"]`, so a SHA that reached release/v1 by any normal route has one.
      # A SHA with NO run at all fails here, deliberately: "never tested" and "tested and failed" are
      # different facts and neither is a licence to publish.
      #
      # ⚠️ ONE EDGE, DECIDED RATHER THAN INHERITED: a SHA whose run went GREEN and was then re-run RED
      # still passes, because [D44] asks whether the SHA *has* a green run and one exists. That is the
      # right default for the common cause (infra flake on a re-run), and the wrong one if a genuinely
      # flaky test is being papered over — but the counter-rule ("any red ever revokes") would let a
      # single infra blip permanently block a good SHA with no way forward except a new commit. Revisit
      # if a red-after-green is ever observed here; do not change it on taste.
      # ⚠️ `gh api --jq` ONLY — no pipe to a standalone `jq`. Both are on `ubuntu-latest` today, but the
      # first is part of the tool already being invoked and the second is an ambient assumption. Measured
      # while writing this: simulating the piped version on a machine WITHOUT `jq` made every case — no
      # runs, one failure, cancelled, in-progress — come out as ALLOW, because the count landed empty and
      # the numeric test errored past the refusal. `set -euo pipefail` does catch that in CI, so the
      # shipped version was fail-closed either way; a guard that is safe only because of a shell option
      # set three lines above it is not a guard worth writing.
      - name: Refuse a SHA with no green web-e2e run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GREEN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/web-e2e.yml/runs?head_sha=${{ github.sha }}&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          echo "green web-e2e runs for ${{ github.sha }}: '${GREEN}'"
          # ⛔ FAIL CLOSED, EXPLICITLY. An empty result means the query did not answer — a rate limit, a
          # permissions gap, a renamed workflow file — and "we could not tell" must never read as "yes".
          if [ -z "${GREEN}" ] || ! [ "${GREEN}" -gt 0 ] 2>/dev/null; then
            echo "⛔ No COMPLETED, SUCCESSFUL web-e2e run for ${{ github.sha }} (or the query failed)."
            echo "   A deploy must not outrun its own gate. Push the SHA, let web-e2e go green, then dispatch."
            exit 1
          fi
          echo "✅ ${GREEN} green web-e2e run(s) for this SHA"

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      # ⛔ THE SIBLING WORKFLOW ALREADY WROTE THIS DOWN, AND THE FIRST DEPLOY FAILED BECAUSE I DID NOT READ
      # IT. A bare `npm ci` at the root leaves `apps/rn` with no `node_modules`, and `expo export` dies on
      # `Failed to resolve plugin for module "expo-router"`. There are **no npm workspaces** here: root
      # (core/tooling) and the RN app are two installs.
      #
      # ⚠️ And `npm ci` works at the root but NOT in `apps/rn` — that lockfile is out of sync with its
      # package.json (~12 missing transitive entries), so `npm install --prefer-offline` is what the native
      # lane and `web-e2e` both use there. Filed separately as its own fix; an unusable lockfile means
      # installs are not reproducible, which deserves correcting deliberately rather than as a side effect.
      - name: Install dependencies (root + apps/rn)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/rn install --prefer-offline --no-audit --no-fund

      # `tsconfig` maps `@core/*` → `apps/rn/core/*`, a symlink Metro creates at startup and does not
      # commit. Harmless if Metro would make it anyway; required if anything reads it first.
      - name: Link ./core so the bundler can resolve @core
        working-directory: apps/rn
        run: '[ -e core ] || ln -s ../../packages/core core'

      # ⚠️ `--clear` IS LOAD-BEARING, and it is measured (3.5.7.4). Metro's transform cache does NOT
      # invalidate on an `EXPO_PUBLIC_*` change, so an embed export can silently reuse transforms from a
      # non-embed build — which is how `dist` and `dist-embed` once came out with the same content hash.
      # A cold runner would probably be fine; "probably" is not what should stand behind a privacy claim.
      - name: Export the embed build
        working-directory: apps/rn
        env:
          EXPO_PUBLIC_EMBED: '1'
          # ⚠️ Derived from the repo name, not hardcoded — a rename would otherwise produce a blank site
          # whose only symptom is 404s in a console nobody has open.
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
        run: npm run export:web -- --output-dir ../../_site --clear

      # ⛔ THE ARTIFACT MUST CONTAIN THE BASE PATH. `upload-pages-artifact` will happily ship a blank site,
      # and Pages will serve it with a 200 — the failure this whole item exists to avoid, arriving at the
      # one step no test covers. So the deploy asserts on its own output before publishing it.
      - name: Prove the artifact is base-pathed before publishing it
        run: |
          set -euo pipefail
          BASE="/${{ github.event.repository.name }}"
          echo "expecting asset paths under ${BASE}"
          grep -q "src=\"${BASE}/_expo/" _site/index.html \
            || { echo "⛔ index.html does not reference ${BASE}/_expo — this artifact would render blank"; \
                 grep -o 'src="[^"]*"' _site/index.html | head; exit 1; }
          test -f _site/canvaskit.wasm || { echo "⛔ canvaskit.wasm missing — every Skia chart would fail"; exit 1; }
          echo "✅ base path present, wasm present"

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
