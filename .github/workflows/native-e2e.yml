# Native E2E on a GitHub-Actions macOS runner: expo prebuild → compile the RN app for the iOS
# Simulator (unsigned) → boot → run Maestro flows. This is the Codemagic-FREE native-verification loop
# (GH macOS minutes are separate from the Codemagic 500) — it catches native-only bugs the web
# Playwright gate structurally can't (gesture/tap behavior, New-Arch launch crashes, autolinked native
# modules, the widget/App-Group compile), WITHOUT a signed device build. Mirrors Freedom's native-e2e.
#
# Builds the EXPO RN app in apps/rn (NOT the retired Capacitor app). Manual / release-gated only — mac
# minutes are ~10× Linux, so never every-push.
#
# ⚠️ FIRST-RUN TUNING (not locally verifiable — no macOS here): the generated scheme/workspace name
# (app.json name "Debt Planner (RN)" → expected "DebtPlannerRN"), the simulator device name, whether
# Maestro needs idb-companion on this runner, and the .maestro selectors may each need one adjustment
# on the first GH-Actions run — exactly as Freedom's first run did.
name: Native E2E (Maestro · iOS Simulator)

on:
  # MANUAL ONLY — never auto-runs on push (a ~40-min mac job is overkill per-commit, free or not). Use
  # the "Run workflow" button in GitHub → Actions → Native E2E, and pick the branch (v1.7-dev) to test.
  # ⚠️ That button only appears once THIS file exists on the DEFAULT branch, so the file is committed
  # there too (it runs the SELECTED branch's code, not the default branch's).
  # ⚠️ CORRECTED 2026-08-07: this repo's default branch is **release/v1**, not `master` — `master` does
  # not exist. This file is on release/v1, which is why the button works; the old note named a branch
  # that never carried it.
  workflow_dispatch:
    inputs:
      # 4.1.1 — the CAPABILITY PROBE lane. `.maestro/probe/` holds one unproven command per file and is
      # NOT part of the suite: its files are expected to fail until each command is confirmed to work on
      # this Maestro build, which is the entire point of running them.
      #
      # ⚠️ This input exists so a probe run cannot disturb flows 01–06. Those depend on each other through
      # filename order and on 01's seeded state; a probe file dropped among them would both break that
      # chain and take the whole suite down with its own parse failure (Maestro validates a FILE before
      # executing any of it — see the header of 06-tutorial-interactions.yaml).
      mode:
        description: 'suite = the real flows 01-06 · probe = the 4.1.1 capability probe (each file run separately, all verdicts collected)'
        type: choice
        options: [suite, probe]
        default: suite
      # 4.1.3a — the escape hatch for the .app cache below. Ticking this forces a full prebuild + pod
      # install + compile even when the key hits. It exists because "I do not trust that binary" must
      # always have a one-click answer that does not involve editing the workflow.
      rebuild:
        description: 'Force a clean native build (ignore the cached .app)'
        type: boolean
        default: false
      # 4.1.5 / [D30] — the iPad lane is THREE TIERS IN ONE DIRECTORY, and the device is an INPUT
      # carrying its own explicit flow list. Not a duplicated `.maestro-ipad/` set: this repo has priced
      # parallel test surfaces twice (the two screenshot mechanisms, whose stale frames masked the
      # sandbox theme defect; Wave A's "two places, one rule" landing three times in one wave).
      #
      # ⚡ 4.1.3a is what makes `both` affordable. The `.app` is device-agnostic and the cache key does
      # not mention the device, so the iPad run restores the SAME binary — its marginal cost is Maestro
      # time, not another 17-minute build.
      #
      # ⚠️ A tag push supplies no inputs, so `inputs.device` is empty there and only the iPhone list
      # runs. That is deliberate for now — the iPad tier is a measurement lane, not yet a release gate.
      device:
        description: 'iphone = flows 01-08 · ipad = the [D30] iPad tier (shared seed + iPad-only) · both'
        type: choice
        options: [iphone, ipad, both]
        default: iphone
  push:
    tags: ['v*'] # release tags → a gated native smoke before shipping

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Compile · boot · Maestro
    runs-on: macos-15
    # ⚠️ 75, raised from 60 on 2026-08-12. Run 31636187156 hit the 60-minute wall mid-iPad-tier and was
    # cancelled — the `if: always()` collect/upload steps still ran, so the artifact survived, but that
    # was luck rather than design and the tier produced no result at all. The iPad boot loop that caused
    # it is gone (geometry is read from disk now), so this is headroom against the NEXT surprise, not a
    # licence for a slow step.
    timeout-minutes: 75
    env:
      # `@sentry/react-native/expo` hooks the Xcode "Bundle React Native code and images" phase and runs
      # `sentry-cli` to upload source maps AFTER bundling. On this runner there is no org slug and no auth
      # token, so sentry-cli exits non-zero and takes the whole phase script — and therefore the build —
      # down with it. The JS bundles perfectly; the failure is entirely in the upload that follows it.
      #
      # Which makes the failure maximally misleading: xcodebuild reports
      # `PhaseScriptExecution Bundle React Native code and images ... (2 failures)`, which reads as a
      # BUNDLING error, and the log's most prominent line is React's benign umbrella-header warning.
      #
      # Disabling upload is the right answer here, not a workaround: this is an unsigned, unoptimized
      # simulator build that exists to be driven by Maestro for ~10 minutes and thrown away. Source maps
      # for it have no consumer. The SIGNED Codemagic build is where symbolication matters, and it has
      # the credentials — this variable is scoped to this workflow and does not touch it.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    # RN 0.85's PREBUILT React core (the fast default, RCT_USE_PREBUILT_RNCORE=1) doesn't export every
    # legacy ObjC class, so react-native-ios-utilities' reference to `_OBJC_CLASS_$_RCTRootContentView`
    # (pulled in by react-native-ios-context-menu) was undefined at LINK for arm64. FIX = the prebuild
    # config plugin `plugins/with-ios-utilities-rootcontentview-fix.js`, which strips that reference — so
    # the symbol's absence no longer matters and we keep the FAST prebuilt core. NOTE: setting
    # RCT_USE_PREBUILT_RNCORE=0 (build core from source) was tried first (commit 199c384) and STILL failed
    # at link — the env approach was ineffective + slower; the plugin is the real fix. ⚠️ Codemagic's
    # signed RN build therefore does NOT need any RCT_USE_PREBUILT_RNCORE override — the plugin runs at its
    # prebuild too.
    # (default RCT_USE_PREBUILT_RNCORE=1 — no override needed.)
    # NOTE: ccache was removed (2026-07-28) — RN's ccache wiring set a compiler-launcher path that DIDN'T
    # resolve for the widget-extension target (`@bacons/apple-targets`, in the app project not Pods),
    # failing the DebtWidget link with "unable to spawn ccache-clang.sh"; it also conflicted with
    # Xcode 26's explicit modules. Its only benefit was incremental compile caching. This is the FREE
    # unlimited pipeline, so wall-clock isn't a $ cost. Revisit a correct ccache setup (widget target
    # excluded) later as a deliberate speed pass if build time becomes painful.
    defaults:
      run:
        working-directory: apps/rn
    steps:
      # ⚠️ `fetch-depth: 0` (4.1.3a) — the default depth-1 checkout cannot diff against the commit a
      # cached .app was built at, which is precisely the audit the provenance step exists to print.
      # A shallow clone would leave that safeguard printing "(cannot diff)" forever, which is worse
      # than not having it: it looks like a check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm workspaces — install root (core/tooling) then the RN app's own node_modules. `@core` is a
      # Metro source alias, so it needs no build/link.
      - name: Install dependencies (root + apps/rn)
        working-directory: .
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm --prefix apps/rn install --prefer-offline --no-audit --no-fund

      # Cache the CocoaPods + Swift-PM DOWNLOADS (not the compile) so cold runs don't re-fetch the native
      # deps (incl. @bacons/apple-targets). Keyed on the RN lockfile.
      - name: Cache CocoaPods + Swift-PM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Caches/org.swift.swiftpm
          key: pods-spm-${{ runner.os }}-${{ hashFiles('apps/rn/package-lock.json') }}
          restore-keys: |
            pods-spm-${{ runner.os }}-

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Link ./core so tsc can resolve @core before Metro runs
        # tsconfig maps `@core/*` → `./core/*`, a symlink Metro creates at startup (NOT committed). tsc
        # runs before any Metro invocation here, so on a fresh checkout the link is absent → every @core
        # import fails. Create it up front (Metro's own `if (!exists)` guard then no-ops later).
        run: |
          [ -e core ] || ln -s ../../packages/core core
          ls -la core

      - name: Fail fast (typecheck before the slow native build)
        run: npx tsc --noEmit

      # ── 4.1.3a · THE BUILT-.app CACHE ───────────────────────────────────────────────────────────
      # Measured on run 31516616133: prebuild + pod install + compile = 17m03s of a 31m47s job, and
      # **648 of ~650 CompileC tasks belong to third-party pods** (RNScreens 103, RNReanimated 103,
      # RNSVG 94, ReactCodegen 57, RNWorklets 44, MMKVCore 33, Skia 27 …). The app's own native code does
      # not reach the top 15. That work is identical on every run until a dependency changes, and the
      # 4.1.4→4.1.11 loop edits `.maestro/**` YAML against an unchanged app.
      #
      # ⛔ THE HAZARD IS THE WHOLE DESIGN. A stale .app silently reused after app code changed is a suite
      # that passes against the wrong binary — this lane's signature failure (a green Maestro run that
      # wrote no screenshots; a suite green because it never ran). Four rules keep that impossible:
      #   ① the key hashes EVERY input that reaches the binary — JS, native, config, plugins, assets,
      #      the widget target, `packages/core` (the `@core` alias is bundled), and THIS FILE, because
      #      the build flags live in it;
      #   ② NO `restore-keys`. A partial-key fallback is exactly how a stale binary gets in. Exact or nothing;
      #   ③ every run prints the binary's provenance — hit or miss, key, and the commit it was built at —
      #      and that record is written into the uploaded artifact, not just the console;
      #   ④ tags never use it, and `rebuild: true` overrides it.
      - name: Compute the .app cache key
        id: appkey
        run: |
          echo "key=app-${{ runner.os }}-x1-${{ hashFiles(
            'apps/rn/package-lock.json',
            'apps/rn/package.json',
            'apps/rn/app.json',
            'apps/rn/index.js',
            'apps/rn/metro.config.js',
            'apps/rn/babel.config.js',
            'apps/rn/src/**',
            'apps/rn/plugins/**',
            'apps/rn/assets/**',
            'apps/rn/targets/**',
            'packages/core/**',
            'package-lock.json',
            '.github/workflows/native-e2e.yml'
          ) }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built .app
        id: appcache
        if: github.ref_type != 'tag' && inputs.rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/rn/ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
            apps/rn/.appcache-provenance.txt
          key: ${{ steps.appkey.outputs.key }}
          # ⛔ Deliberately no `restore-keys` — see rule ② above.

      # A restored directory that is missing its binary, or whose Info.plist will not parse, must fall
      # through to a real build rather than be installed. `simctl install` would take a broken bundle and
      # the failure would surface much later, as something else.
      - name: Verify the restored .app (a corrupt hit falls back to a full build)
        id: appverify
        if: steps.appcache.outputs.cache-hit == 'true'
        run: |
          APP="ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app"
          if [ -x "$APP/DebtPlannerRN" ] && plutil -lint "$APP/Info.plist" >/dev/null 2>&1; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "✅ restored .app verified: binary present, Info.plist parses"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ restored .app is unusable (missing binary or bad Info.plist) — rebuilding from source"
            rm -rf ios/build/Build/Products/Release-iphonesimulator
          fi

      - name: Generate the native iOS project (expo prebuild)
        if: steps.appverify.outputs.usable != 'true'
        run: npx expo prebuild --platform ios

      # `expo prebuild` runs pod install but treats it as BEST-EFFORT — it prints CocoaPods errors yet
      # still exits 0, so a pod failure silently yields no .xcworkspace and the build step fails later
      # with a misleading "workspace does not exist". Re-run pod install as its OWN step so any real
      # CocoaPods error (e.g. a third-party podspec pinning an incompatible RCT-Folly) is the failing
      # step, with the actual message. Idempotent — a no-op re-install when prebuild already succeeded.
      - name: Install CocoaPods (fail loud — prebuild masks pod errors with exit 0)
        if: steps.appverify.outputs.usable != 'true'
        working-directory: apps/rn/ios
        run: pod install

      - name: Build for the iOS Simulator (no signing)
        if: steps.appverify.outputs.usable != 'true'
        run: |
          # `pipefail` is LOAD-BEARING with the `tee` below: without it the pipeline's exit status is
          # tee's (always 0) and a failed compile would sail through as a green step.
          set -o pipefail
          # Build ONLY the runner's native arch — Release defaults to both arm64 + x86_64 sim slices (≈2×
          # the compile); we only need the slice matching the sim we boot.
          ARCH="$(uname -m)"
          echo "Building single simulator arch: $ARCH"
          # 2026-07-29 speed pass — two compiler-level cuts to the ~13-min sim compile, both safe for a
          # FUNCTIONAL e2e (the signed Codemagic build is the optimized final sanity check):
          #  • Optimization OFF (SWIFT_OPTIMIZATION_LEVEL=-Onone / GCC_OPTIMIZATION_LEVEL=0) — skips the
          #    expensive Release -O passes while KEEPING the Release config's embedded self-contained JS
          #    bundle (bundling is gated on the config NAME, not opt level), so the app still runs on the
          #    sim with no Metro. Maestro tests behavior, not perf → unoptimized is fine.
          #  • Clang explicit modules ON (Xcode 26 default) — pinned OFF while stabilizing; now green across
          #    3 runs, so we take the module-reuse speedup. Revert to CLANG_ENABLE_EXPLICIT_MODULES=NO build
          #    if a pod's module map trips explicit modules.
          # 2026-08-12 (4.1.3a) — two more, both free and both measured from run 31516616133's log:
          #  • DEBUG_INFORMATION_FORMAT=dwarf — the log runs 4 `GenerateDSYMFile` tasks producing dSYMs
          #    that NOTHING in this lane reads. Symbolication belongs to the signed Codemagic build.
          #  • COMPILER_INDEX_STORE_ENABLE=NO — index-while-building serves an IDE. There isn't one here.
          xcodebuild \
            -workspace ios/DebtPlannerRN.xcworkspace \
            -scheme DebtPlannerRN \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL='-Onone' GCC_OPTIMIZATION_LEVEL=0 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      # xcodebuild emits thousands of lines and buries the ONE that matters in the middle of them, under
      # a pile of benign warnings — the React prebuilt core's "umbrella header does not include header
      # RCTTrackingAnimatedNode.h" is the loudest, appears on every build including successful ones, and
      # reads exactly like a cause when you are scrolling a failed log looking for one. So the failure
      # says what failed, rather than leaving it to a search.
      #
      # Same lesson as the pod-install step above: a tool that reports failure quietly gets its own loud
      # wrapper.
      - name: Surface the build error
        if: failure()
        run: |
          echo "──────── errors / failures ────────"
          grep -nE "error:|fatal error:|\*\* BUILD FAILED \*\*|The following build commands failed|^ld: |clang: error|No space left on device|Command .* failed with a nonzero exit code" \
            xcodebuild.log | tail -60 || echo "(no error-shaped line matched — see the tail below)"
          echo
          echo "──────── failing build commands ────────"
          sed -n '/The following build commands failed/,$p' xcodebuild.log | head -40 || true
          echo
          echo "──────── last 80 lines ────────"
          tail -80 xcodebuild.log
          echo
          echo "NOTE: if NOTHING above looks like a compile error, the step did not fail from one —"
          echo "check the job for a timeout (60 min), a cancelled runner, or disk exhaustion."

      - name: Upload the raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/rn/xcodebuild.log
          if-no-files-found: ignore

      # Written INSIDE the cached directory, so it travels with the binary. This is what makes rule ③
      # answerable at all: without it, a cache hit can say the inputs matched but nothing can say which
      # commit the bytes came from.
      - name: Stamp the .app's provenance
        if: steps.appverify.outputs.usable != 'true'
        run: |
          cat > .appcache-provenance.txt << PROV
          built_at_sha=${{ github.sha }}
          built_by_run=${{ github.run_id }}
          built_on_ref=${{ github.ref }}
          cache_key=${{ steps.appkey.outputs.key }}
          PROV
          cat .appcache-provenance.txt

      - name: Save the built .app
        if: steps.appverify.outputs.usable != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/rn/ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
            apps/rn/.appcache-provenance.txt
          key: ${{ steps.appkey.outputs.key }}

      # ⛔ RULE ③, AND IT RUNS ON EVERY EXECUTION — hit or miss, cached or fresh. A speed optimisation
      # that cannot be audited from the log is how "green" stops meaning anything, and this lane has
      # already shipped that defect twice. If this step ever goes quiet, distrust the run.
      - name: Report which binary is about to be tested
        run: |
          PROV=".appcache-provenance.txt"
          echo "──────── BINARY PROVENANCE ────────"
          if [ "${{ steps.appverify.outputs.usable }}" = "true" ]; then
            echo "SOURCE      : RESTORED FROM CACHE (prebuild + pods + compile were SKIPPED)"
          else
            echo "SOURCE      : COMPILED IN THIS RUN"
          fi
          echo "cache-hit   : ${{ steps.appcache.outputs.cache-hit || 'false' }}"
          echo "key         : ${{ steps.appkey.outputs.key }}"
          echo "HEAD        : ${{ github.sha }}"
          cat "$PROV" 2>/dev/null || echo "(no provenance file — treat this binary as unidentified)"
          BUILT_SHA=$(sed -n 's/^built_at_sha=//p' "$PROV" 2>/dev/null)
          if [ -n "$BUILT_SHA" ] && [ "$BUILT_SHA" != "${{ github.sha }}" ]; then
            echo
            echo "NOTE: this binary was compiled at $BUILT_SHA, not at HEAD."
            echo "The key hashes every input that reaches the binary, so a different commit here should"
            echo "mean only UNHASHED files moved (docs, .maestro flows)."
            echo
            echo "⚠️ READ THIS LIST. It is every file changed since that build — deliberately NOT filtered"
            echo "to the hashed paths, because filtering by the same list the key uses could only ever"
            echo "agree with itself. A path here that plausibly reaches the binary means the key is"
            echo "MISSING it: re-run with rebuild=true, then add the path to the key."
            git diff --name-only "$BUILT_SHA" "${{ github.sha }}" 2>/dev/null | head -40 \
              || echo "(cannot diff — $BUILT_SHA is not in this checkout; needs fetch-depth: 0)"
          fi
          echo "───────────────────────────────────"
          # Into the uploaded artifact too, so the record survives the log's retention.
          mkdir -p maestro-debug
          cp "$PROV" maestro-debug/PROVENANCE.txt 2>/dev/null || true
          # And the size, because a cache that costs more to move than the build costs to run is not a
          # speed-up. If this is large, narrow the path before reaching for a bigger runner.
          du -sh ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app 2>/dev/null || true

      - name: Boot, install, launch, capture the app log
        run: |
          # Pick the newest available iPhone simulator by name (the lineup shifts across Xcode versions).
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed 's/ *$//' | sort -V | tail -1)
          echo "Booting simulator: ${DEVICE:-<none found>}"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl install booted ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
          mkdir -p maestro-debug
          # Stream the app's unified log so a fatal JS throw's message + stack is captured (the crash
          # report has the native abort stack but not the JS message).
          xcrun simctl spawn booted log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log.txt 2>&1 &
          LOG_PID=$!
          xcrun simctl launch booted com.jasonsnyder.debtplanner || true
          sleep 25
          xcrun simctl io booted screenshot maestro-debug/cold-launch.png || true
          kill "$LOG_PID" 2>/dev/null || true
          echo "=== app log — error/exception/fatal lines ==="
          grep -iE "fatal|exception|invariant|undefined is not|is not a function|cannot read|TypeError|ReferenceError|RCTFatal" maestro-debug/os-log.txt | head -80 || true
          echo "=== app log — last 60 lines ==="
          tail -60 maestro-debug/os-log.txt || true

      - name: Install Maestro (+ idb for the iOS driver)
        run: |
          brew tap facebook/fb && brew install idb-companion || true
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        if: inputs.mode != 'probe' && inputs.device != 'ipad'
        env:
          # Maestro's iOS driver often exceeds its default startup timeout on a cold CI sim.
          # ⚠️ 420 s, raised from 240 s: run 31646289268 lost a whole ~35-minute cycle to
          # `iOS driver not ready in time` before a single flow ran — while the iPad tier, starting its
          # driver minutes later on the same runner, came up fine. See the retry below; the timeout is the
          # cheap half of the fix and the retry is the half that actually saves the cycle.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '420000'
        # ⛔ THE ORDER IS EXPLICIT, AND IT HAS TO BE. Passing the DIRECTORY ran the flows in
        # `01 → 05 → 02 → 06 → 03 → 08 → 07 → 04` on run 31598337615 — measured from each flow's own
        # start timestamp, not inferred. Maestro's docs specify no ordering for a directory argument, so
        # the suite was depending on unspecified behaviour, and two flows failed on it: 04 ran AFTER 07's
        # `clearState: true` wiped the seed it asserts, and 08 ran BEFORE the same clear that resets the
        # coach-mark "once ever" flags it needs. Every green this suite has ever shown was order-luck.
        #
        # `<flowFiles>...` is documented as "one or more flow files or folders", so the list below is the
        # order. The dependency chain it encodes: 01 seeds → 02-06 consume that seed → 07 CLEARS and
        # rebuilds → 08 runs on what 07 built. Adding a flow means deciding where in that chain it sits.
        #
        # ⚠️ ONE invocation, not a loop of eight. The 42.7 s stall that reds a cold assertion is a
        # FIRST-SNAPSHOT-PER-DRIVER-SESSION cost (see 01's timeout comment); separate invocations would
        # restart the driver and re-pay it on every flow, turning one flake into eight.
        # ⚠️ VERIFY, don't assume: the artifact's per-flow start times say whether this order was honoured.
        run: |
          # ⛔ A SECOND, LONG-LIVED LOG STREAM. The one in the boot step is killed after 25 s — it exists to
          # capture a cold-launch crash and does its job — which means `os-log.txt` covers the launch and
          # NOTHING of the test run. Any diagnostic the app logs while Maestro drives it was being thrown
          # away, including 4.1.4c's coach-mark trace. This one lives for the whole suite.
          # ⚠️ `pipefail` — without it a pipeline reports the LAST command's status, which silently broke
          # the probe-trace fallback below: `grep … | tail || echo` never fired its echo, because `tail`
          # always succeeds. The step printed a header and nothing, which reads exactly like "the app
          # logged no probe lines" when in fact nothing had been searched.
          set -o pipefail
          mkdir -p maestro-debug
          xcrun simctl spawn booted log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log-maestro.txt 2>&1 &
          RUN_LOG_PID=$!

          run_suite() {
            maestro test \
              .maestro/01-launch-smoke.yaml \
              .maestro/02-sheet-native-tap.yaml \
              .maestro/03-row-context-menu.yaml \
              .maestro/04-payoff-schedule.yaml \
              .maestro/05-tutorial-walkthrough.yaml \
              .maestro/06-tutorial-interactions.yaml \
              .maestro/07-money-add-and-rescue.yaml \
              .maestro/08-coach-marks.yaml \
              --format junit --output maestro-report.xml --debug-output ./maestro-debug 2>&1 | tee "$1"
          }

          # ⛔ RETRY ONLY ON THE DRIVER-STARTUP SIGNATURE, never on a red flow. Run 31646289268 spent a
          # full cycle — build included — to produce `iOS driver not ready in time` with ZERO flows run:
          # an infrastructure stall, indistinguishable from a green suite in cost and from a real failure
          # in exit code. A blind retry would double the cost of every genuine red and re-run flows whose
          # `clearState` ordering matters; matching the message keeps it to the one case that is safe.
          STATUS=0
          run_suite /tmp/maestro-1.txt || STATUS=$?
          if [ "$STATUS" -ne 0 ] && grep -q "iOS driver not ready in time" /tmp/maestro-1.txt; then
            echo "::warning::iOS driver failed to start and NO flow ran — retrying the suite once."
            # ⚠️ Deliberately NOT rebooting the simulator: the failure is the XCTest runner install, which
            # `maestro test` reattempts on its own, and the .app is already installed on that device.
            # Cycling the sim would risk the install for no stated benefit.
            STATUS=0
            run_suite /tmp/maestro-2.txt || STATUS=$?
          fi

          kill "$RUN_LOG_PID" 2>/dev/null || true
          echo "=== app log — the coach-mark probe trace, whatever screen the run died on ==="
          grep -F "[coach-probe]" maestro-debug/os-log-maestro.txt | tail -40 \
            || echo "(no probe lines in os-log — console is likely stripped in this Release build; read the on-screen readout instead)"
          exit $STATUS

      # ── 4.1.5.1 · THE IPAD TIER ( [D30] ) ───────────────────────────────────────────────────────
      # ⛔ `continue-on-error` ON PURPOSE, and it is not laziness. This step's deliverable is a hierarchy
      # dump and five screenshots, not a verdict — 4.1.5's whole first question is whether the iPhone-
      # tuned shared flows survive a 1024pt-wide layout, and "they did not" is a RESULT to read, not a
      # reason to fail a job that is also carrying the 4.1.4c coach-mark probe. A red here must not take
      # the iPhone lane's answer down with it.
      #
      # ⚠️ ONE simulator booted at a time. Maestro targets the booted device, so with two up it would
      # pick one and this step would silently re-run the iPhone suite on the iPhone. `--device` exists as
      # a CLI flag but is UNPROVEN on this build, and 4.1.1's rule is that unproven commands go through
      # the probe lane first — shutting the iPhone down needs nothing unproven.
      #
      # The flow list is explicit for 4.1.3b's reason (Maestro specifies no ordering for a directory) and
      # it IS the [D30] tiering: `01` is the shared tier, `i01` is the iPad-only tier. 02 is absent
      # because it is iPhone-only by design — its subject is a header button inside a modal sheet's
      # swipe area, and on a wide iPad the sheet is inline, so it would pass while testing nothing.
      # ⛔ `!cancelled()` IS LOAD-BEARING — without it this step never runs on the day it matters. Run
      # 31626109780 skipped it entirely: a bare `if:` gets an implicit `success()`, and the iPhone
      # Maestro step had failed (flow 08, as expected — that run existed to diagnose it). So the iPad
      # measurement was silently dropped by the very condition that was supposed to schedule it.
      # ⚠️ `continue-on-error` does NOT cover this. It stops THIS step's failure from failing the job;
      # it says nothing about whether the step runs after an EARLIER failure. Two different mechanisms,
      # and I conflated them.
      - name: Boot an iPad simulator and run the [D30] iPad tier
        if: ${{ !cancelled() && inputs.mode != 'probe' && (inputs.device == 'ipad' || inputs.device == 'both') }}
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          xcrun simctl shutdown all || true
          # ⛔ SELECT BY MEASURED WIDTH, NEVER BY NAME. Run 31630150499 preferred `grep -i pro` and booted
          # **iPad mini (A17 Pro)** — the match was the CHIP name. At 1488px/2 = 744pt that device is
          # `compact` (`sizeClass.ts`: regular ≥ 768, expanded ≥ 1024), so the run exercised the PHONE
          # layout on an iPad and passed. That is [D30]'s own named void condition — "green while testing
          # nothing" — committed by the step written to implement [D30].
          #
          # ⚠️ The name itself CONTAINS parentheses on every current iPad ("iPad Pro 13-inch (M4)"), so a
          # pattern that stops at the first `(` matches nothing at all. Anchor on the 36-char UDID and
          # take everything before it as the name.
          AVAIL=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPad' \
            | sed -E 's/^[[:space:]]*(.+) \(([0-9A-Fa-f-]{36})\) \(.*/\2|\1/')
          echo "── iPads available ──"; echo "$AVAIL"
          if [ -z "$AVAIL" ]; then echo "::error::no iPad simulator available on this runner"; exit 1; fi

          # ⛔ READ THE GEOMETRY, DO NOT BOOT FOR IT. The first version of this booted every candidate iPad
          # to screenshot and measure it — and run 31636187156 spent **20+ minutes** in that loop before
          # the job hit its 60-minute timeout and was cancelled mid-tier. Correct selection, unusable
          # method: a runner image carries six to eight iPads and each boot is 30-60 s.
          #
          # Every device type ships its screen geometry on disk, so this is a file read per candidate
          # (~1 s total) and exactly ONE boot — the winner.
          BEST_UDID=""; BEST_NAME=""; BEST_PT=0
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            U="${row%%|*}"; N="${row#*|}"
            # Match the device to its .simdevicetype bundle by name, then read points = width / scale.
            PROF=$(ls -d /Library/Developer/CoreSimulator/Profiles/DeviceTypes/*.simdevicetype 2>/dev/null \
              | while read -r B; do
                  DN=$(plutil -extract CFBundleName raw "$B/Contents/Info.plist" 2>/dev/null)
                  [ "$DN" = "$N" ] && echo "$B/Contents/Resources/profile.plist"
                done | head -1)
            W=$(plutil -extract mainScreenWidth raw "$PROF" 2>/dev/null)
            S=$(plutil -extract mainScreenScale raw "$PROF" 2>/dev/null)
            # ⛔ `mainScreenScale` comes back as a FLOAT on most device types — "2.000000" — and as "2" on
            # a few. Bash arithmetic cannot divide by "2.000000", so run 31642490867 computed 0pt for every
            # wide iPad and 744pt for the mini (the one integer), then correctly refused to run.
            # ⚡ The fail-loud guard caught my own parse bug instead of quietly testing the phone layout on
            # an iPad — which is precisely the failure it was written to prevent, one layer up.
            S=${S%%.*}
            PT=0
            if [ -n "$W" ] && [ -n "$S" ] && [ "$S" -gt 0 ] 2>/dev/null; then PT=$(( W / S )); fi
            echo "   $N → ${W:-?}px / ${S:-?}x = ${PT}pt"
            if [ "$PT" -gt "$BEST_PT" ]; then BEST_PT=$PT; BEST_UDID=$U; BEST_NAME=$N; fi
          done <<< "$AVAIL"

          # ⛔ FAIL LOUD rather than measure the wrong thing. A compact "iPad" run is worse than no iPad
          # run: it reports a pass for checks it never executed. If no wide iPad exists on this image,
          # that is a fact to act on (pin a runtime, or add a device), not something to paper over.
          echo "Widest available iPad: $BEST_NAME at ${BEST_PT}pt"
          # ⚠️ 0pt means the plist READ failed (a renamed key, a bundle whose CFBundleName does not match
          # simctl's device name), not that the device is tiny. It lands in the same fail-loud branch on
          # purpose — the printed table above says which, and a silent fallback to name-matching is what
          # put a 744pt iPad mini through this lane in the first place.
          if [ "$BEST_PT" -lt 1024 ]; then
            echo "::error::widest available iPad measured ${BEST_PT}pt — below the 1024pt \`isExpanded\` threshold (0 = plist read failed; see the table above)."
            echo "::error::[D30]'s checks (master-detail, inline sheet) do not run below 1024pt, so this"
            echo "::error::would be a green run that tested the compact layout. See sizeClass.ts."
            exit 1
          fi
          UDID="$BEST_UDID"; NAME="$BEST_NAME"
          echo "Booting iPad: $NAME ($UDID) — ${BEST_PT}pt, expanded"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
          mkdir -p maestro-debug
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log-ipad.txt 2>&1 &
          LOG_PID=$!
          # ⚡ MEASURE the frame rather than assuming it. [D30]'s carried hypothesis is entirely about
          # width, and this is the cheapest possible way to stop it being a hypothesis: the screenshot's
          # pixel width, printed into the log beside the device name.
          xcrun simctl io "$UDID" screenshot maestro-debug/ipad-00-boot.png || true
          sips -g pixelWidth -g pixelHeight maestro-debug/ipad-00-boot.png || true
          # ⚠️ `|| STATUS=$?`, not a bare call then `$?`. GitHub runs `run:` under `bash -e`, so a red
          # Maestro would abort the step on the spot — skipping the log kill and the status line, and
          # throwing away the "it failed, here is how far it got" that is this step's entire output.
          STATUS=0
          # ⭐ 4.1.5.2 — `05` joins the iPad list, and it is the FIRST check here that can actually fail
          # for an iPad-specific reason. `i01` asserts nothing device-specific by design, so until now this
          # tier was infrastructure without coverage. §11.15's ring-origin invariant is the opposite: on
          # the iPhone the overlay's origin is {0,0} and the assertion is satisfied by a build with no
          # correction at all, while here the tab bar is a left RAIL and the origin sits a sidebar-width
          # right — the only arrangement in which the check has two possible answers.
          # ORDER: `05` runs after `i01` so the measurement flow keeps its clean position — `05` finishes
          # the walkthrough and marks it seen, which changes what Today renders. It relaunches with
          # `clearState: false`, so `i01` leaving the debt sheet open costs it nothing.
          maestro test \
            .maestro/01-launch-smoke.yaml \
            .maestro/i01-ipad-boot.yaml \
            .maestro/05-tutorial-walkthrough.yaml \
            --format junit --output maestro-report-ipad.xml --debug-output ./maestro-debug-ipad || STATUS=$?
          kill "$LOG_PID" 2>/dev/null || true
          echo "iPad tier exit status: $STATUS (recorded, not fatal — see the step comment)"
          exit 0

      # ── 4.1.1 · THE CAPABILITY PROBE ────────────────────────────────────────────────────────────
      # Each file runs in its OWN maestro invocation, and a failure is recorded rather than fatal.
      #
      # That is the whole design. A probe that stops at the first red teaches ONE thing per 40-minute
      # cycle, and this repo has already spent three cycles learning one command name at a time. Every
      # file here answers an independent question, so they must not be able to mask each other — the
      # verdict table at the end is the deliverable, not the exit code.
      - name: Probe · run each unproven command separately
        if: inputs.mode == 'probe'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          mkdir -p maestro-debug
          : > maestro-debug/probe-verdicts.txt
          for f in .maestro/probe/*.yaml; do
            name=$(basename "$f")
            echo "──────── probe: $name ────────"
            if maestro test "$f" --debug-output ./maestro-debug; then
              echo "PASS  $name" >> maestro-debug/probe-verdicts.txt
            else
              echo "FAIL  $name" >> maestro-debug/probe-verdicts.txt
            fi
          done
          # AX text size + theme are simctl one-liners the app has never been driven under. Applied here,
          # after the default-condition probes, so a reflow crash cannot be mistaken for one of theirs.
          echo "──────── applying AX5 + dark, then re-running the conditions probe ────────"
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large || echo "(content_size unsupported on this Xcode)"
          xcrun simctl ui booted appearance dark || echo "(appearance unsupported on this Xcode)"
          for f in .maestro/probe-conditions/*.yaml; do
            name=$(basename "$f")
            echo "──────── probe: $name (AX5 · dark) ────────"
            if maestro test "$f" --debug-output ./maestro-debug; then
              echo "PASS  $name (AX5·dark)" >> maestro-debug/probe-verdicts.txt
            else
              echo "FAIL  $name (AX5·dark)" >> maestro-debug/probe-verdicts.txt
            fi
          done
          # Restore default conditions so the deep-link probe below is not also answering an AX5 question.
          xcrun simctl ui booted content_size medium || true
          xcrun simctl ui booted appearance light || true

          # ── The DEEP-LINK probe runs LAST, and through `simctl` rather than Maestro ─────────────
          #
          # Cycle 1 established that Maestro's `openLink` makes iOS raise a SpringBoard-owned
          # "Open in …?" confirmation. Nothing dismissed it, Maestro could not see it (the flow is scoped
          # to the app; the failure hierarchy held three status-bar nodes and nothing else), and it
          # persisted for the REST OF THE RUN — failing every later file, including the AX5 accessibility
          # probe, whose red then read as "the app breaks under large text".
          #
          # So: `simctl openurl` delivers the URL through the system instead of through a link tap, and
          # this probe is ORDERED LAST so that if it still leaks a modal, it poisons nothing after it.
          # That ordering is the actual repair. The per-file isolation above was built against parse
          # failures and did not account for what a file leaves BEHIND on the device.
          echo "──────── probe: p09-deeplink-scripted.yaml (via simctl openurl) ────────"
          xcrun simctl launch booted com.jasonsnyder.debtplanner || true
          sleep 15
          xcrun simctl openurl booted "debtplannerrn:///demo?mode=scripted" || echo "(simctl openurl returned non-zero)"
          if maestro test .maestro/probe-deeplink/p09-deeplink-scripted.yaml --debug-output ./maestro-debug; then
            echo "PASS  p09-deeplink-scripted.yaml (simctl openurl)" >> maestro-debug/probe-verdicts.txt
          else
            echo "FAIL  p09-deeplink-scripted.yaml (simctl openurl)" >> maestro-debug/probe-verdicts.txt
          fi

      - name: Probe · the verdict table
        if: always() && inputs.mode == 'probe'
        run: |
          echo "════════ 4.1.1 PROBE VERDICTS ════════"
          cat maestro-debug/probe-verdicts.txt 2>/dev/null || echo "(none recorded — the probe step did not run)"
          echo "══════════════════════════════════════"
          echo "A FAIL here is a RESULT, not a broken build. Read docs/audits/2026-08-11-maestro-coverage/"
          echo "§5, and ledger anything that failed as device-owed — do NOT weaken a check to make it pass."

      # Maestro resolves a `takeScreenshot` path relative to the FLOW FILE's directory, not the working
      # directory — so `takeScreenshot: maestro-debug/tut-beat-1` lands in `.maestro/maestro-debug/`,
      # which is outside this job's artifact glob.
      #
      # The first fully green run therefore passed every assertion and uploaded NO screenshots at all:
      # a gate that reported success while producing none of the evidence it exists to produce. Assertions
      # were never the point here — the whole reason for a native lane is to LOOK at the real renderer.
      #
      # So this collects them from wherever Maestro actually wrote them, and prints the paths, so the next
      # person does not have to re-derive the resolution rule.
      - name: Collect the Maestro screenshots
        if: always()
        run: |
          mkdir -p maestro-debug
          echo "── screenshots found ──"
          find . "$HOME/.maestro" \( -name 'tut-*.png' -o -name 'probe-*.png' \) -not -path '*/node_modules/*' 2>/dev/null | tee /tmp/shots.txt
          while IFS= read -r f; do [ -f "$f" ] && cp -f "$f" maestro-debug/ || true; done < /tmp/shots.txt
          echo "── collected into maestro-debug/ ──"
          ls -la maestro-debug/ || true

      - name: Screenshot the final simulator state
        if: always()
        run: xcrun simctl io booted screenshot maestro-debug/final-screen.png || true

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p maestro-debug/crash
          cp -R ~/Library/Logs/DiagnosticReports/. maestro-debug/crash/ 2>/dev/null || true
          latest=$(ls -t maestro-debug/crash/*.ips 2>/dev/null | head -1)
          [ -n "$latest" ] && head -200 "$latest" || echo "(no .ips crash file found)"

      # ⚠️ `include-hidden-files` is load-bearing, not hygiene. Maestro's `--debug-output ./maestro-debug`
      # writes everything worth having — per-command logs, the VIEW HIERARCHY at the failure, and its own
      # failure screenshots — under `maestro-debug/.maestro/tests/<run>/`, a HIDDEN path. upload-artifact
      # v4 skips hidden files by default, so this step shipped its own name's worth of nothing: the 04
      # failure had to be diagnosed from a single end-of-run screenshot because the hierarchy never left
      # the runner.
      - name: Upload Maestro report + debug (screenshots + view hierarchy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          include-hidden-files: true
          # ⛔ DROP `device-simulator.log` — 300 MB of run 31603811840's 322 MB was this one file per
          # flow, Maestro's dump of the ENTIRE simulator syslog, 118 MB for flow 01 alone. Never read
          # once: the app-filtered unified log is captured separately as `maestro-debug/os-log.txt`, and
          # native crashes have their own step. The diagnose loop is what this lane's speed depends on.
          #
          # ⚠️ THE COMMENTS BELONG HERE, NOT IN THE BLOCK. The first attempt at this put them inside
          # `path: |`, where every line is literal text — so each `#` line became a path PATTERN. The
          # exclusion was also quoted, which upload-artifact does not accept. Net effect on run
          # 31607274947: still 364 MB, and because the bogus patterns did not share the `apps/rn` prefix,
          # the artifact's common root moved to the workspace root and every debug path gained an
          # `apps/rn/` segment mid-investigation.
          # Syntax verified against the action's own docs: bare `!`, unquoted, AFTER the includes — and
          # "exclude paths do not affect the directory structure", so the layout returns to
          # `maestro-debug/…` at the artifact root once the bogus includes are gone.
          path: |
            apps/rn/maestro-report.xml
            apps/rn/maestro-debug/**
            apps/rn/maestro-report-ipad.xml
            apps/rn/maestro-debug-ipad/**
            !apps/rn/maestro-debug/**/device-simulator.log
            !apps/rn/maestro-debug-ipad/**/device-simulator.log
