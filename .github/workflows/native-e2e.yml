# Native E2E on a GitHub-Actions macOS runner: build the RN app for the iOS Simulator (unsigned) → boot
# → run Maestro flows. This is the Codemagic-FREE native-verification loop (GH macOS minutes are separate
# from the Codemagic 500) — it catches native-only bugs the web Playwright gate structurally can't
# (gesture/tap behavior, New-Arch launch crashes, autolinked native modules, the widget/App-Group
# compile), WITHOUT a signed device build.
#
# ⭐ 4.1.9b (2026-08-17) — THE SHAPE CHANGED, AND THE SHAPE IS THE POINT.
#
#   build  ──┬──▶  iPhone tier  (flows 01-10 · the XCUITest probe · the 4.1.1 capability lane)
#            └──▶  iPad  tier   ([D30]: 01 · i01 · i02 · i03 · 05, plus i02 again in dark)
#
#   ① The BUILD RECIPE lives in `.github/actions/rn-ios-sim-build` and is shared with `app-preview.yml`,
#      which had drifted four ways from its copy in five days.
#   ② The `.app` cache key no longer hashes THIS FILE — the build flags moved into the action — so
#      editing a Maestro flow list, the most common edit in 4.1, stops recompiling the binary.
#   ③ The two tiers used to run SEQUENTIALLY in one job, so `device=both` paid iPhone + iPad
#      (~650s + ~666s). They are now parallel jobs: the cost is `max`, not `sum`.
#   ④ The tiers install a tarball and need no npm, no pods, no Xcode select and no tsc.
#
# ⛔ THE PROBE STAYS IN THE IPHONE JOB. It used to sit between the two tiers; a split that dropped it
# would look exactly like a probe that found nothing.
#
# ⛔ DO NOT SHARD THE IPHONE TIER. Its flows carry a real dependency chain — `01` seeds · `07` clears
# state · `08` depends on `07` · `10` must precede `09` · `09` is terminal. Splitting it is how the suite
# starts lying. The TIER split is safe for the opposite reason: each tier already runs its own `01`.
name: Native E2E (Maestro · iOS Simulator)

on:
  # MANUAL ONLY — never auto-runs on push (a ~40-min mac job is overkill per-commit, free or not). Use
  # the "Run workflow" button in GitHub → Actions → Native E2E, and pick the branch (v1.7-dev) to test.
  # ⚠️ That button only appears once THIS file exists on the DEFAULT branch, so the file is committed
  # there too (it runs the SELECTED branch's code, not the default branch's).
  # ⚠️ CORRECTED 2026-08-07: this repo's default branch is **release/v1**, not `master` — `master` does
  # not exist.
  workflow_dispatch:
    inputs:
      # 4.1.1 — the CAPABILITY PROBE lane. `.maestro/probe/` holds one unproven command per file and is
      # NOT part of the suite: its files are expected to fail until each command is confirmed to work on
      # this Maestro build, which is the entire point of running them.
      #
      # ⚠️ This input exists so a probe run cannot disturb flows 01–10. Those depend on each other through
      # an explicit order and on 01's seeded state; a probe file dropped among them would both break that
      # chain and take the whole suite down with its own parse failure (Maestro validates a FILE before
      # executing any of it — see the header of 06-tutorial-interactions.yaml).
      mode:
        description: 'suite = the real flows · probe = the 4.1.1 capability probe (each file run separately, all verdicts collected)'
        type: choice
        options: [suite, probe]
        default: suite
      # 4.1.3a — the escape hatch for the .app cache. Ticking this forces a full prebuild + pod install +
      # compile even when the key hits. It exists because "I do not trust that binary" must always have a
      # one-click answer that does not involve editing the workflow.
      rebuild:
        description: 'Force a clean native build (ignore the cached .app)'
        type: boolean
        default: false
      # 4.1.5 / [D30] — the iPad lane is THREE TIERS IN ONE DIRECTORY, and the device is an INPUT carrying
      # its own explicit flow list. Not a duplicated `.maestro-ipad/` set: this repo has priced parallel
      # test surfaces twice (the two screenshot mechanisms, whose stale frames masked the sandbox theme
      # defect; Wave A's "two places, one rule" landing three times in one wave).
      #
      # ⚡ 4.1.3a is what keeps `both` from doubling the BUILD, and 4.1.9b is what keeps it from doubling
      # the TIME. The `.app` is device-agnostic and the cache key does not mention the device, so both
      # tiers receive the SAME binary — and they now receive it concurrently.
      #
      # ⚠️ **MEASURED 2026-08-13, run `31720514061`: the iPad tier is 666s (11m06s) against the iPhone
      # suite's 808s.** Three flows cost 82% of what eight cost, because the tier pays a second full
      # simulator boot and install (~90s + ~54s) and re-runs `01`, the heaviest flow in the suite.
      # ⛔ `01` is NOT duplication to cut: [D30] put it on the iPad list because whether the iPhone-tuned
      # swipe geometry survives a 1024pt layout IS the question. Under the split, the second boot is paid
      # on a second machine and costs wall-clock nothing.
      #
      # ⚠️ A TAG PUSH SUPPLIES NO INPUTS, so `inputs.device` is empty there and only the iPhone job runs.
      # Deliberate for now: the iPad tier is a measurement lane, not yet a release gate. Promoting it, or
      # defaulting the tag path to `both`, is a 4.1.11 decision.
      device:
        description: 'iphone = flows 01-10 · ipad = the [D30] iPad tier (shared seed + iPad-only) · both'
        type: choice
        options: [iphone, ipad, both]
        default: iphone
      # ⭐ 4.1.6a.7.4g — THE FAST LANE, AND IT IS COSTED, NOT GUESSED. Measured across runs 31822453981
      # and 31827409093, a full `both` cycle is ~45-55 min and splits like this:
      #
      #   build the app        866s / 485s   ← unavoidable floor for ANY native verification
      #   XCUITest bundle       64s          ← the thing being verified
      #   boot / install       297s / 141s   ← needed: test-without-building wants a booted sim
      #   install Maestro       55s          ← NOT needed
      #   run Maestro flows    949s / 721s   ← NOT needed
      #   iPad tier            880s          ← NOT needed
      #
      # ⛔ So verifying an XCUITest fix needs ~12 minutes of work and was buying ~45.
      #
      # ⚠️ NOTHING HERE TOUCHES THE FLOOR. The composite action deduplicates the recipe and the tier split
      # parallelises TIERS — neither speeds compilation. Only DerivedData caching would, and that is
      # GB-scale and unmeasured.
      #
      # ⚠️ A TAG PUSH SUPPLIES NO INPUTS, so `inputs.scope` is empty there. Every condition below is
      # written as `!= 'xcuitest'`, so empty means FULL — the release smoke cannot be narrowed by
      # accident. Same defensive shape as the `device` note above.
      scope:
        description: 'full = build + flows (+ tier) · xcuitest = build + the XCUITest probe ONLY (skips Maestro entirely)'
        type: choice
        options: [full, xcuitest]
        default: full
  push:
    # ⛔ TAGS ONLY. The branch-push "rot guard" added on 2026-08-13 is REVERTED — it was mine, it lasted a
    # few hours, and it generated a 20-minute macOS job on every commit.
    # 🎯 Jason: *"e2e running on push is fine. We just need to not kick off the manual Maestro build every
    # time."* The fast Playwright gate (`web-e2e`) is what belongs on a push.
    #
    # ⚡ Reverting also REPAIRS the release gate. The guard needed a `paths:` filter, `paths:` applies to
    # tags too, and a tag pushed onto an existing commit carries no changed files — so the tag trigger was
    # documented as "may now never fire". With the filter gone it is unconditional again.
    #
    # ⚠️ The rot risk the guard existed for is REAL and now unguarded: this lane can go green by never
    # running. Revisit at 4.1.11 — a nightly is the shape that does not tax a working afternoon.
    tags: ['v*'] # release tags → a gated native smoke before shipping

concurrency:
  group: native-e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # BUILD — the only job that compiles anything. Both tiers consume its tarball.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build (or restore) the .app
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      # ⭐ The probe's gate. Before the products could be cached these two were the same question; now a
      # cache HIT carries a restored `.xctestrun` while the build step is `skipped`, so gating the probe
      # on the build step's outcome would skip it on exactly the fast runs.
      xctest: ${{ steps.build.outputs.xctest }}
      cache-hit: ${{ steps.build.outputs.cache-hit }}
      key: ${{ steps.build.outputs.key }}
    env:
      # `@sentry/react-native/expo` hooks the Xcode "Bundle React Native code and images" phase and runs
      # `sentry-cli` to upload source maps AFTER bundling. On this runner there is no org slug and no auth
      # token, so sentry-cli exits non-zero and takes the whole phase script — and therefore the build —
      # down with it. The JS bundles perfectly; the failure is entirely in the upload that follows it.
      #
      # Which makes the failure maximally misleading: xcodebuild reports
      # `PhaseScriptExecution Bundle React Native code and images ... (2 failures)`, which reads as a
      # BUNDLING error, and the log's most prominent line is React's benign umbrella-header warning.
      #
      # Disabling upload is the right answer here, not a workaround: this is an unsigned, unoptimized
      # simulator build that exists to be driven by Maestro for ~10 minutes and thrown away. The SIGNED
      # Codemagic build is where symbolication matters, and it has the credentials.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      # ⚠️ `fetch-depth: 0` (4.1.3a) — the default depth-1 checkout cannot diff against the commit a
      # cached .app was built at, which is precisely the audit the provenance step exists to print.
      # A shallow clone would leave that safeguard printing "(cannot diff)" forever, which is worse
      # than not having it: it looks like a check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build
        uses: ./.github/actions/rn-ios-sim-build
        with:
          cache-namespace: e2e
          build-tests: 'true'
          rebuild: ${{ inputs.rebuild }}
          # Rule ④ — tags never use the cache. A release smoke compiles.
          use-cache: ${{ github.ref_type != 'tag' }}

      # ⛔ TAR, NOT A DIRECTORY UPLOAD — `upload-artifact` drops the executable bit, and a `.app` whose
      # Mach-O is not `+x` installs cleanly and then never launches. The receiving action asserts `-x`.
      # ⛔ ENUMERATED PATHS, NEVER `Products/**`: that directory also holds every pod's static library and
      # its `include/` symlink tree, which is GB-scale and would cost more to move than the build costs
      # to run.
      - name: Pack the products for the tier jobs
        working-directory: .
        run: |
          set -euo pipefail
          P="apps/rn/ios/build/Build/Products"
          [ -d "$P/Release-iphonesimulator/DebtPlannerRN.app" ] \
            || { echo "::error::no .app to pack — the build produced nothing to test"; exit 1; }
          ITEMS=(Release-iphonesimulator/DebtPlannerRN.app)
          for p in "$P"/*.xctestrun "$P"/Release-iphonesimulator/*-Runner.app "$P"/Release-iphonesimulator/*.xctest; do
            [ -e "$p" ] && ITEMS+=("${p#"$P/"}")
          done
          echo "packing: ${ITEMS[*]}"
          cp apps/rn/.appcache-provenance.txt "$P/.appcache-provenance.txt" 2>/dev/null || true
          [ -e "$P/.appcache-provenance.txt" ] && ITEMS+=(.appcache-provenance.txt)
          tar -cf apps/rn/ios-products.tar -C "$P" "${ITEMS[@]}"
          ls -lh apps/rn/ios-products.tar

      - name: Upload the products
        uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: apps/rn/ios-products.tar
          # It exists to cross a job boundary inside one run. Keeping it a week would store a ~150 MB
          # binary per dispatch for nothing.
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # IPHONE TIER — the suite, the XCUITest probe, and the 4.1.1 capability lane.
  # ⚠️ THE CONDITION IS THE UNION OF WHAT USED TO BE THREE STEP-LEVEL `if:`s, and it keeps the
  # tag-push shape: every clause is `!=`, so empty inputs mean FULL.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  iphone:
    name: iPhone tier
    needs: build
    if: ${{ inputs.mode == 'probe' || inputs.device != 'ipad' || inputs.scope == 'xcuitest' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/rn
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rn-ios-sim-products

      - name: Install Maestro (+ idb for the iOS driver)
        if: ${{ inputs.scope != 'xcuitest' || inputs.mode == 'probe' }}
        run: |
          brew tap facebook/fb && brew install idb-companion || true
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ⚡ MEASURED 2026-08-17, run 31808439691 — the laps landed and nobody had read them:
      #   boot returned 10s · bootstatus 62s · installed 79s · launched 119s · reported-up 144s ·
      #   complete 148s. The plan's "529s / 40% cost centre" was STALE by 3.5×; the instrumentation and
      #   the `sleep 25` → poll change had already fixed it. ⛔ Do not spend anything else here.
      #
      # ⚠️ …but the poll that replaced the sleep is NOT firing. `launched 119s → reported up 144s` is
      # exactly the 25s ceiling, so it never detected the app's own log signal and fell through to the
      # timeout — functionally the `sleep 25` it was written to replace. Worth ~20s, and more importantly
      # it is a fix believed to work that does not. Filed at 4.1.11 rather than guessed at again: the
      # last predicate here was INVENTED rather than grepped out of the artifact, and it cost a cycle.
      - name: Boot, install, launch, capture the app log
        run: |
          T0=$(date +%s); lap() { echo "⏱  $1: $(( $(date +%s) - T0 ))s cumulative"; }
          # Pick the newest available iPhone simulator by name (the lineup shifts across Xcode versions).
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed 's/ *$//' | sort -V | tail -1)
          echo "Booting simulator: ${DEVICE:-<none found>}"
          lap "device picked"
          xcrun simctl boot "$DEVICE" || true
          lap "boot returned"
          # `bootstatus -b` blocks until the device reports booted. Without it `boot` returns early and the
          # install races a device that is not ready — and the wait moves into whatever runs next, where it
          # is invisible. This makes the boot cost land on the boot line.
          xcrun simctl bootstatus "$DEVICE" -b || true
          lap "bootstatus complete"
          xcrun simctl install booted ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
          lap "app installed"
          mkdir -p maestro-debug
          # Stream the app's unified log so a fatal JS throw's message + stack is captured (the crash
          # report has the native abort stack but not the JS message).
          xcrun simctl spawn booted log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log.txt 2>&1 &
          LOG_PID=$!
          xcrun simctl launch booted com.jasonsnyder.debtplanner || true
          lap "app launched"
          # ⛔ **`Running application` and `RCTContentDidAppear` DO NOT EXIST HERE.** Run `31720514061`:
          # zero matches for either across 3,590 lines. This lane builds `-configuration Release` and RN's
          # JS console lines do not survive it. I invented the predicate instead of grepping the artifact
          # I had already downloaded, and the loop silently ran to its ceiling.
          #
          # ⚡ MEASURED instead: `RCTScrollViewComponentView` lands 5.2s after launch — a UIKit focus
          # notice emitted when a scroll view is on screen. ⚠️ Incidental, not a contract, which is why
          # the ceiling still governs and the fallthrough still takes the screenshot: a frame of a splash
          # is the diagnostic for the case where the app did NOT come up.
          #
          # ⛔ TIME-BOUNDED, not iteration-counted. `for i in $(seq 1 25)` with a grep over an 800KB log
          # each pass cost 37s for a "25 second" wait — longer than the sleep it replaced.
          DEADLINE=$(( $(date +%s) + 25 ))
          until grep -qa "RCTScrollViewComponentView" maestro-debug/os-log.txt 2>/dev/null; do
            [ "$(date +%s)" -ge "$DEADLINE" ] && break
            sleep 1
          done
          lap "app reported up (or 25s ceiling)"
          xcrun simctl io booted screenshot maestro-debug/cold-launch.png || true
          kill "$LOG_PID" 2>/dev/null || true
          lap "step complete"
          echo "=== app log — error/exception/fatal lines ==="
          grep -iE "fatal|exception|invariant|undefined is not|is not a function|cannot read|TypeError|ReferenceError|RCTFatal" maestro-debug/os-log.txt | head -80 || true
          echo "=== app log — last 60 lines ==="
          tail -60 maestro-debug/os-log.txt || true

      - name: Run Maestro flows
        if: ${{ inputs.mode != 'probe' && inputs.scope != 'xcuitest' }}
        env:
          # Maestro's iOS driver often exceeds its default startup timeout on a cold CI sim.
          # ⚠️ 420 s, raised from 240 s: run 31646289268 lost a whole ~35-minute cycle to
          # `iOS driver not ready in time` before a single flow ran. See the retry below; the timeout is
          # the cheap half of the fix and the retry is the half that actually saves the cycle.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '420000'
        # ⛔ THE ORDER IS EXPLICIT, AND IT HAS TO BE. Passing the DIRECTORY ran the flows in
        # `01 → 05 → 02 → 06 → 03 → 08 → 07 → 04` on run 31598337615 — measured from each flow's own
        # start timestamp, not inferred. Maestro's docs specify no ordering for a directory argument, so
        # the suite was depending on unspecified behaviour, and two flows failed on it: 04 ran AFTER 07's
        # `clearState: true` wiped the seed it asserts, and 08 ran BEFORE the same clear that resets the
        # coach-mark "once ever" flags it needs. Every green this suite has ever shown was order-luck.
        #
        # The dependency chain the list encodes: 01 seeds → 02-06 consume that seed → 07 CLEARS and
        # rebuilds → 08 runs on what 07 built → 10 precedes 09 → 09 is terminal (it clears state).
        # Adding a flow means deciding where in that chain it sits.
        #
        # ⚠️ ONE invocation, not a loop of ten. The 42.7 s stall that reds a cold assertion is a
        # FIRST-SNAPSHOT-PER-DRIVER-SESSION cost; separate invocations would restart the driver and
        # re-pay it on every flow, turning one flake into ten.
        run: |
          # ⛔ A SECOND, LONG-LIVED LOG STREAM. The one in the boot step is killed after 25 s — it exists to
          # capture a cold-launch crash and does its job — which means `os-log.txt` covers the launch and
          # NOTHING of the test run. Any diagnostic the app logs while Maestro drives it was being thrown
          # away, including 4.1.4c's coach-mark trace. This one lives for the whole suite.
          # ⚠️ `pipefail` — without it a pipeline reports the LAST command's status, which silently broke
          # the probe-trace fallback below: `grep … | tail || echo` never fired its echo, because `tail`
          # always succeeds.
          set -o pipefail
          mkdir -p maestro-debug
          xcrun simctl spawn booted log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log-maestro.txt 2>&1 &
          RUN_LOG_PID=$!

          run_suite() {
            maestro test \
              .maestro/01-launch-smoke.yaml \
              .maestro/02-sheet-native-tap.yaml \
              .maestro/03-row-context-menu.yaml \
              .maestro/04-payoff-schedule.yaml \
              .maestro/05-tutorial-walkthrough.yaml \
              .maestro/06-tutorial-interactions.yaml \
              .maestro/07-money-add-and-rescue.yaml \
              .maestro/08-coach-marks.yaml \
              .maestro/10-walkthrough-edges.yaml \
              .maestro/09-demo-explore.yaml \
              --format junit --output maestro-report.xml --debug-output ./maestro-debug 2>&1 | tee "$1"
          }

          # ⛔ RETRY ONLY ON THE DRIVER-STARTUP SIGNATURE, never on a red flow. Run 31646289268 spent a
          # full cycle — build included — to produce `iOS driver not ready in time` with ZERO flows run:
          # an infrastructure stall, indistinguishable from a green suite in cost and from a real failure
          # in exit code. A blind retry would double the cost of every genuine red and re-run flows whose
          # `clearState` ordering matters; matching the message keeps it to the one case that is safe.
          STATUS=0
          run_suite /tmp/maestro-1.txt || STATUS=$?
          if [ "$STATUS" -ne 0 ] && grep -q "iOS driver not ready in time" /tmp/maestro-1.txt; then
            echo "::warning::iOS driver failed to start and NO flow ran — retrying the suite once."
            # ⚠️ Deliberately NOT rebooting the simulator: the failure is the XCTest runner install, which
            # `maestro test` reattempts on its own, and the .app is already installed on that device.
            STATUS=0
            run_suite /tmp/maestro-2.txt || STATUS=$?
          fi

          kill "$RUN_LOG_PID" 2>/dev/null || true
          echo "=== app log — the coach-mark probe trace, whatever screen the run died on ==="
          grep -F "[coach-probe]" maestro-debug/os-log-maestro.txt | tail -40 \
            || echo "(no probe lines in os-log — console is likely stripped in this Release build; read the on-screen readout instead)"
          exit $STATUS

      # ── 4.1.6a.7.4c · RUN THE PROBE. Compiling it was never the deliverable. ────────────────────
      #
      # ⛔ PLACED AFTER THE SUITE, deliberately. XCUITest activates SpringBoard and relaunches the app
      # under test, so ahead of Maestro it would be mutating the device state the flows assert against.
      # The iPad tier is a different job on a different machine and inherits nothing from it either.
      #
      # ⚠️ `!cancelled()` FOR 4.1.5.1's REASON, ALREADY PAID FOR ONCE. A bare `if:` carries an implicit
      # `success()`, so a red Maestro suite would silently skip this — on exactly the runs where a second
      # independent signal is worth the most. `continue-on-error` is a different mechanism and does not
      # cover it; run 31626109780 is what that conflation cost.
      #
      # ⭐ 4.1.9b: the gate is now `needs.build.outputs.xctest`, i.e. "is there an .xctestrun", rather
      # than "did the build step run". Those were the same question only while the products could not be
      # cached — and gating on the step outcome skipped the probe on every cache hit.
      - name: Run the XCUITest probe (non-fatal — the verdict is the deliverable)
        if: ${{ !cancelled() && needs.build.outputs.xctest == 'true' && inputs.mode != 'probe' }}
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p maestro-debug
          XCTESTRUN=$(ls ios/build/Build/Products/*.xctestrun 2>/dev/null | head -1)
          if [ -z "$XCTESTRUN" ]; then
            echo "::warning::no .xctestrun — the build job reported one but it did not arrive in the tarball"
            exit 0
          fi
          # The boot step picked its device by name and that variable did not survive the step boundary,
          # so the UDID is read back from the device that is actually booted. Targeting `booted` is not an
          # option here: `-destination` has no such shorthand.
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' | head -1)
          echo "xctestrun : $XCTESTRUN"
          echo "destination: $UDID"
          if [ -z "$UDID" ]; then
            echo "::warning::no booted simulator — nothing to run the probe against"
            exit 0
          fi
          STATUS=0
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$UDID" \
            2>&1 | tee xcodebuild-xctest.log | tail -60 || STATUS=$?

          # ⭐ THE VERDICT TABLE IS THE OUTPUT, not the exit code — 4.1.1's rule, and the probe is written
          # to match it: both tests report rather than fail on absence, so a green here and a red here can
          # BOTH be informative and neither is a reason to red the lane. The `PROBE …` lines are `print()`
          # from the Swift, which lands in xcodebuild's own stdout, so no xcresult parsing is needed.
          echo "════════ 4.1.6a.7 XCUITEST PROBE VERDICTS ════════"
          grep -E "^ *PROBE " xcodebuild-xctest.log | tee maestro-debug/xcuitest-verdicts.txt \
            || echo "(no PROBE lines — the tests did not execute; check TEST EXECUTE FAILED / 'no tests' above)"
          echo "── test summary ──"
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)|error:" \
            xcodebuild-xctest.log | tail -20 || true
          echo "══════════════════════════════════════════════════"
          echo "xcodebuild exit: $STATUS (recorded, not fatal — see the step comment)"
          exit 0

      # ── 4.1.1 · THE CAPABILITY PROBE ────────────────────────────────────────────────────────────
      # Each file runs in its OWN maestro invocation, and a failure is recorded rather than fatal.
      #
      # That is the whole design. A probe that stops at the first red teaches ONE thing per 40-minute
      # cycle, and this repo has already spent three cycles learning one command name at a time. Every
      # file here answers an independent question, so they must not be able to mask each other.
      - name: Probe · run each unproven command separately
        if: ${{ inputs.mode == 'probe' }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
        run: |
          mkdir -p maestro-debug
          : > maestro-debug/probe-verdicts.txt
          for f in .maestro/probe/*.yaml; do
            name=$(basename "$f")
            echo "──────── probe: $name ────────"
            if maestro test "$f" --debug-output ./maestro-debug; then
              echo "PASS  $name" >> maestro-debug/probe-verdicts.txt
            else
              echo "FAIL  $name" >> maestro-debug/probe-verdicts.txt
            fi
          done
          # AX text size + theme are simctl one-liners the app has never been driven under. Applied here,
          # after the default-condition probes, so a reflow crash cannot be mistaken for one of theirs.
          echo "──────── applying AX5 + dark, then re-running the conditions probe ────────"
          xcrun simctl ui booted content_size accessibility-extra-extra-extra-large || echo "(content_size unsupported on this Xcode)"
          xcrun simctl ui booted appearance dark || echo "(appearance unsupported on this Xcode)"
          for f in .maestro/probe-conditions/*.yaml; do
            name=$(basename "$f")
            echo "──────── probe: $name (AX5 · dark) ────────"
            if maestro test "$f" --debug-output ./maestro-debug; then
              echo "PASS  $name (AX5·dark)" >> maestro-debug/probe-verdicts.txt
            else
              echo "FAIL  $name (AX5·dark)" >> maestro-debug/probe-verdicts.txt
            fi
          done
          # Restore default conditions so the deep-link probe below is not also answering an AX5 question.
          xcrun simctl ui booted content_size medium || true
          xcrun simctl ui booted appearance light || true

          # ── The DEEP-LINK probe runs LAST, and through `simctl` rather than Maestro ─────────────
          #
          # Cycle 1 established that Maestro's `openLink` makes iOS raise a SpringBoard-owned
          # "Open in …?" confirmation. Nothing dismissed it, Maestro could not see it, and it persisted
          # for the REST OF THE RUN — failing every later file, including the AX5 accessibility probe,
          # whose red then read as "the app breaks under large text".
          #
          # So: `simctl openurl` delivers the URL through the system instead of through a link tap, and
          # this probe is ORDERED LAST so that if it still leaks a modal, it poisons nothing after it.
          echo "──────── probe: p09-deeplink-scripted.yaml (via simctl openurl) ────────"
          xcrun simctl launch booted com.jasonsnyder.debtplanner || true
          sleep 15
          xcrun simctl openurl booted "debtplannerrn:///demo?mode=scripted" || echo "(simctl openurl returned non-zero)"
          if maestro test .maestro/probe-deeplink/p09-deeplink-scripted.yaml --debug-output ./maestro-debug; then
            echo "PASS  p09-deeplink-scripted.yaml (simctl openurl)" >> maestro-debug/probe-verdicts.txt
          else
            echo "FAIL  p09-deeplink-scripted.yaml (simctl openurl)" >> maestro-debug/probe-verdicts.txt
          fi

      - name: Probe · the verdict table
        if: ${{ always() && inputs.mode == 'probe' }}
        run: |
          echo "════════ 4.1.1 PROBE VERDICTS ════════"
          cat maestro-debug/probe-verdicts.txt 2>/dev/null || echo "(none recorded — the probe step did not run)"
          echo "══════════════════════════════════════"
          echo "A FAIL here is a RESULT, not a broken build. Read docs/audits/2026-08-11-maestro-coverage/"
          echo "§5, and ledger anything that failed as device-owed — do NOT weaken a check to make it pass."

      # Maestro resolves a `takeScreenshot` path relative to the FLOW FILE's directory, not the working
      # directory — so `takeScreenshot: maestro-debug/tut-beat-1` lands in `.maestro/maestro-debug/`,
      # which is outside this job's artifact glob.
      #
      # The first fully green run therefore passed every assertion and uploaded NO screenshots at all:
      # a gate that reported success while producing none of the evidence it exists to produce.
      - name: Collect the Maestro screenshots
        if: always()
        run: |
          mkdir -p maestro-debug
          echo "── screenshots found ──"
          find . "$HOME/.maestro" \( -name 'tut-*.png' -o -name 'probe-*.png' \) -not -path '*/node_modules/*' 2>/dev/null | tee /tmp/shots.txt
          while IFS= read -r f; do [ -f "$f" ] && cp -f "$f" maestro-debug/ || true; done < /tmp/shots.txt
          echo "── collected into maestro-debug/ ──"
          ls -la maestro-debug/ || true

      - name: Screenshot the final simulator state
        if: always()
        run: xcrun simctl io booted screenshot maestro-debug/final-screen.png || true

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p maestro-debug/crash
          cp -R ~/Library/Logs/DiagnosticReports/. maestro-debug/crash/ 2>/dev/null || true
          latest=$(ls -t maestro-debug/crash/*.ips 2>/dev/null | head -1)
          [ -n "$latest" ] && head -200 "$latest" || echo "(no .ips crash file found)"

      - name: Per-flow results + the small diagnosis bundle
        if: always()
        working-directory: .
        run: node scripts/collect-lane-diagnostics.mjs --tier iphone

      - name: Upload the small diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-diagnostics-iphone
          path: apps/rn/lane-diagnostics/**
          # ⛔ CAUGHT BY `lint:lane` BEFORE IT COST A CYCLE. The collector preserves Maestro's own layout,
          # which puts the view hierarchy under `.maestro/tests/…` — a HIDDEN segment. Without this flag
          # upload-artifact v4 drops exactly the files this bundle exists to ship, and the artifact would
          # arrive looking like a run that produced no hierarchy.
          include-hidden-files: true
          if-no-files-found: warn
          # ⭐ 4.1.9b.5 — 90 days, against `maestro-report`'s default. 4.1.9c's writer stamps the checklist
          # from `native-lane-results.json`, and an input that expires in a week is an input that has to
          # be regenerated by re-running a 20-minute lane.
          retention-days: 90

      # ⚠️ `include-hidden-files` is load-bearing, not hygiene. Maestro's `--debug-output ./maestro-debug`
      # writes everything worth having — per-command logs, the VIEW HIERARCHY at the failure, and its own
      # failure screenshots — under `maestro-debug/.maestro/tests/<run>/`, a HIDDEN path. upload-artifact
      # v4 skips hidden files by default, so this step shipped its own name's worth of nothing.
      #
      # ⚠️ RENAMED from `maestro-report` at 4.1.9b — two jobs cannot upload one artifact name. Anything
      # quoting the old name is stale.
      - name: Upload Maestro report + debug (screenshots + view hierarchy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-iphone
          include-hidden-files: true
          # ⛔ DROP `device-simulator.log` — 300 MB of run 31603811840's 322 MB was this one file per
          # flow, Maestro's dump of the ENTIRE simulator syslog, 118 MB for flow 01 alone. Never read
          # once: the app-filtered unified log is captured separately as `maestro-debug/os-log.txt`, and
          # native crashes have their own step.
          #
          # ⚠️ THE COMMENTS BELONG HERE, NOT IN THE BLOCK. The first attempt put them inside `path: |`,
          # where every line is literal text — so each `#` line became a path PATTERN, the artifact's
          # common root moved to the workspace root, and every debug path gained an `apps/rn/` segment
          # mid-investigation. Syntax verified against the action's own docs: bare `!`, unquoted, AFTER
          # the includes.
          path: |
            apps/rn/maestro-report.xml
            apps/rn/maestro-debug/**
            apps/rn/xcodebuild-xctest.log
            !apps/rn/maestro-debug/**/device-simulator.log

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # IPAD TIER ( [D30] ) — its own machine, its own boot, its own answer.
  #
  # ⚡ `!cancelled()` used to be load-bearing on this step and is now STRUCTURAL: as a separate job it
  # cannot inherit the iPhone tier's failure at all. Run 31626109780 skipped the iPad measurement
  # entirely because a bare `if:` gets an implicit `success()` and flow 08 had failed — a whole class of
  # accident the split removes rather than guards.
  # ⛔ Its deliverable is a hierarchy dump and five screenshots, not a verdict: "they did not survive a
  # 1024pt layout" is a RESULT to read. The job still reports its own exit status honestly.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  ipad:
    name: iPad tier
    needs: build
    if: ${{ inputs.mode != 'probe' && inputs.scope != 'xcuitest' && (inputs.device == 'ipad' || inputs.device == 'both') }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/rn
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rn-ios-sim-products

      - name: Install Maestro (+ idb for the iOS driver)
        run: |
          brew tap facebook/fb && brew install idb-companion || true
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot an iPad simulator and run the [D30] iPad tier
        continue-on-error: true
        env:
          # ⛔ 420 s, RAISED FROM 240 s 2026-08-14 — PARITY WITH THE IPHONE STEP, WHICH ALREADY HAD IT.
          # Run 31822453981's iPad tier died on `iOS driver not ready in time` with ZERO flows run, 14m40s
          # spent, and nothing measured. That is the identical exception the iPhone step was raised to
          # 420 s for after run 31646289268 — the fix was applied to one of the two places that needed it.
          # ⚡ It IS a timing problem, not a broken driver: the dark-theme `i02` re-run minutes later came
          # up fine on the same simulator. The driver was coming; the 240 s gate fired first.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '420000'
        run: |
          # ⛔ SELECT BY MEASURED WIDTH, NEVER BY NAME. Run 31630150499 preferred `grep -i pro` and booted
          # **iPad mini (A17 Pro)** — the match was the CHIP name. At 1488px/2 = 744pt that device is
          # `compact` (`sizeClass.ts`: regular ≥ 768, expanded ≥ 1024), so the run exercised the PHONE
          # layout on an iPad and passed. That is [D30]'s own named void condition — "green while testing
          # nothing" — committed by the step written to implement [D30].
          #
          # ⚠️ The name itself CONTAINS parentheses on every current iPad ("iPad Pro 13-inch (M4)"), so a
          # pattern that stops at the first `(` matches nothing at all. Anchor on the 36-char UDID and
          # take everything before it as the name.
          AVAIL=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPad' \
            | sed -E 's/^[[:space:]]*(.+) \(([0-9A-Fa-f-]{36})\) \(.*/\2|\1/')
          echo "── iPads available ──"; echo "$AVAIL"
          if [ -z "$AVAIL" ]; then echo "::error::no iPad simulator available on this runner"; exit 1; fi

          # ⛔ READ THE GEOMETRY, DO NOT BOOT FOR IT. The first version of this booted every candidate iPad
          # to screenshot and measure it — and run 31636187156 spent **20+ minutes** in that loop before
          # the job hit its timeout and was cancelled mid-tier. Correct selection, unusable method: a
          # runner image carries six to eight iPads and each boot is 30-60 s.
          #
          # Every device type ships its screen geometry on disk, so this is a file read per candidate
          # (~1 s total) and exactly ONE boot — the winner.
          BEST_UDID=""; BEST_NAME=""; BEST_PT=0
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            U="${row%%|*}"; N="${row#*|}"
            # Match the device to its .simdevicetype bundle by name, then read points = width / scale.
            PROF=$(ls -d /Library/Developer/CoreSimulator/Profiles/DeviceTypes/*.simdevicetype 2>/dev/null \
              | while read -r B; do
                  DN=$(plutil -extract CFBundleName raw "$B/Contents/Info.plist" 2>/dev/null)
                  [ "$DN" = "$N" ] && echo "$B/Contents/Resources/profile.plist"
                done | head -1)
            W=$(plutil -extract mainScreenWidth raw "$PROF" 2>/dev/null)
            S=$(plutil -extract mainScreenScale raw "$PROF" 2>/dev/null)
            # ⛔ `mainScreenScale` comes back as a FLOAT on most device types — "2.000000" — and as "2" on
            # a few. Bash arithmetic cannot divide by "2.000000", so run 31642490867 computed 0pt for every
            # wide iPad and 744pt for the mini (the one integer), then correctly refused to run.
            # ⚡ The fail-loud guard caught my own parse bug instead of quietly testing the phone layout on
            # an iPad — which is precisely the failure it was written to prevent, one layer up.
            S=${S%%.*}
            PT=0
            if [ -n "$W" ] && [ -n "$S" ] && [ "$S" -gt 0 ] 2>/dev/null; then PT=$(( W / S )); fi
            echo "   $N → ${W:-?}px / ${S:-?}x = ${PT}pt"
            if [ "$PT" -gt "$BEST_PT" ]; then BEST_PT=$PT; BEST_UDID=$U; BEST_NAME=$N; fi
          done <<< "$AVAIL"

          # ⛔ FAIL LOUD rather than measure the wrong thing. A compact "iPad" run is worse than no iPad
          # run: it reports a pass for checks it never executed.
          echo "Widest available iPad: $BEST_NAME at ${BEST_PT}pt"
          # ⚠️ 0pt means the plist READ failed (a renamed key, a bundle whose CFBundleName does not match
          # simctl's device name), not that the device is tiny. It lands in the same fail-loud branch on
          # purpose — the printed table above says which, and a silent fallback to name-matching is what
          # put a 744pt iPad mini through this lane in the first place.
          if [ "$BEST_PT" -lt 1024 ]; then
            echo "::error::widest available iPad measured ${BEST_PT}pt — below the 1024pt \`isExpanded\` threshold (0 = plist read failed; see the table above)."
            echo "::error::[D30]'s checks (master-detail, inline sheet) do not run below 1024pt, so this"
            echo "::error::would be a green run that tested the compact layout. See sizeClass.ts."
            exit 1
          fi
          UDID="$BEST_UDID"; NAME="$BEST_NAME"
          echo "Booting iPad: $NAME ($UDID) — ${BEST_PT}pt, expanded"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/DebtPlannerRN.app
          mkdir -p maestro-debug
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "DebtPlannerRN" OR senderImagePath CONTAINS "DebtPlannerRN"' \
            > maestro-debug/os-log-ipad.txt 2>&1 &
          LOG_PID=$!
          # ⚡ MEASURE the frame rather than assuming it. [D30]'s carried hypothesis is entirely about
          # width, and this is the cheapest possible way to stop it being a hypothesis.
          xcrun simctl io "$UDID" screenshot maestro-debug/ipad-00-boot.png || true
          sips -g pixelWidth -g pixelHeight maestro-debug/ipad-00-boot.png || true
          # ⚠️ `|| STATUS=$?`, not a bare call then `$?`. GitHub runs `run:` under `bash -e`, so a red
          # Maestro would abort the step on the spot — skipping the log kill and the status line, and
          # throwing away the "it failed, here is how far it got" that is this step's entire output.
          STATUS=0
          # ⭐ 4.1.5.2 — `05` joins the iPad list, and it is the FIRST check here that can actually fail
          # for an iPad-specific reason. `i01` asserts nothing device-specific by design, so until then
          # this tier was infrastructure without coverage. §11.15's ring-origin invariant is the opposite:
          # on the iPhone the overlay's origin is {0,0} and the assertion is satisfied by a build with no
          # correction at all, while here the tab bar is a left RAIL and the origin sits a sidebar-width
          # right — the only arrangement in which the check has two possible answers.
          # ORDER: `05` runs after `i01` so the measurement flow keeps its clean position — `05` finishes
          # the walkthrough and marks it seen, which changes what Today renders. It relaunches with
          # `clearState: false`, so `i01` leaving the debt sheet open costs it nothing.
          # ⛔ THE RETRY, ALSO PARITY — retry ONLY on the driver-startup signature, never on a red flow.
          # ⛔ A SUBSHELL `( … )`, NOT `{ … }`, AND `pipefail` INSIDE IT. Without pipefail the pipeline
          # reports TEE's status — always 0 — so STATUS would be 0 on every failure: the retry would never
          # fire and the tier would report success for a stall. But `set -o pipefail` at STEP scope would
          # reach the device-selection pipelines above, where `simctl list | grep | sed` finding nothing is
          # a handled case (`if [ -z "$AVAIL" ]`) that would instead abort the step under `bash -e`.
          run_ipad_tier() (
            set -o pipefail
            maestro test \
              .maestro/01-launch-smoke.yaml \
              .maestro/i01-ipad-boot.yaml \
              .maestro/i02-ipad-step5-landscape.yaml \
              .maestro/i03-ipad-rotate-midstep.yaml \
              .maestro/05-tutorial-walkthrough.yaml \
              --format junit --output maestro-report-ipad.xml --debug-output ./maestro-debug-ipad 2>&1 | tee "$1"
          )
          run_ipad_tier /tmp/maestro-ipad-1.txt || STATUS=$?
          if [ "$STATUS" -ne 0 ] && grep -q "iOS driver not ready in time" /tmp/maestro-ipad-1.txt; then
            echo "::warning::iPad tier: iOS driver failed to start and NO flow ran — retrying the tier once."
            STATUS=0
            run_ipad_tier /tmp/maestro-ipad-2.txt || STATUS=$?
          fi
          kill "$LOG_PID" 2>/dev/null || true

          # ⚠️ 4.1.5.6 — §11.16 ASKS FOR BOTH THEMES, and [D33] judged only LIGHT. Rather than fork the
          # flow, re-run `i02` alone under a dark appearance into its OWN debug directory: same
          # assertions, different theme, no second file to keep in step with the first.
          #
          # ⛔ `takeScreenshot` writes RELATIVE TO THE WORKING DIRECTORY, not into `--debug-output`, so a
          # second run of the same flow OVERWRITES the first flow's frames. The light frame is therefore
          # parked before the dark run and restored after it, and the dark one is renamed on the way out.
          cp maestro-debug/ipad-step5-landscape.png /tmp/ipad-step5-light.png 2>/dev/null || true
          xcrun simctl ui booted appearance dark || true
          maestro test .maestro/i02-ipad-step5-landscape.yaml \
            --debug-output ./maestro-debug-ipad-dark || echo "dark-theme i02 did not pass (recorded, not fatal)"
          mv maestro-debug/ipad-step5-landscape.png maestro-debug/ipad-step5-landscape-dark.png 2>/dev/null || true
          cp /tmp/ipad-step5-light.png maestro-debug/ipad-step5-landscape.png 2>/dev/null || true
          xcrun simctl ui booted appearance light || true

          # ⚠️ 4.1.5.5 — STRAIGHTEN THE LANDSCAPE FRAME. `takeScreenshot` captures the device FRAMEBUFFER,
          # which stays in the physical portrait orientation however the app is rotated, so `i02`'s beat-5
          # frame lands on its side. That flow's ONLY deliverable is a composition judgement, and judging a
          # composition sideways is not judging it.
          #
          # `sips -r 270` (counter-clockwise) matches `LANDSCAPE_LEFT`. ⛔ Scoped by FILENAME to the frames
          # that are actually landscape — a blanket rotate would tip every portrait screenshot in the
          # artifact on its side. ⚠️ The trailing `*` on the second pattern is load-bearing — it catches
          # the dark frame written above.
          for f in maestro-debug/ipad-landscape-*.png maestro-debug/ipad-step5-landscape*.png; do
            [ -f "$f" ] && sips -r 270 "$f" >/dev/null 2>&1 && echo "straightened $f" || true
          done

          echo "iPad tier exit status: $STATUS (recorded, not fatal — see the step comment)"
          exit 0

      - name: Screenshot the final simulator state
        if: always()
        run: xcrun simctl io booted screenshot maestro-debug/final-screen-ipad.png || true

      - name: Per-flow results + the small diagnosis bundle
        if: always()
        working-directory: .
        run: node scripts/collect-lane-diagnostics.mjs --tier ipad

      - name: Upload the small diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-diagnostics-ipad
          path: apps/rn/lane-diagnostics/**
          # ⛔ CAUGHT BY `lint:lane` BEFORE IT COST A CYCLE. The collector preserves Maestro's own layout,
          # which puts the view hierarchy under `.maestro/tests/…` — a HIDDEN segment. Without this flag
          # upload-artifact v4 drops exactly the files this bundle exists to ship, and the artifact would
          # arrive looking like a run that produced no hierarchy.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Maestro report + debug (screenshots + view hierarchy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-ipad
          include-hidden-files: true
          path: |
            apps/rn/maestro-report-ipad.xml
            apps/rn/maestro-debug/**
            apps/rn/maestro-debug-ipad/**
            apps/rn/maestro-debug-ipad-dark/**
            !apps/rn/maestro-debug/**/device-simulator.log
            !apps/rn/maestro-debug-ipad/**/device-simulator.log
            !apps/rn/maestro-debug-ipad-dark/**/device-simulator.log
