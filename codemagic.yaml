# Debt Planner v1.7 — Codemagic CI/CD
#
# Builds the EXPO React-Native app in `apps/rn` (the v1.7 rewrite that REPLACES the retired Capacitor
# app — the old `ios-android-release`/`cap sync` workflow was removed 2026-07-28). Adapted from
# FinancialFreedom/codemagic.yaml `ios-testflight` (same Expo-56 + Codemagic stack, proven on a live
# WidgetKit build) — full context in docs/DEBT_NATIVE_BLOCK_MANUAL_STEPS.md.
#
# Manual-only (no `triggering:` block → never auto-spends minutes; start it from the Codemagic UI).
#
# ⚠️ CI config that CANNOT be locally verified (no macOS here) — the FIRST Codemagic run is the
# validation pass; expect one round of tuning. The likeliest tweak is the generated project/scheme
# NAME: Expo derives it from app.json `expo.name` ("Debt Planner (RN)" → expected "DebtPlannerRN").
# If prebuild names the .xcworkspace/scheme differently, update the two paths below.
# (Widget 2nd bundle id + its `fetch-signing-files` step ADDED at 3.5.3, mirroring Freedom — see the
# "Apply iOS signing profiles" step.)

workflows:
  debt-planner-rn:
    name: Debt Planner RN — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData

    environment:
      node: 22
      vars:
        # VIS-6d: the @sentry/react-native config plugin wires a source-map upload build phase that
        # HARD-FAILS a release archive without a SENTRY_AUTH_TOKEN. Sentry ships DISABLED (no DSN) until
        # Phase 6, so suppress the upload here — otherwise the archive breaks at PhaseScriptExecution.
        # Flip to a real token (source-map upload) when the DSN goes live at Phase 6.
        SENTRY_DISABLE_AUTO_UPLOAD: "true"
      groups:
        - AppleConnect
      # Automatic signing — Codemagic creates/fetches the distribution cert + App Store profile for
      # the main app via the AppleConnect ASC API key. `com.jasonsnyder.debtplanner` already exists
      # (the retired Capacitor app used it), so no pre-registration is needed, and v1.7 ships as an
      # UPDATE to that App Store record.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jasonsnyder.debtplanner

    scripts:
      - name: Install dependencies (root + apps/rn)
        # No npm workspaces — install root (core/tooling) then the RN app's own node_modules. `@core`
        # is a Metro SOURCE alias (../../packages/core), so core needs no build/link. apps/rn's
        # postinstall copies the CanvasKit wasm (web-only; harmless on a native build).
        script: |
          npm install --prefer-offline --no-audit --no-fund
          npm --prefix apps/rn install --prefer-offline --no-audit --no-fund

      - name: Generate the native iOS project (expo prebuild)
        working_directory: apps/rn
        # /ios is gitignored (Continuous Native Generation) — regenerated from app.json + config
        # plugins (incl. plugins/with-local-notifications-only.js, which strips the Push entitlement).
        # expo prebuild runs `pod install` itself on macOS.
        script: |
          npx expo prebuild --platform ios

      - name: Apply iOS signing profiles (fetch BOTH bundle ids — app + widget)
        working_directory: apps/rn
        # ⚠️ MULTI-TARGET (3.5.3, mirrors Freedom 2026-07-15): the widget extension
        # (`com.jasonsnyder.debtplanner.widget` — its own App ID + App Group registered in the portal +
        # set up in Codemagic, Jason 2026-07-29) is a SECOND signable target that ALSO hosts the Live
        # Activity. The `ios_signing` block above only fetches the MAIN app's profile → the widget would
        # fail "requires a provisioning profile". Explicitly fetch/create an App Store profile for BOTH
        # bundle ids (idempotent for the app), THEN map them onto the targets.
        # Scope --project to the REAL app project (not the **/*.xcodeproj glob — node_modules native
        # modules ship their own .xcodeproj with no profile); --warn-only is the safety net. (Freedom lesson.)
        script: |
          app-store-connect fetch-signing-files "com.jasonsnyder.debtplanner" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.jasonsnyder.debtplanner.widget" --type IOS_APP_STORE --create
          xcode-project use-profiles --project ios/DebtPlannerRN.xcodeproj --warn-only

      - name: Increment iOS build number
        working_directory: apps/rn/ios
        script: |
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set marketing version from git tag (tagged releases only)
        working_directory: apps/rn/ios
        # Build NUMBER always auto-increments (above). The marketing VERSION comes from app.json
        # `version` (1.7.0) via prebuild for manual/internal builds — this MUST be > the live 1.6 or
        # App Store Connect rejects the upload. A tag-triggered build (`git tag v1.7.1 && git push
        # --tags`) overrides it here so a release is pinned to its tag. (Freedom pattern.)
        script: |
          if [ -n "$CM_TAG" ]; then
            agvtool new-marketing-version "${CM_TAG#v}"
          else
            echo "No git tag on this build — keeping app.json marketing version (1.7.0)."
          fi

      - name: Build iOS IPA
        working_directory: apps/rn
        # ⚠️ Pin the archive -destination to iOS. Debt has supportsTablet:true, so WITHOUT this
        # xcodebuild resolves "My Mac (Designed for iPad)" and native targets can't sign for Mac →
        # a false "requires a provisioning profile" that dies before compiling. (Freedom lesson 2026-07-15.)
        script: |
          xcode-project build-ipa \
            --workspace "ios/DebtPlannerRN.xcworkspace" \
            --scheme "DebtPlannerRN" \
            --archive-flags="-destination generic/platform=iOS"

      - name: List build outputs
        script: |
          find apps/rn/build apps/rn/ios/build -iname "*.ipa" 2>/dev/null || true

    artifacts:
      - apps/rn/build/ios/ipa/*.ipa
      - apps/rn/ios/build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - jason.snyder1984@gmail.com
        notify:
          success: true
          failure: true

# Android (RN) is v1.8 — no Google Play signing yet. When it lands, add an "android-internal-track"
# workflow: npm install → expo prebuild --platform android → Gradle build → publish via google_play.
