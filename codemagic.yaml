workflows:
  ios-android-release:
    name: iOS Android Release

    environment:
      node: 22

      groups:
        - Android KeyStore
        - AppleConnect

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jasonsnyder.debtplanner

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build Next.js app
        script: npm run build

      - name: Decode Android keystore
        script: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > "$HOME/keystore.jks"
          ls -lh "$HOME/keystore.jks"

      - name: Sync Capacitor
        script: npx cap sync

      - name: Initialize keychain
        script: keychain initialize

      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project buil-ipa \
            --project "ios/App/App.xcodeproj*" \
            --scheme "App"


      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/keystore.jks" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"

      - name: List build outputs
        script: |
          find ios -type f | grep ipa || true
          find android/app/build/outputs -type f || true

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - xcodebuild-archive.log
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
