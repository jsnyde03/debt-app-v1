workflows:
  ios-android-release:
    name: iOS Android Release

    environment:
      node: 20

    scripts:
      - name: Install dependencies
        script: npm install
      
      - name: Build Next.js app
        script: npm run build
      
      - name: Sync Capacitor
        script: npx cap sync
    
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab