workflows:
  ios-android-release:
    name: iOS Android Release

environment:
  node: 22
  groups:
    - AndroidKeyStore
    - AppleConnect

scripts:
  - name: Install dependencies
    script: npm install

  - name: Build Next.js app
    script: npm run build

  - name: Decode Android keystore
    script: |
      echo "$CM_KEYSTORE_BASE64" | base64 --decode > $HOME/keystore.jks

  - name: Sync Capacitor
    script: npx cap sync

  - name: Build Android APK
    script: |
      cd android
      ./gradlew assembleRelease \
      -Pandroid.injected.signing.store.file=$HOME/keystore.jks \
      -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
      -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
      -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
artifacts:
  - android/app/build/outputs/apk/release/*.apk
  - android/app/build/outputs/**/*.apk
  - android/app/build/outputs/**/*.aab
  - build/**/*

publishing:
  app_store_connect:
    api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    issuer_id: $APP_STORE_CONNECT_ISSUER_ID
