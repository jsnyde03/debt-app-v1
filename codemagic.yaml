workflows:
  ios-android-release:
    name: iOS Android release
  
  environment:
    node: 22
  
  scripts:
    - name: Install dependencies
      script: npm install
    
    - name: Build Next.js app
      script: npm run Build
    
    - name: Decode Android keystore
      script: |
        echo $CM_KEYSTORE_BASE64 | base64 --decode > $HOME/keystore.jks
    
    - name: Sync Capacitor
      script: npx cap Sync
    
    - name: Build Android APK
      script: |
        cd android
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$HOME/keystore.jks \
          -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.store.alis=$CM+KEY_ALIAS

artifacts:
  - android/app/build/outputs/**/*.apk
