workflows:
  ios-android-release:
    name: iOS Android Release

environment:
  node: 22
  groups:
    - AndroidKeyStore
    - AppleConnect

ios_signing:
  distribution_type: app_store
  bundle_identifier: com.jasonsnyder.debtplanner

scripts:
  - name: Install dependencies
    script: npm install

  - name: Build Next.js app
    script: npm run build

  - name: Decode Android keystore
    script: |
      echo "$CM_KEYSTORE_BASE64" | base64 --decode > $HOME/keystore.jks

  - name: Sync Capacitor
    script: npx cap sync

  - name: Install CocoaPods
    script: |
      cd ios/App
      pod install

  - name: Build iOS IPA
    script: |
      xcode-project build-ipa \
      --workspace "ios/App/App.xcworkspace" \
      --scheme "App"

  - name: Build Android APK
    script: |
      cd android
      chmod +x gradlew
      ./gradlew assembleRelease \
      -Pandroid.injected.signing.store.file=$HOME/keystore.jks \
      -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
      -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
      -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD

artifacts:
  - build/ios/ipa/*.ipa
  - android/app/build/outputs/**/*.apk

publishing:
  app_store_connect:
  api_key: $APP_STORE_CONNECT_PRIVATE_KEY
  key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
  issuer_id: $APP_STORE_CONNECT_ISSUER_ID
