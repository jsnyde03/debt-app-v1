# PROBE · `setOrientation` — 4.1.1
#
# Gates §10's two adaptive-layout checks and the rotation half of §11.8. It is probed HERE on an iPhone,
# deliberately, so the command's support is settled before 4.1.3 spends a cycle booting an iPad — a red
# here would otherwise be indistinguishable from "the iPad boot is misconfigured".
#
# Documented values: PORTRAIT · LANDSCAPE_LEFT · LANDSCAPE_RIGHT · UPSIDE_DOWN. The docs state only that
# it is unsupported on Web.
#
# ⚠️ The assertion after the rotation is load-bearing. `setOrientation` could plausibly be accepted and do
# nothing, and a file that only rotates would go green either way — reporting a capability nobody has.
# Asserting that the app is still alive and rendering afterwards is the minimum that can fail.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true
# ⚠️ THE FIRST DIAGNOSIS OF THIS LINE WAS WRONG, and the correction is worth more than the fix.
#
# Cycle 1 (2026-08-11): p01 passed and every later file failed here. The obvious story — "p01 is the only
# file that waited, so a cold launch outruns the default timeout" — fit the verdict table exactly and was
# false. The failure SCREENSHOT shows "Will you make it to payday?" plainly rendered, and the hierarchy
# dump Maestro captured at that moment contains THREE nodes, all status bar: "No signal", the Wi-Fi bars,
# "Not charging". The app's UI was on screen and not in the accessibility tree at all.
#
# The real cause was p02, one file earlier: its `openLink` raised the iOS "Open in …?" confirmation, a
# SpringBoard-owned modal that nothing dismissed. It took over the a11y hierarchy for the rest of the run.
# p06 passed through the same conditions only because it asserts nothing about the screen.
#
# `extendedWaitUntil` is KEPT — it is the right shape regardless (wait for a stated signal, don't race)
# and p01 proved it works. But it is not why this line failed, and a comment claiming otherwise would have
# entered the record as measured fact. The signal that the story was wrong was already visible: flow 01
# does the same bare assertion after the same launch and has always been green.
- extendedWaitUntil:
    visible: "Will you make it to payday?"
    timeout: 20000

- setOrientation: LANDSCAPE_LEFT
- assertVisible: "Will you make it to payday?"
- takeScreenshot: maestro-debug/probe-orientation-landscape

- setOrientation: PORTRAIT
- assertVisible: "Will you make it to payday?"
- takeScreenshot: maestro-debug/probe-orientation-portrait
