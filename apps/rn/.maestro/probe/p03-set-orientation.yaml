# PROBE · `setOrientation` — 4.1.1
#
# Gates §10's two adaptive-layout checks and the rotation half of §11.8. It is probed HERE on an iPhone,
# deliberately, so the command's support is settled before 4.1.3 spends a cycle booting an iPad — a red
# here would otherwise be indistinguishable from "the iPad boot is misconfigured".
#
# Documented values: PORTRAIT · LANDSCAPE_LEFT · LANDSCAPE_RIGHT · UPSIDE_DOWN. The docs state only that
# it is unsupported on Web.
#
# ⚠️ The assertion after the rotation is load-bearing. `setOrientation` could plausibly be accepted and do
# nothing, and a file that only rotates would go green either way — reporting a capability nobody has.
# Asserting that the app is still alive and rendering afterwards is the minimum that can fail.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true
# ⚠️ `extendedWaitUntil`, not a bare `assertVisible` — proven necessary by the first probe run
# (2026-08-11): p01 was the ONLY file that waited, and the ONLY one that passed. A cold `clearState`
# launch of this app on a CI simulator takes longer than Maestro's default assertion timeout, which is
# why the workflow's own boot step sleeps 25s before it screenshots. Every file below the first one
# failed on THIS line for that reason and no other.
- extendedWaitUntil:
    visible: "Will you make it to payday?"
    timeout: 20000

- setOrientation: LANDSCAPE_LEFT
- assertVisible: "Will you make it to payday?"
- takeScreenshot: maestro-debug/probe-orientation-landscape

- setOrientation: PORTRAIT
- assertVisible: "Will you make it to payday?"
- takeScreenshot: maestro-debug/probe-orientation-portrait
