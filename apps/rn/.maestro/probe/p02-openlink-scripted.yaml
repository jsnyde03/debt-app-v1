# PROBE · `openLink` into the SCRIPTED demo — 4.1.1
#
# ⚡ THE HIGHEST-STAKES FILE HERE: 15 checks (§12.1–§12.7) hang on it.
#
# The device checklist re-scoped §12.1–§12.7 on 2026-08-11 as "owed to the capture/embed lane rather than
# runnable from the app's own doors", because "a device build cannot pass `?mode=scripted`". That is true
# for a human holding a phone — the scripted run has no user-facing entry by design ([D23]) — and false
# for a test runner that can open a URL.
#
# The seam is already in the code and needs nothing added:
#   • `apps/rn/app.json`  → "scheme": "debtplannerrn"
#   • `src/app/demo.tsx:28,61` → reads `mode` off the route; `mode === 'scripted'` starts the scripted run
#   • `src/components/plan/DemoDock.tsx:40` → the dock renders ONLY when `mode === 'scripted'`
#
# So the dock is the perfect witness: it is the one element that cannot appear in an explore run, which
# means a green here proves the deep link selected the right MODE, not merely that it reached the route.
#
# If it goes RED, the likely cause is expo-router's linking config not resolving this path, not Maestro —
# check the run's view hierarchy for whether the app landed on onboarding (link ignored) or on the tabs
# with no dock (link routed, but explore mode). Those are different repairs.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true

- openLink: debtplannerrn:///demo?mode=scripted

# `DemoDock` sets `accessible` + an accessibilityLabel, so it surfaces as ONE composite element whose full
# text is this exact sentence — the same composite-element behaviour flows 03 and 04 document for
# `ListRow`. Maestro matches an element's FULL text, so this is an exact match rather than a substring.
# It doubles as the §12.6 "the dock reads as one utterance" check, which is why the string is spelled out
# in full here rather than matched loosely.
- assertVisible: "Example money. Demonstration, 1 of 5."

- takeScreenshot: maestro-debug/probe-openlink-scripted
