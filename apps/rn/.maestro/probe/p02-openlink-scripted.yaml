# PROBE · `openLink` into the SCRIPTED demo — 4.1.1
#
# ⚡ THE HIGHEST-STAKES FILE HERE: 15 checks (§12.1–§12.7) hang on it.
#
# The device checklist re-scoped §12.1–§12.7 on 2026-08-11 as "owed to the capture/embed lane rather than
# runnable from the app's own doors", because "a device build cannot pass `?mode=scripted`". That is true
# for a human holding a phone — the scripted run has no user-facing entry by design ([D23]) — and false
# for a test runner that can open a URL.
#
# The seam is already in the code and needs nothing added:
#   • `apps/rn/app.json`  → "scheme": "debtplannerrn"
#   • `src/app/demo.tsx:28,61` → reads `mode` off the route; `mode === 'scripted'` starts the scripted run
#   • `src/components/plan/DemoDock.tsx:40` → the dock renders ONLY when `mode === 'scripted'`
#
# So the dock is the perfect witness: it is the one element that cannot appear in an explore run, which
# means a green here proves the deep link selected the right MODE, not merely that it reached the route.
#
# If it goes RED, the likely cause is expo-router's linking config not resolving this path, not Maestro —
# check the run's view hierarchy for whether the app landed on onboarding (link ignored) or on the tabs
# with no dock (link routed, but explore mode). Those are different repairs.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true
# See p03 — a cold `clearState` launch outruns the default assertion timeout on a CI sim. Waiting for the
# app to be UP before deep-linking also removes a second race: an `openLink` fired at an app that has not
# finished mounting its router is a different failure from a link that does not route, and this probe has
# to be able to tell those apart.
- extendedWaitUntil:
    visible: "Will you make it to payday?"
    timeout: 20000

- openLink: debtplannerrn:///demo?mode=scripted

# ⚠️ TWO ASSERTIONS, NOT ONE — added after the 2026-08-11 run, where `openLink` reported COMPLETED and the
# dock assertion then failed. "Completed" only means Maestro issued the open; it says nothing about
# whether the app ROUTED. A single assertion on the dock cannot distinguish the two repairs this file's
# header already names, so it now asks them in order:
#
#   1. did the link reach a demo AT ALL?     → the marker, which renders in BOTH modes
#   2. did it select the SCRIPTED mode?      → the dock, which renders in scripted only
#
# A failure at (1) means the deep link never routed — look at expo-router's linking config, not at the
# mode. A failure at (2) means it routed and landed in EXPLORE — look at `demo.tsx:61`. Same red, two
# entirely different investigations, which is why one assertion was the wrong instrument.
- takeScreenshot: maestro-debug/probe-openlink-landed

# (1) `ExampleCanvasMarker` (testID at `ExampleCanvasMarker.tsx:61`) is keyed on the money being
#     fictional, not on a session mode — so it is the widest possible evidence that a sandbox is on screen.
- extendedWaitUntil:
    visible:
      id: "example-canvas-marker"
    timeout: 20000

# (2) `DemoDock` sets `accessible` + an accessibilityLabel, so it surfaces as ONE composite element whose
#     full text is this exact sentence — the same composite behaviour flows 03/04 document for `ListRow`.
#     Maestro matches an element's FULL text, so this is exact rather than a substring. It doubles as the
#     §12.6 "the dock reads as one utterance" check, which is why it is spelled out in full.
#     ⚠️ `DEMO_STAGES` has 5 entries (`demoRun.ts:90-95`) — verified, not assumed, since a stale count
#     here would fail identically to a mode that never engaged.
- extendedWaitUntil:
    visible: "Example money. Demonstration, 1 of 5."
    timeout: 20000

- takeScreenshot: maestro-debug/probe-openlink-scripted
