# PROBE · `evalScript` — 4.1.1
#
# The lowest-stakes file here, and cheap enough to be worth one slot. `evalScript` runs JS between steps
# and puts its result in `output`, which is how a flow asserts something DERIVED rather than something
# literal — the shape §13.6 needs ("the hint is announced ONCE" is a count, not a match) and the shape
# §12.0.3 needs ("exactly ONE marker on screen").
#
# ⚠️ Scope: this proves the command exists and that `output` survives into a later step. It does NOT prove
# Maestro can count matching ELEMENTS — that needs the view hierarchy, and whether it is reachable from
# `evalScript` on this build is a separate question, asked in 4.1.4 where §12.0.3 is actually built.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true

- evalScript: ${output.probe = 1 + 1}

# If `evalScript` were accepted but inert, `output.probe` would be undefined and this comparison false —
# so the assertion is what makes an inert acceptance visible rather than silently green.
- assertTrue: ${output.probe == 2}
