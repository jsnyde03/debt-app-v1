# Maestro E2E — reaching the PAYOFF SCHEDULE on real UIKit. This is the flow that would have caught the
# bug the web gate missed three times.
#
# History: "View Payoff Schedule" lived in the debt edit sheet's header and opened a sheet from inside a
# sheet. On iOS that meant either a nested Modal (never presented) or an absolute overlay rendered as a
# SIBLING of the presented Modal — behind it, invisible. Web is one DOM tree, so Playwright saw it fine.
# Flow 02 didn't catch it either: it only taps the ✕ on the ADD sheet, where the schedule entry never
# renders (it's edit-only).
#
# 3.7.A0 replaced the nesting with a real route. This asserts the whole journey on the Simulator, which
# has genuine UIKit presentation semantics: EDIT an existing debt → tap the schedule entry → the schedule
# screen is actually VISIBLE, and the edit sheet is gone rather than covering it.
#
# Depends on 01 having run first (Maestro runs flows in filename order → the demo data persists).
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: false

- tapOn:
    id: "tab-money"

# ⚠️ INSTRUMENTATION (2026-08-05). A run where this flow got as far as opening the edit sheet ended with
# the VISA DEBT GONE — the list went from 3 debts / $11,580 to 2 / $9,180, exactly Visa's $2,400. Visa
# demonstrably existed when this flow started (the tap below opened its sheet), and `DebtSheet` has no
# delete control at all, so something between here and the end of this flow destroyed it.
#
# ⚠️ Flow 03 was the obvious suspect — it leaves a native context menu open with a destructive "Delete"
# on it — and the evidence RULES IT OUT: 03 runs before this flow, and the row tap below succeeded,
# which means Visa still existed at that point. So the loss happened INSIDE this flow, after the row tap,
# where the only action taken is opening the payoff schedule. That points at the app rather than at test
# hygiene, which is the more serious of the two readings.
#
# These assertions exist to keep that honest rather than to confirm it: if the count is already wrong
# HERE, the damage predates this flow after all and the reasoning above is wrong. If it is right here and
# wrong at the end, viewing a payoff schedule destroys a debt. Remove them once the answer is in.
- assertVisible: ".*Store Card.*"
- assertVisible: ".*Visa.*"
- assertVisible: ".*Car Loan.*"

# Open an EXISTING debt (not "Add debt") — the schedule entry is edit-only, which is exactly the gap
# flow 02 left open.
#
# `.*Visa.*`, not a bare debt name. A `ListRow` spreads `groupLabel`, so the row is one composite a11y
# element whose text is "Visa, $2,400 · 26.99% APR, …", and Maestro matches an element's FULL text as a
# regex — the same thing flow 03 documents and the same reason the tab bar needed ids. This previously
# read `tapOn: "Card"`, which could never match: the demo has "Store Card", "Visa" and "Car Loan", and
# none of them is "Card". Reusing flow 03's selector because it is PROVEN to match a row in this setup.
- tapOn: ".*Visa.*"
- assertVisible: "Edit debt"

# The entry now lives in the sheet BODY and NAVIGATES. If it ever regresses to opening a nested
# presentation, the schedule won't be visible here and this fails on the Simulator — no device needed.
- tapOn:
    id: "debt-view-schedule"

# The payoff screen actually rendered…
- assertVisible: "Payoff schedule"
# …with real derived content, not an empty shell.
- assertVisible:
    text: ".*debt-free.*"
# …and the sheet that launched it is gone, so nothing is sitting on top of it.
- assertNotVisible: "Edit debt"

# Back returns to Money (a real route, so the native back gesture/control exists).
- back
- assertVisible: "Money"

# ⚠️ INSTRUMENTATION — the other half of the debt-count probe at the top of this flow. Viewing a payoff
# schedule must not change the user's debts. If this fails while the assertions at the top passed, the
# destruction happened inside this journey and is a real data-loss bug; if the top ones fail first, the
# damage predates this flow. Remove both blocks once the answer is in.
- assertVisible: ".*Store Card.*"
- assertVisible: ".*Visa.*"
- assertVisible: ".*Car Loan.*"
