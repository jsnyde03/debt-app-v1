# Maestro E2E — the native SHEET interaction, the class of bug the web gate can't see. The Add-debt
# FormSheet is a native Modal with a swipe-down GestureDetector; a header button that lives INSIDE that
# gesture is UNTAPPABLE on device (the "View Payoff Schedule" / ✕ bug found on the first device build).
# This opens the sheet and taps its ✕-in-circle (a header button) — proving header buttons are tappable
# on native, so that regression can't reach a device build silently again.
#
# Depends on 01 having run first (the ORDER IS EXPLICIT in native-e2e.yml — Maestro does NOT sort a directory argument; measured 2026-08-12).
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# DEVICE-CHECKLIST COVERAGE (4.1.6a) — parsed by `npm run audit:coverage`. Each line is a CLAIM about
# what this flow proves, written against its assertions. ⚠️ The gate checks these STRUCTURALLY (the id
# exists, its verdict allows automation); it cannot check that the assertion below really tests it.
# PARTIAL: §3.1 — the ADD sheet opens and its ✕ closes it; the EDIT-sheet half of the row is not walked
# PARTIAL: §10.2 — the iPhone NEGATIVES — layout-stacked present, layout-master-detail absent; rotation is
#                  4.1.5.6
# ──────────────────────────────────────────────────────────────────────────────────────────────────
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: false

# ── 4.1.5.3 · THE OTHER HALF OF §10, AND THE ONLY REASON THE iPAD ASSERTIONS MEAN ANYTHING ─────────
# `i01` asserts `layout-two-column` / `layout-master-detail` on the expanded iPad. On their own those
# prove the ids exist somewhere, not that they track the layout. These are their negatives, and they live
# HERE because 02 is iPhone-only by design (its subject is a header button inside a modal's swipe area,
# and on an expanded iPad the sheet is inline, so there is no modal to put one in).
#
# ⚡ That is the discrimination proof running IN THE SUITE, every time, rather than a human comparing two
# screenshots once. If a branch ever stops being conditional, one side goes red the same day.
#
# Today first, BEFORE the Money tap — `index.tsx` renders `<TwoColumn>` unconditionally and the component
# picks its own branch, so the stacked id is genuinely reachable here.
- assertVisible:
    id: "layout-stacked"

# Money tab via testID (labels aren't reliably matchable on iOS).
- tapOn:
    id: "tab-money"

# ⚠️ The negative only — there is no positive counterpart to assert. `MasterDetail`'s own compact branch
# is UNREACHABLE: `money.tsx:402` decides `isExpanded ? <MasterDetail…> : <>{list}{editor}</>`, so on a
# phone the component never mounts. Asserting an id inside it would have been coverage of a path nothing
# can reach — caught before this cost a run, and the duplicated `isExpanded` check is filed.
- assertNotVisible:
    id: "layout-master-detail"

# ⛔ FIXED 2026-08-11 — this flow was BROKEN and nothing reported it. It scrolled to and tapped a row
# labelled "Add debt", which `A10.1` (2026-08-10) deleted: Money's three per-section Add rows were
# replaced by ONE "Add" that asks what you are adding and routes ([D22a]). The commit updated the app and
# left the lane behind, exactly as `b67cf5d` did to flow 01 the same day. Neither was noticed, because
# this workflow is manual-dispatch only — a stale flow reports nothing rather than reporting red.
#
# The row may sit below the seeded debts, so scroll it in by testID rather than by a label that can move.
- scrollUntilVisible:
    element:
      id: "money-add"
    direction: DOWN
- tapOn:
    id: "money-add"

# The chooser now stands between the Add row and the form. Answering it is not incidental to this flow's
# purpose — it is the first sheet, so reaching the debt form at all proves one native Modal presented and
# dismissed before the one under test even opens.
- assertVisible: "What are you adding?"
- tapOn:
    id: "add-choice-debt"

# The FormSheet sprang up (native Modal + grabber).
- assertVisible: "Add a debt"

# Tap the ✕-in-circle close (a HEADER button). If header buttons were inside the pan GestureDetector
# again, this tap would be swallowed on native and the sheet would stay open → the flow fails.
- tapOn:
    id: "sheet-close"
- assertNotVisible: "Add a debt"
