# Maestro E2E — the Guardian WALKTHROUGH on the real iOS renderer (3.5.6b).
#
# WHY THIS FLOW EXISTS. The walkthrough is the most heavily audited feature in v1.7 (gate 3.5.3.9), and
# every round of that gate was judged by a web Playwright suite. Round 9 then found that three of its
# five blocking defects sat exactly where a web harness is structurally blind:
#   - the scrim's rounded hole is built from a 2000pt border, which react-native-web draws as CSS and iOS
#     draws by RASTERISING a multi-thousand-point bitmap unless the view clips (see
#     `scripts/check-rn-style-divergence.ts`). If that allocation fails, the dark does not render at all;
#   - `suspendStoryOnBackground` runs on a real iOS lifecycle transition, which the web suite could only
#     approximate with a `visibilitychange` event;
#   - the one interactive gesture in the arc is an RNGH drag, which nothing automated has ever driven.
# Screenshots here are taken on the REAL renderer, so the visual class the gate has repeatedly missed
# (corner geometry, the dock's frost, the ring's position) is finally observable in CI artifacts.
#
# WHAT IT DELIBERATELY DOES NOT PROVE. The simulator uses the Mac's memory, so a large allocation may
# simply succeed here and say nothing about an iPhone; haptics are unobservable anywhere but a hand; and
# VoiceOver interaction is device-QA-owed. This flow narrows the blind spot — it does not close it.
#
# ── SCOPE — proven commands only, and why that boundary has to be a FILE ────────────────────────
# Maestro validates an ENTIRE FILE before executing any of it, so one unsupported command stops every
# beat in that file from running. Ordering the risky steps last WITHIN a file therefore buys nothing —
# the boundary must be the file itself. Learned across three CI cycles at ~40 minutes each: this build
# rejects `extendedWaitUntilVisible` (unknown command) and `timeout` on assertions (unknown property),
# and each rejection cost all seven beats.
#
# So this file uses ONLY what flows 01-04 already prove works here — launchApp/clearState,
# scrollUntilVisible, tapOn, assertVisible, assertNotVisible — plus `takeScreenshot`, which is the one
# thing this flow exists to produce. Everything gestural or timing-dependent (the drag, the
# background/foreground cycle, the scripted story) lives in `06-tutorial-interactions.yaml`, where a
# parse failure costs that flow alone and leaves these screenshots intact.
#
# Depends on 01 having run first (Maestro runs flows in filename order → the demo data persists), exactly
# like flows 02–04. The demo user is not premium, so this exercises the FREE run — which is the more
# valuable one: its finale is the conversion-honesty beat, and [D9] means all seven beats render
# identically for both audiences anyway.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: false

# ══ PHASE 1 · the arc, and its screenshots ══════════════════════════════════════════════════════
# Entry via the Guardian card's own replay link rather than the invitation card: the invitation
# disappears once seen, so it is not a stable target across re-runs, while "How this works" always is.
- scrollUntilVisible:
    element:
      text: "How this works"
    direction: DOWN
- tapOn: "How this works"

- assertVisible:
    id: "tutorial-overlay"
# `tutorial-progress` renders "Step N of 7 · Example money" as ONE text node, and Maestro matches an
# element's FULL text as a regex — so a bare "Step 1 of 7" cannot match. Same reason flow 03 matches its
# debt row with a contains-regex rather than the bare name.
- assertVisible:
    text: ".*Step 1 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-1
# The ring is drawn only where a subject was measured. Its ABSENCE on a beat that declares one is the
# "beat lands on nothing" failure; here it also catches the iOS-only case where the scrim's fill fails.
- assertVisible:
    id: "tutorial-spotlight"

- tapOn: "Next"
- assertVisible:
    text: ".*Step 2 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-2
- assertVisible:
    id: "tutorial-spotlight"

- tapOn: "Next"
- assertVisible:
    text: ".*Step 3 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-3

- tapOn: "Next"
- assertVisible:
    text: ".*Step 4 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-4

# Beat 5 puts the card into trouble, and is where the ring is drawn against the TALLEST subject — the
# round-8 defect (the highlight drawn straight across the coaching dock) lived exactly here and was only
# ever judged on web. This screenshot is its native counterpart, and the single most valuable frame here.
- tapOn: "Next"
- assertVisible:
    text: ".*Step 5 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-5

- tapOn: "Next"
- assertVisible:
    text: ".*Step 6 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-6

- tapOn: "Next"
- assertVisible:
    text: ".*Step 7 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-7
# The hand-back names what premium did, for a free user — the conversion-honesty beat, and the one place
# [D9] would become a bait-and-switch if the copy were vague.
- assertVisible:
    text: ".*example money.*"

- tapOn: "Finish"
- assertNotVisible:
    id: "tutorial-overlay"
# The Example marker must be GONE: the screen is the user's real money again. Its persistence after the
# hand-back would be the honesty layer failing in the direction that actually matters.
- assertNotVisible:
    text: ".*Example money.*"
- takeScreenshot: maestro-debug/tut-handback
