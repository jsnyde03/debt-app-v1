# Maestro E2E — the Guardian WALKTHROUGH on the real iOS renderer (3.5.6b).
#
# WHY THIS FLOW EXISTS. The walkthrough is the most heavily audited feature in v1.7 (gate 3.5.3.9), and
# every round of that gate was judged by a web Playwright suite. Round 9 then found that three of its
# five blocking defects sat exactly where a web harness is structurally blind:
#   - the scrim's rounded hole is built from a 2000pt border, which react-native-web draws as CSS and iOS
#     draws by RASTERISING a multi-thousand-point bitmap unless the view clips (see
#     `scripts/check-rn-style-divergence.ts`). If that allocation fails, the dark does not render at all;
#   - `suspendStoryOnBackground` runs on a real iOS lifecycle transition, which the web suite could only
#     approximate with a `visibilitychange` event;
#   - the one interactive gesture in the arc is an RNGH drag, which nothing automated has ever driven.
# Screenshots here are taken on the REAL renderer, so the visual class the gate has repeatedly missed
# (corner geometry, the dock's frost, the ring's position) is finally observable in CI artifacts.
#
# WHAT IT DELIBERATELY DOES NOT PROVE. The simulator uses the Mac's memory, so a large allocation may
# simply succeed here and say nothing about an iPhone; haptics are unobservable anywhere but a hand; and
# VoiceOver interaction is device-QA-owed. This flow narrows the blind spot — it does not close it.
#
# ── STRUCTURE, and why it is in two phases ──────────────────────────────────────────────────────
# PHASE 1 walks all seven beats and screenshots each, using ONLY the commands flows 01–04 already prove
# work against this Maestro build: launchApp, scrollUntilVisible, tapOn, assertVisible, assertNotVisible.
# PHASE 2 then does everything gestural and timing-dependent — the drag, the scripted story, the
# background/foreground cycle — by re-entering the arc.
#
# The split is deliberate risk ordering, learned the expensive way: `extendedWaitUntilVisible` is NOT in
# this Maestro build (it fails the whole file at parse time, before a single beat runs), and a CI cycle
# here is ~40 minutes. Phase 1 therefore depends on nothing uncertain, so the screenshots — the artifact
# this flow exists to produce — are banked before anything that might not be supported is attempted.
#
# Depends on 01 having run first (Maestro runs flows in filename order → the demo data persists), exactly
# like flows 02–04. The demo user is not premium, so this exercises the FREE run — which is the more
# valuable one: its finale is the conversion-honesty beat, and [D9] means all seven beats render
# identically for both audiences anyway.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: false

# ══ PHASE 1 · the arc, and its screenshots ══════════════════════════════════════════════════════
# Entry via the Guardian card's own replay link rather than the invitation card: the invitation
# disappears once seen, so it is not a stable target across re-runs, while "How this works" always is.
- scrollUntilVisible:
    element:
      text: "How this works"
    direction: DOWN
- tapOn: "How this works"

- assertVisible:
    id: "tutorial-overlay"
# `tutorial-progress` renders "Step N of 7 · Example money" as ONE text node, and Maestro matches an
# element's FULL text as a regex — so a bare "Step 1 of 7" cannot match. Same reason flow 03 matches its
# debt row with a contains-regex rather than the bare name.
- assertVisible:
    text: ".*Step 1 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-1
# The ring is drawn only where a subject was measured. Its ABSENCE on a beat that declares one is the
# "beat lands on nothing" failure; here it also catches the iOS-only case where the scrim's fill fails.
- assertVisible:
    id: "tutorial-spotlight"

- tapOn: "Next"
- assertVisible:
    text: ".*Step 2 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-2
- assertVisible:
    id: "tutorial-spotlight"

- tapOn: "Next"
- assertVisible:
    text: ".*Step 3 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-3

- tapOn: "Next"
- assertVisible:
    text: ".*Step 4 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-4

# Beat 5 puts the card into trouble, and is where the ring is drawn against the TALLEST subject — the
# round-8 defect (the highlight drawn straight across the coaching dock) lived exactly here and was only
# ever judged on web. This screenshot is its native counterpart, and the single most valuable frame here.
- tapOn: "Next"
- assertVisible:
    text: ".*Step 5 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-5

- tapOn: "Next"
- assertVisible:
    text: ".*Step 6 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-6

- tapOn: "Next"
- assertVisible:
    text: ".*Step 7 of 7.*"
- takeScreenshot: maestro-debug/tut-beat-7
# The hand-back names what premium did, for a free user — the conversion-honesty beat, and the one place
# [D9] would become a bait-and-switch if the copy were vague.
- assertVisible:
    text: ".*example money.*"

- tapOn: "Finish"
- assertNotVisible:
    id: "tutorial-overlay"
# The Example marker must be GONE: the screen is the user's real money again. Its persistence after the
# hand-back would be the honesty layer failing in the direction that actually matters.
- assertNotVisible:
    text: ".*Example money.*"
- takeScreenshot: maestro-debug/tut-handback

# ══ PHASE 2 · the gestural + timing-dependent checks ════════════════════════════════════════════
# Everything below uses a command or option that flows 01–04 do not exercise, so any of it may need
# first-run tuning. It runs LAST on purpose: phase 1's artifacts are already on disk.
- scrollUntilVisible:
    element:
      text: "How this works"
    direction: DOWN
- tapOn: "How this works"
- tapOn: "Next"
- tapOn: "Next"
- assertVisible:
    text: ".*Step 3 of 7.*"

# The scrim is cut around the coached control and this tap must reach the REAL control underneath. If the
# cutout's hit geometry were wrong on native, the tap would be swallowed and the sheet would never open —
# which is the whole reason for running this on a simulator rather than in a browser.
- tapOn: ".*Adjust your line.*"
- assertVisible:
    id: "floor-sheet-coach"

# The one genuinely gestural moment in the arc. The slider is a react-native-gesture-handler view, so a
# tap may not register a value change the way it does under RNW — hence a real swipe.
# ⚠️ FIRST-RUN TUNING: if this does not move the value, replace with a coordinate swipe
# (`start: 80%, 60%` / `end: 20%, 60%`), which does not depend on element-relative gestures.
- swipe:
    from:
      id: "cushion-floor-slider"
    direction: LEFT

- tapOn: "Save"
# The payoff renders ONLY when the value actually changed — it is deliberately withheld for a no-op save.
# So this assertion doubles as proof that the swipe above really moved the line.
- assertVisible:
    id: "floor-impact"
- takeScreenshot: maestro-debug/tut-beat-3-payoff

# ── The payoff must survive BACKGROUNDING ───────────────────────────────────────────────────────
# Round 9's MAJOR: `suspendStoryOnBackground` re-staged the beat unconditionally, so a glance at
# Notification Center reset the line the user had just dragged and discarded the payoff they earned. iOS
# emits `inactive` for Notification Center, the app switcher and an incoming call — routine events, in
# the one feature whose thesis is that the app never moves your money on its own.
#
# `stopApp: false` is LOAD-BEARING. `launchApp` defaults to stopping the app first, which would restart
# the JS runtime and destroy the very session this checks survives — the assertion would then be testing
# a fresh launch and would fail for a reason unrelated to the defect. It must not be "fixed" by dropping
# that option, which would make the check pass vacuously.
#
# ⚠️ FIRST-RUN TUNING: if `pressKey: Home` is unsupported, the fallback is a coordinate-free
# `stopApp` + `launchApp` — which tests a COLD start, a different and weaker claim, and must be labelled
# as such rather than silently substituted. If neither works, delete this block and ledger the check as
# device-QA-owed rather than leave a flow that cannot run.
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible:
    text: ".*Step 3 of 7.*"
- assertVisible:
    id: "floor-impact"
- takeScreenshot: maestro-debug/tut-background-return

# ── The scripted story (beat 4) ─────────────────────────────────────────────────────────────────
# The attestation tap starts a chain of timers spaced to be READ — a surprise lands, the net absorbs it,
# paydays roll — so the release ack takes several seconds and renders in Today's ack slot at the TOP of
# the screen, which is the beat's declared payoff target.
#
# ⚠️ `extendedWaitUntilVisible` is NOT available in this Maestro build; it fails the file at parse time.
# `assertVisible` with a `timeout` is the substitute. If `timeout` is also unsupported here, drop it and
# rely on the screenshot alone rather than asserting on a race — a flaky assertion on a timed sequence is
# worse than no assertion, because it teaches everyone to re-run until green.
- tapOn: "Next"
- assertVisible:
    text: ".*Step 4 of 7.*"
- tapOn:
    text: ".*regular bills entered.*"
- assertVisible:
    text: ".*safety net.*"
    timeout: 20000
- takeScreenshot: maestro-debug/tut-beat-4-payoff
