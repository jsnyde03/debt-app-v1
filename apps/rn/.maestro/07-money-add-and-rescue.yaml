# Maestro E2E — §14: one Add, the answer routes, and the mis-file rescue (3.7.A10) — 4.1.2
#
# Six device-checklist checks, §14.1 through §14.6. None of them existed on the `c050173` build, so none
# has ever run on hardware, and one of them is marked in the checklist as unreachable by any automation:
#
#   §14.3 — "⏳ Web e2e cannot reach this step — it is verified here or nowhere."
#
# That was true of the WEB lane and was recorded as a limit on automation. Its two stated blockers are
# that the paycheck step will not advance without input and that "Skip for now" walks past the debt step
# to the end (`onboarding.tsx:36` — PaycheckStep's onSkip goes to step 3, not step 2). Maestro has
# `inputText`, so it types the paycheck and walks the fork properly. See
# `docs/audits/2026-08-11-maestro-coverage/` finding ③.
#
# ⚠️ RUNS AFTER 01–06 AND CLEARS STATE. It must: §14.3 is a first-run fork and only exists on a fresh
# install. Placing it at 07 means the demo data flows 02–06 depend on has already done its work. Flow 08
# then runs on the portfolio this flow builds, which is why the debt added below is not incidental.
#
# ⛔ `hideKeyboard` IS GONE AND STAYS GONE — but the reason recorded here was WRONG, and the wrong reason
# is what left the flow broken. Corrected 2026-08-12 from run 31516616133's hierarchy dump.
#
# It cannot work: run 31514348038 says so in the driver's own words — *"Couldn't hide the keyboard. This
# can happen if the app uses a custom input or doesn't expose a standard dismiss action."* That much held.
#
# What did NOT hold is the conclusion drawn from it. This header argued that `OnboardingLayout.tsx:23`'s
# KeyboardAvoidingView plus `keyboardShouldPersistTaps="handled"` meant "the app had already solved the
# problem", so no dismiss was needed. The comment it quoted says the KAV keeps the keyboard off the
# **CTAs** — it says nothing about the FIELDS, and the fields are what broke. With the keyboard up the
# ScrollView's viewport ends at the sticky CTA stack and every field below it is clipped out while still
# reporting an on-screen frame, so `tapOn` taps the CTA instead. See the swipe block below for the
# measured geometry. **A quote about one element was generalised to another.**
#
# ⚡ And the run that followed did not catch it, because `tapOn` and `inputText` report COMPLETED whether
# or not they land. The flow reaching a later step was read as proof the earlier ones worked. It is not.
#
# ⚠️ Still first-run-unproven here: `killApp`. (`inputText` is proven — it typed, just into one field.)
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# DEVICE-CHECKLIST COVERAGE (4.1.6a) — parsed by `npm run audit:coverage`. Each line is a CLAIM about
# what this flow proves, written against its assertions. ⚠️ The gate checks these STRUCTURALLY (the id
# exists, its verdict allows automation); it cannot check that the assertion below really tests it.
# COVERS: §14.1 — one Add, from all three sections
# COVERS: §14.2 — the answer lands where it says
# COVERS: §14.3 — the first-run fork
# COVERS: §14.4 — the mis-file rescue, both phases
# COVERS: §14.5 — Move to Debts
# COVERS: §14.6 — "Not a debt" stays gone across a process restart
# ──────────────────────────────────────────────────────────────────────────────────────────────────
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true

# ══ §14.3 · the first-run fork ══════════════════════════════════════════════════════════════════
# ⚠️ `extendedWaitUntil` rather than a bare assertion — wait for a stated signal instead of racing the
# app. Proven available by probe p01 (2026-08-11).
#
# ⚠️ It is NOT here because cold launches are slow. That was the first reading of cycle 1's verdict table
# and it was wrong: the failures were a SpringBoard "Open in …?" alert leaked by the deep-link probe,
# which took the app's whole UI out of the accessibility tree. The tell was already in hand — flow 01
# does the same bare assertion after the same launch and has always been green — and the story was
# believed anyway because it fit the table. Fitting the table is not evidence; the hierarchy dump was.
- extendedWaitUntil:
    visible: "Will you make it to payday?"
    timeout: 20000
- tapOn: "Get Started"

# The paycheck step is the gate that stopped the web lane. Type a real amount rather than skipping — the
# skip is precisely what walks past the step under test.
- assertVisible: "When do you get paid?"
# ⛔ THAT CLAIM COST A CI CYCLE. This said the field was "addressable by its visible label without needing
# a testID added for the test's benefit". `TextField` does set `accessibilityLabel={label}` — but it also
# renders a `<Text>` carrying THE SAME STRING, so the selector matched two nodes and only one was
# focusable. Maestro tapped the label, `inputText` typed into nothing, **and every step still reported
# COMPLETED** — the flow walked on and died three steps later, with the app's own "Enter your paycheck
# amount to continue" the only clue. Fields a flow types into now carry explicit testIDs.
- tapOn:
    id: "field-paycheck-amount"
- inputText: "2000"
- tapOn: "Continue"

- assertVisible: "Add your first debt or expense"

# PASS is two things: the toggle says Debt/Expense (never "Bill"), and the clause underneath CHANGES with
# it. The second half is the real check — a toggle that renames itself while explaining nothing is the
# defect A10.3 was fixed to remove.
- assertVisible: "Debt"
- assertVisible: "Expense"

# Matched on apostrophe-free fragments deliberately: the clauses use CURLY apostrophes (’) in the source
# (`FirstDebtOrBillStep.tsx:119-120`), and a straight one would silently never match.
- assertVisible:
    text: ".*It ends\\..*"
- assertNotVisible:
    text: ".*rent, phone, a subscription.*"

- tapOn: "Expense"
- assertVisible:
    text: ".*rent, phone, a subscription.*"
# The other direction, which is what makes this a change and not just an appearance. Asserting only that
# the new clause showed would pass even if both were on screen at once.
- assertNotVisible:
    text: ".*It ends\\..*"
- takeScreenshot: maestro-debug/s14-3-first-run-fork

# Back to Debt and actually add one — flow 08's coach-mark needs a non-empty debts list
# (`money.tsx:259` gates 'debt-row-actions' on `view.order.length > 0`).
- tapOn: "Debt"
- tapOn:
    id: "field-onboarding-name"
- inputText: "Visa Test"

# ⛔ THE SWIPE IS LOAD-BEARING — measured from run 31516616133's hierarchy dump, not inferred.
# `OnboardingLayout` is a KeyboardAvoidingView (behavior=padding) holding a ScrollView above a STICKY CTA
# stack. When the keyboard rises the container shrinks, the ScrollView's viewport ends at the CTA stack
# (~y450pt), and `field-onboarding-balance` (frame [20,474][419,526]) is CLIPPED OUT of it — while
# XCUITest still reports its on-screen frame, which now sits under "Add & Continue" ([20,457][420,509]).
# So `tapOn` FINDS the element, taps its coordinates, and hits the button. Focus never leaves the name
# field and every later `inputText` appends to it: the dump shows `field-onboarding-name` holding
# **"Visa Test240065"** — the name, the balance and the minimum concatenated into one field.
#
# ⚠️ This REFUTES the note that shipped with the `hideKeyboard` deletion: *"`inputText` works, the
# `field-*` testIDs work, and dropping `hideKeyboard` was correct."* Only the FIRST half is true. Flow 07
# walked past those steps because Maestro's `tapOn`+`inputText` report COMPLETED whether or not they
# landed — the same lying-step that already cost this lane a cycle at `field-paycheck-amount` above.
# `hideKeyboard` is still not the answer: run 31514348038 proves this build cannot dismiss the pad
# ("Couldn't hide the keyboard … doesn't expose a standard dismiss action").
#
# The swipe bottoms the form out inside the shrunken viewport, so all three remaining fields clear the
# CTA stack. Start/end are percentages so this holds on the iPad lane too, and the ScrollView clamps at
# its content end — over-scrolling is harmless because these fields ARE the end of the step.
- swipe:
    start: "50%, 40%"
    end: "50%, 18%"

- tapOn:
    id: "field-onboarding-balance"
- inputText: "2400"
- tapOn:
    id: "field-onboarding-minimum"
- inputText: "65"

# ⚡ THE WRITE-VERIFICATION, and it is the general guard against the whole defect class above: assert the
# text landed IN THE FIELD IT WAS AIMED AT. A tap that misses is silent; a field holding the wrong string
# is not. This would have failed run 31516616133 HERE, at the cause, instead of three steps later at
# "See your plan  →" — which was never a selector bug at all.
#
# ⛔ MAESTRO MATCHES LITERAL EQUALITY OR A FULL REGEX — NEVER "CONTAINS". Corrected 2026-08-12; this
# comment previously asserted the opposite as proven, and it was wrong.
# Measured: `assertVisible: "Show feature tips again"` went RED against a node reading "Show feature tips
# again. Re-offer the one-line hints on hidden features." A contains matcher passes that; a full matcher
# does not. What misled me was `"Will you make it to payday?"` passing — it passes by LITERAL EQUALITY,
# never reaching the regex, where the trailing `?` would have been a quantifier.
#
# ⚡ THE PRACTICAL RULE, and this file already followed it: a fragment needs `.*` on both ends
# (`".*It ends\\..*"` above). A bare string only matches a node whose ENTIRE text is that string — which
# is why every selector aimed at a composed `accessibilityLabel` fails. The anchors below are therefore
# redundant rather than load-bearing; they stay because they state the intent, not because they enforce it.
# The NAME field is the sentinel: it is where every mis-aimed `inputText` accumulates.
- assertVisible:
    id: "field-onboarding-name"
    text: "^Visa Test$"

- tapOn: "Add & Continue"
# ⚠️ NOT a defect: the label is byte-identical to `CompletionStep.tsx:39` (two spaces + U+2192). It was
# ledgered as a "known fix" from the failing run; the flow simply never reached this screen.
- tapOn: "See your plan →"

# ══ §14.1 · one Add, from all three sections ════════════════════════════════════════════════════
# PASS: every section opens the SAME chooser. FAIL: any section opens an editor directly — which would
# mean the section is silently classifying again, the exact defect [D22a] removed.
- tapOn:
    id: "tab-money"

# ⚡ 07 `clearState`s and re-onboards, so the once-ever record is wiped and it meets a FRESH
# `debt-row-actions` — the same landing 01 now handles, and measured the same way: run 31636187156 died
# on the very next line (`assertVisible "What are you adding?"`) because the callout took the
# `money-add` tap. Dismissed rather than re-asserted; 01 already proves the mark appears on a fresh
# portfolio, and repeating that claim here would be one rule kept in two places.
- tapOn:
    id: "coach-mark-dismiss"

- tapOn:
    id: "money-add"
- assertVisible: "What are you adding?"
- tapOn:
    id: "sheet-close"

- tapOn: "Expenses"
- tapOn:
    id: "money-add"
- assertVisible: "What are you adding?"
- tapOn:
    id: "sheet-close"

- tapOn: "Goals"
- tapOn:
    id: "money-add"
- assertVisible: "What are you adding?"
- tapOn:
    id: "sheet-close"

# ══ §14.2 · the answer lands where it says ══════════════════════════════════════════════════════
# Standing in EXPENSES, ask for a debt. PASS: you end up on the debt form, which is provable by a field
# an expense does not have.
- tapOn: "Expenses"
- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-debt"
- assertVisible: "Add a debt"
- assertVisible: "APR %"
- takeScreenshot: maestro-debug/s14-2-answer-routes
- tapOn:
    id: "sheet-close"

# ══ §14.4 · the mis-file rescue, proved in TWO PHASES ═══════════════════════════════════════════
# The checklist asks for Mortgage and Rent added together, then for the hint under Mortgage ONLY. Proving
# "only" that way needs a COUNT, and counting elements is unproven on this build (probe p06).
#
# So the same claim is made in two phases instead, and it is a STRONGER proof: Rent alone must produce
# NOTHING. A count could pass with one hint on the wrong row; this cannot. "Rent" contains no word in
# `DEBT_WORDS` (looksLikeDebt.ts:25-38) and "Mortgage" contains one.
- tapOn: "Expenses"
- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-expense"
- assertVisible: "Add an expense"
- tapOn:
    id: "field-expense-name"
- inputText: "Rent"
- tapOn:
    id: "field-expense-amount"
- inputText: "1200"
# ⚡ Write-verification — see the onboarding block above. `FormSheet` carries the same ScrollView-above-a-
# sticky-footer shape that hid the onboarding fields; whether it hides these is UNMEASURED, so this
# asserts rather than assumes. A miss here would otherwise sail on and fail at "Move to Debts".
- assertVisible:
    id: "field-expense-name"
    text: "^Rent$"
- tapOn: "Add expense"

# Phase 1 — the accusation guard. A hint here would be the app telling someone their rent is secretly a
# debt, which the detector's docblock names as costing more trust than a miss costs money.
- assertNotVisible: "Move to Debts"
- takeScreenshot: maestro-debug/s14-4-rent-untouched

- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-expense"
- tapOn:
    id: "field-expense-name"
- inputText: "Mortgage"
- tapOn:
    id: "field-expense-amount"
- inputText: "1200"
- assertVisible:
    id: "field-expense-name"
    text: "^Mortgage$"
- tapOn: "Add expense"

# Phase 2 — the hint arrives, and it reads as a question rather than a warning.
- assertVisible: "Move to Debts"
- assertVisible:
    text: ".*count toward your debt-free date.*"
- takeScreenshot: maestro-debug/s14-4-mortgage-hint

# ══ §14.5 · Move to Debts ═══════════════════════════════════════════════════════════════════════
# The move has to LAND where it says. `money.tsx:138` routes to Debts and opens the form there precisely
# so the claim is demonstrated — and the prefilled NAME is what proves the hint belonged to the Mortgage
# row rather than to Rent, which is the other half of §14.4 that phase 1 could not reach.
- tapOn: "Move to Debts"
- assertVisible: "Add a debt"
- assertVisible: "Mortgage"
- tapOn:
    id: "field-debt-balance"
- inputText: "180000"

# ⛔ `FormSheet` HAS THE SAME COVERED-FIELD DEFECT, and it cost a submitted debt to learn.
# Run 31598337615 proved flow 01's `field-debt-name` assertion passes inside this sheet, and I read that
# as "the sheet is fine". It is not — NAME simply sits at the TOP, above the sticky footer. On run
# 31603811840 the tap on `field-debt-apr` landed on **"Add debt"** instead, which SUBMITTED the form:
# the Mortgage was created at **$180,000 · 0% APR**, the `6.5` typed into a dismissed sheet, and the
# assertion below failed because there was no sheet left to assert against.
# ⚠️ A fact about one field is not a fact about the sheet. Same generalisation that put the scan copy on
# the reclassify path, two files away from here.
- swipe:
    start: "50%, 40%"
    end: "50%, 18%"

- tapOn:
    id: "field-debt-apr"
- inputText: "6.5"
# ⚡ THIS ASSERTION EARNED ITS PLACE. I filed it as probably-my-own-bug when it went red; it was the only
# thing standing between a silently mis-created debt and a green suite. Anchored, and on a numeric field
# deliberately — the value is user-typed and unformatted while the field has focus.
- assertVisible:
    id: "field-debt-balance"
    text: "^180000$"
- tapOn: "Add debt"

# In Debts…
- assertVisible:
    text: ".*Mortgage.*"
# …and GONE from Expenses. "Not in both" is the whole point: a conversion that copies rather than moves
# double-counts the obligation in the plan the app exists to produce.
- tapOn: "Expenses"
- assertNotVisible:
    text: ".*Mortgage.*"
- assertVisible:
    text: ".*Rent.*"
- takeScreenshot: maestro-debug/s14-5-moved-not-copied

# ══ §14.6 · "Not a debt" stays gone ═════════════════════════════════════════════════════════════
# A hint that cannot be silenced is an accusation on a loop. "Car Loan" matches DEBT_WORDS on "loan".
- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-expense"
- tapOn:
    id: "field-expense-name"
- inputText: "Car Loan"
- tapOn:
    id: "field-expense-amount"
- inputText: "300"
- assertVisible:
    id: "field-expense-name"
    text: "^Car Loan$"
- tapOn: "Add expense"
- assertVisible: "Not a debt"

- tapOn: "Not a debt"
- assertNotVisible: "Move to Debts"

# The dismissal is persisted to `prefs.notDebtExpenseIds`, so the check that matters is whether it
# survives a real process restart — not whether it survives a re-render. `stopApp` is the default, which
# is what is wanted here and is the OPPOSITE of flow 06's deliberate `stopApp: false`.
- killApp
- launchApp
# Cold launch again — wait for the shell before driving it, same reason as §14.3 above.
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000
- tapOn:
    id: "tab-money"
- tapOn: "Expenses"
- assertVisible:
    text: ".*Car Loan.*"
- assertNotVisible: "Move to Debts"
- takeScreenshot: maestro-debug/s14-6-not-a-debt-persists
