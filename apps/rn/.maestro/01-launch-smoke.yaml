# Maestro E2E — the cold-launch smoke, AND the seed the rest of the suite runs on.
#
# ⛔ REWRITTEN 2026-08-11. THE SUITE WAS BROKEN AND GREEN-BY-NEVER-RUNNING.
#
# This flow used to tap **"Try with Sample Data"**, which called `importStore(demoStore())` — a fabricated
# plan written into the REAL store, which persisted, which is why flows 02–06 each say "depends on 01
# having seeded the demo data".
#
# `b67cf5d` (2026-08-10) deleted that button. It updated the web e2e spec and the device checklist and
# **never touched this file**. So the tap targeted a control that no longer exists — and worse, the thing
# that replaced it ("See it in action") opens a SANDBOX that deliberately persists nothing. Even a fixed
# selector would have left flows 02–06 running against an empty app.
#
# ⚠️ It was not the only one. `A10.1` the same day replaced Money's three per-section "Add debt"/"Add
# bill"/"Add goal" rows with ONE "Add" chooser, which broke flow 02's selectors too. **Two commits, two
# broken flows, neither noticed** — because this lane is manual-dispatch only, so nothing runs it on push
# and a stale flow reports nothing at all rather than reporting red. Found by probe cycle 2 (4.1.1), and
# only because a probe file had copied a selector from here.
#
# ── WHAT IT DOES NOW ────────────────────────────────────────────────────────────────────────────
# The seed is built by WALKING ONBOARDING and adding debts through the real UI. That is strictly better
# than the import it replaces: the fabricated store was a fixture nobody's fingers could produce, while
# this exercises the same path a first-run user takes — so a break in onboarding now fails the suite at
# step one instead of hiding behind a seeded shortcut.
#
# The three debt NAMES are load-bearing: flows 03 and 04 match rows by them, and flow 04 asserts all three
# before and after its journey as a read-only invariant. Change a name here and those flows go red.
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# DEVICE-CHECKLIST COVERAGE (4.1.6a) — parsed by `npm run audit:coverage`. Each line is a CLAIM about
# what this flow proves, written against its assertions. ⚠️ The gate checks these STRUCTURALLY (the id
# exists, its verdict allows automation); it cannot check that the assertion below really tests it.
# COVERS: §1.2 — a fresh install lands on onboarding; the walk reaches Today with a seeded plan
# PARTIAL: §1.1 — reaching "Get Started" proves the launch; "no white screen / no crash" is not asserted
#                 directly
# PARTIAL: §13.3 — the row-actions mark is asserted to be OFFERED; 08 owns its dismissal and persistence
# ──────────────────────────────────────────────────────────────────────────────────────────────────
appId: com.jasonsnyder.debtplanner
---
# ══ THE SMOKE — the part that catches a New-Architecture launch crash or an autolink failure ═════
# Kept first and kept minimal, so a launch failure is unambiguous. Everything below this is the seed.
- launchApp:
    clearState: true

# ⚠️ `extendedWaitUntil`, not a bare assertion. Probe p01 (4.1.1) proved the command exists on this build,
# which the flows previously recorded as impossible. Waiting for a stated signal beats racing a launch.
#
# ⛔ 180 s, NOT 20 s — and the reason is the DRIVER, not the app. Measured in run 31516616133's
# `device-xctest.log`: the FIRST `/viewHierarchy` snapshot of a run, on a freshly booted sim, took
# **42.7 s** (17:41:18.828 → 17:42:01.550) — longer than the whole 20 s budget, so the wait expired
# before a single sample was ever evaluated. Every later snapshot in that run took 60–120 ms. The app was
# up the entire time: the failure screenshot, taken 0.4 s after the timeout, shows the screen rendered,
# and the failure hierarchy contains the element verbatim.
# ⚠️ It is a FLAKE, not a constant — the same first snapshot took 10 s in run 31514348038. A wait long
# enough to survive the slow tail is the fix; shortening it back will re-red this at random.
- extendedWaitUntil:
    visible: "Will you make it to payday?"
    timeout: 180000
- takeScreenshot: maestro-debug/smoke-cold-launch

# ══ THE SEED — onboarding, for real ═════════════════════════════════════════════════════════════
- tapOn: "Get Started"

# The paycheck is not optional dressing: flows 05 and 06 need a Guardian card, and the Guardian needs a
# paycheck. "Skip for now" would land on the completion step with no income and no card to coach.
- assertVisible: "When do you get paid?"
- tapOn:
    id: "field-paycheck-amount"
- inputText: "2000"
- tapOn: "Continue"

# Debt 1 of 3 — "Visa" is the row flows 03 and 04 long-press and tap.
- assertVisible: "Add your first debt or expense"
- tapOn:
    id: "field-onboarding-name"
- inputText: "Visa"

# ⛔ THE SWIPE IS LOAD-BEARING. Full mechanism in `07-money-add-and-rescue.yaml` at the same point, from
# run 31516616133's hierarchy dump: with the keyboard up, `OnboardingLayout`'s ScrollView viewport ends
# at the sticky CTA stack, the fields below it are clipped out while STILL reporting on-screen frames,
# and `tapOn` therefore taps the "Add & Continue" button instead of the field. Focus never moves, and
# every later `inputText` appends to the name field. `hideKeyboard` cannot substitute — this build cannot
# dismiss a decimal pad (run 31514348038). Percentages, so the iPad lane inherits it.
- swipe:
    start: "50%, 40%"
    end: "50%, 18%"

- tapOn:
    id: "field-onboarding-balance"
- inputText: "2400"
- tapOn:
    id: "field-onboarding-minimum"
- inputText: "65"
- tapOn:
    id: "field-onboarding-apr"
- inputText: "26.99"

# ⚡ Write-verification: assert the text landed in the field it was aimed at. A tap that misses is silent
# — `tapOn` and `inputText` both report COMPLETED regardless — but a field holding the wrong string is
# not. The seed the whole suite depends on is exactly where that must not go unnoticed.
#
# ⛔ MAESTRO MATCHES LITERAL EQUALITY OR A FULL REGEX — NEVER "CONTAINS". Corrected 2026-08-12; this
# comment previously asserted the opposite as proven, and it was wrong. Full note in flow 07 at the same
# step. In short: `"Will you make it to payday?"` passes by literal equality, never reaching the regex,
# which is what made "contains" look established.
# ⚡ A fragment therefore needs `.*` on both ends; a bare string matches only a node whose ENTIRE text it
# is. The anchors below are redundant rather than load-bearing, and stay to state intent.
# Only the NAME field is checked: it is where every mis-aimed `inputText` accumulates, and its value is
# the one confirmed unformatted in the hierarchy dump. A numeric field could be re-formatted for display
# and red for a reason that is not a defect.
- assertVisible:
    id: "field-onboarding-name"
    text: "^Visa$"

- tapOn: "Add & Continue"
# ⚠️ NOT a defect: byte-identical to `CompletionStep.tsx:39` (two spaces + U+2192). Ledgered as a "known
# fix" from the failing run; flow 07 simply never reached this screen.
- tapOn: "See your plan  →"

# The tab shell rendered. Asserted by testID: react-navigation groups tab buttons into composite a11y
# elements on iOS, so the "Money"/"Today" LABELS are not reliably text-matchable.
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000

# ══ Debts 2 and 3, through the A10.1 chooser ════════════════════════════════════════════════════
# ⚠️ There is no "Add debt" row any more — one "Add" asks what you are adding and routes ([D22a]). This
# is the selector change that broke flow 02, and it is spelled out here because every later flow that
# adds anything goes through the same two taps.
- tapOn:
    id: "tab-money"

# ══ The row-actions coach mark now APPEARS here, and it lands on `money-add` ════════════════════
# ⚡ This is a FIX ARRIVING, not a regression. Until 2026-08-12 the mark was refused on every Money
# render: Today is a TAB, it never unmounts, and its `useSuppressCoachMarks` was held for the whole
# session while the walkthrough invitation was pending. The probe printed
# `show:debt-row-actions=refused(suppressors=1)`; the fix gated Today's suppressor on FOCUS.
#
# ⛔ MEASURED, not assumed — run 31636187156's hierarchy at the failing step: the callout occupies
# **[16,556][424,701]**, `Press and hold a debt` is present, and `add-choice-debt` / `What are you
# adding` are ABSENT. So `tapOn: money-add` hit the callout, the chooser never opened, and the failure
# surfaced one step later. ⚠️ That lag is the recurring trap in this suite: `tapOn` reports COMPLETED
# whether or not it lands on what you meant.
#
# ⛔ THIS FLOW PASSED FOR MONTHS BECAUSE THE FEATURE WAS BROKEN. The suite encoded the defect, so
# repairing the app reddened the test — the correct direction of causation, and the reason this is
# written as coverage (§13.3) rather than as a workaround.
#
# ⚠️ Dismissed by testID, NOT by the text "Got it": Today's acks use that same word
# (`index.tsx:470/488/505`), and the button only became addressable at all once `accessible` came off the
# card — with it there, iOS collapsed the callout to a leaf and the button did not exist to tap.
- assertVisible:
    text: ".*Press and hold a debt.*"
- takeScreenshot: maestro-debug/smoke-row-actions-mark
- tapOn:
    id: "coach-mark-dismiss"
- assertNotVisible:
    text: ".*Press and hold a debt.*"

- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-debt"
- assertVisible: "Add a debt"
- tapOn:
    id: "field-debt-name"
- inputText: "Store Card"
- tapOn:
    id: "field-debt-balance"
- inputText: "800"
- tapOn:
    id: "field-debt-minimum"
- inputText: "25"

# ⚡ Write-verification, and here it is doing a SECOND job: `FormSheet` has the same shape that broke the
# onboarding step — a ScrollView above a sticky footer inside a KeyboardAvoidingView — so a covered field
# is plausible here too. It is NOT measured, and this lane's rule is to measure rather than to patch on a
# resemblance. So: no speculative swipe. If the sheet has the same defect, this assertion names it, at
# the right step, and the geometry comes from that run's hierarchy dump.
- assertVisible:
    id: "field-debt-name"
    text: "^Store Card$"
- tapOn: "Add debt"

- tapOn:
    id: "money-add"
- tapOn:
    id: "add-choice-debt"
- tapOn:
    id: "field-debt-name"
- inputText: "Car Loan"
- tapOn:
    id: "field-debt-balance"
- inputText: "8380"
- tapOn:
    id: "field-debt-minimum"
- inputText: "210"
- assertVisible:
    id: "field-debt-name"
    text: "^Car Loan$"
- tapOn: "Add debt"

# The invariant the rest of the suite depends on. If this fails, do NOT patch the later flows — the seed
# is what broke, and every red after it would be a symptom.
- assertVisible:
    text: ".*Visa.*"
- assertVisible:
    text: ".*Store Card.*"
- assertVisible:
    text: ".*Car Loan.*"
- takeScreenshot: maestro-debug/smoke-seeded-portfolio
