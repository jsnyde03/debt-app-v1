# Maestro E2E — the cold-launch smoke: the RN app boots on the iOS Simulator, onboarding renders, and
# the Try-with-Sample-Data path lands on the populated tab shell. This alone catches New-Architecture
# launch crashes + autolink failures (incl. @bacons/apple-targets + the widget-sync launch path) that
# the web gate structurally cannot. Runs in filename order.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: true

# The app launched + rendered the first onboarding screen (WelcomeStep) — the core "did New Arch boot
# without a fatal JS throw" assertion.
- assertVisible: "Will you make it to payday?"

# Demo path → importStore(demoStore()) flips onboardingComplete → the _layout route-guard swaps to the
# tabs.
- tapOn: "Try with Sample Data"

# The tab shell rendered. Assert via a stable testID — react-navigation groups tab buttons into
# composite a11y elements on iOS, so the "Money"/"Today" LABELS aren't reliably text-matchable.
- assertVisible:
    id: "tab-money"
