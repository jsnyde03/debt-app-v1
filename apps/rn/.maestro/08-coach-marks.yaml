# Maestro E2E — §13: the feature-discovery COACH-MARKS (3.5.5) — 4.1.2
#
# The checklist's §13 header says "nothing here is web-observable", and gives the measurement behind it:
# the payoff-schedule mark lands "1266pt down an 874pt screen" in the browser, because react-native-web
# puts a root-level overlay in normal document flow. So the web suite can prove a mark is OFFERED and that
# only one exists, and can never show WHERE any of them lands.
#
# ⚡ WHY A SIMULATOR ANSWERS IT. §13.1 is a UIKit PRESENTATION question, not a device question. A
# root-level overlay is a sibling of a presented Modal on iOS, so it renders BEHIND it — that is the
# entire reason `CoachMarkLayer` grew a nested host (3.5.5.5), and it is the same class of bug flow 04
# exists for. The simulator has genuine presentation semantics; the browser has one DOM tree.
#
# ⚠️ WHAT STAYS DEVICE-OWED, so a green here is not read as more than it is:
#   • §13.6 (VoiceOver hears each hint ONCE) — the doubling it hunts is a root copy AND a sheet copy both
#     live in the accessibility tree. `testID="coach-mark"` exists so a test can COUNT them
#     (CoachMarkLayer.tsx:81-84), but counting matching elements is unproven on this build → probe p06.
#     Until that lands, this flow asserts the mark's PRESENCE, never its uniqueness. Asserting "visible"
#     and calling it "exactly one" is how a check that proves nothing gets recorded as coverage.
#   • The judgement halves of §13.4 (does the hint bury the neighbouring chart?) — a human reads the frame.
#
# Depends on 07 having run: it leaves a real portfolio (a Visa Test debt, Rent, a converted Mortgage), and
# `money.tsx:259` gates the row-actions mark on a non-empty debts list.
#
# ⛔ AND IT CANNOT INHERIT THE MARK FROM 07 — I got this wrong TWICE before measuring it.
# First I said 08 failed because the directory order put it BEFORE 07, so 07's `clearState` had not yet
# reset the once-ever flags. The order was fixed, 08 ran after 07, and it failed identically. The actual
# mechanism, read out of the source rather than fitted to a verdict table:
#   • `coachMarks.ts:86` refuses a mark already in `prefs.coachMarksSeen`, and `:92` PERSISTS it on show;
#   • `money.tsx:259` fires this very mark whenever Money renders with a non-empty debts list;
#   • 07 clears state — and then walks Money with debts in it. **07 consumes the mark itself.**
# No ordering can fix that, because the flow that builds the portfolio must visit the screen that spends
# the mark. So this flow resets the record through the app's OWN affordance before asserting.
#
# ⚡ That is not a workaround, it is coverage this file did not have. `more.tsx:161` says the reset exists
# because "a mark is offered ONCE ever, so without a way back the whole discovery layer is a one-shot a
# user can lose to a mis-tap." Nothing tested that path. Now the mark's re-offer is the setup for the
# mark's assertion, so a broken reset fails here loudly.
appId: com.jasonsnyder.debtplanner
---
- launchApp:
    clearState: false
# ⚠️ Wait for a stated signal before driving the shell — `tapOn` races the same way an assertion does.
# (Not because cold launches are slow: that reading of the 2026-08-11 probe run was wrong. The failures
# were a leaked SpringBoard alert. See flow 07's note.)
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000

# ══ SETUP · re-offer the marks 07 already spent (and test the re-offer while we are here) ═══════
# `more.tsx:164`. The subtitle changing to "Tips will appear again as you go." is the app confirming it
# did the thing, so it is asserted rather than assumed — a reset that silently no-ops would otherwise
# leave every assertion below failing for a reason that looks like the marks are broken.
- tapOn:
    id: "more-button"
- assertVisible:
    text: ".*Show feature tips again.*"
- tapOn:
    text: ".*Show feature tips again.*"
- assertVisible:
    text: ".*Tips will appear again as you go\\..*"

# ⛔ RELAUNCH, DO NOT JUST NAVIGATE BACK. `resetCoachMarks` is not the problem — it correctly clears both
# records (`coachMarks.ts:120-124`), and its own docblock explains why both are needed. The problem is
# that nothing re-ASKS for the mark: `use-coach-mark.ts` fires "once per mount of the subject", latching
# an `asked` flag and waiting on a `laidOut` event. `/more` is PUSHED over Money, so Money never
# unmounts, no layout event follows, and `show()` is never called again however clean the record is.
# A relaunch is the mount. But the relaunch alone was NOT enough, and the reason is a race:
# `persistence.ts:14` debounces the autosave by **500 ms**, and `flushPendingSave` (`_layout.tsx:103`)
# fires on AppState background — which a hard `killApp` never sends. Killing ~400 ms after the tap threw
# the cleared record away, so the mark was refused on relaunch by the LAST guard in `show()`'s chain
# (`coachMarks.ts:86`, the persisted list) with everything else already clean.
#
# ⚠️ Both failing runs are one mechanism: without a relaunch nothing re-asks for the mark; with an
# immediate relaunch the answer is asked before the reset is durable. Going back through the UI first
# spends well over 500 ms and is what a user does anyway.
- tapOn:
    id: "screen-back"
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000

# ══ §13.3 · the iOS-ONLY row long-press mark ════════════════════════════════════════════════════
# Gated on `Platform.OS === 'ios'` (money.tsx:259), so neither the web suite nor an Android run can ever
# see it. It fires on the debts list without being asked for, which is why it is checked first — landing
# on Money is the whole trigger.
- tapOn:
    id: "tab-money"

# ══ 4.1.4c · THE PROBE — read the pipeline BEFORE the assertion that has been red for five cycles ══
# ⛔ ORDER IS THE WHOLE POINT. A failed assertion ABORTS the flow, so anything placed after
# `.*Press and hold a debt.*` is unreachable on exactly the run that needs it. Five mechanisms have been
# asserted for this mark and four refuted, every one of them a reading of the code fitted to a single bit
# of information ("it failed"). This reads five bits instead.
#
# ⚠️ The trip to More is a PERTURBATION and is treated as one: Money's screenshot is taken first, so the
# state the assertion below will judge is recorded before anything navigates. `/more` is pushed over
# Money, so Money does not unmount and the trace — a module singleton — survives the round trip.
- takeScreenshot: maestro-debug/s13-3a-money-as-the-assertion-sees-it
- tapOn:
    id: "more-button"
# ⛔ SCROLL FIRST. Run 31626109780 failed right here — `Assertion is false: id: coach-probe is visible` —
# and the readout was rendering correctly the whole time: "Developer / QA" is the LAST section on More
# (`more.tsx:300`), so the probe sits below the fold on a phone. Asserting a bottom-of-screen element
# without scrolling to it is the same class as the sticky-CTA defect 4.1.3 found, committed by the very
# flow written to diagnose one. `scrollUntilVisible` is proven on this build — flows 02, 05 and 06 use it.
- scrollUntilVisible:
    element:
      id: "coach-probe"
    direction: DOWN
- assertVisible:
    id: "coach-probe"
- takeScreenshot: maestro-debug/s13-3b-PROBE-coach-mark-pipeline
- tapOn:
    id: "screen-back"

# The check itself. Reading it against the probe screenshot above: `EMPTY` = the hook never armed ·
# `ready=0` = the debts list was empty when Money mounted · `registry=0` = no provider above the caller ·
# no `layout:` = the subject never laid out · `show:…=refused(<guard>)` names the guard · `measure:…=NULL`
# = the suspect already written down (`CoachMarkLayer.tsx:68` vs the burn at `coachMarks.ts:92`) ·
# `draw:…=DREW` with the assertion still red would mean the callout renders somewhere unassertable.
- assertVisible:
    text: ".*Press and hold a debt.*"
- takeScreenshot: maestro-debug/s13-3-row-actions-mark

# §13.5 · a mark is a hint, not a modal. `CoachMarkLayer`'s wrapper is `pointerEvents="box-none"` with
# nothing full-screen behind it, and the docblock is explicit that a user who ignores the hint and taps
# the thing is a SUCCESS. So the screen underneath must still work with the mark up — proven by driving
# a control while it is showing, not by looking at it.
- tapOn: "Expenses"
- assertVisible:
    text: ".*Rent.*"
- takeScreenshot: maestro-debug/s13-5-screen-live-under-mark
- tapOn: "Debts"

# Dismiss it so it cannot be confused with the mark under test below — `coachMarks.show` refuses to queue
# a second mark behind a live one (coachMarks.ts:103), so leaving this up would make §13.1 fail for a
# reason that has nothing to do with §13.1.
- tapOn: "Got it"
- assertNotVisible:
    text: ".*Press and hold a debt.*"

# ══ §13.1 · the payoff-schedule mark, INSIDE a sheet ════════════════════════════════════════════
# ⭐ The item the whole nested-host mechanism exists for.
#
# ⚠️ BEFORE-SCAN CORRECTION (2026-08-11): `coachMarkCopy.ts:26-27` says this mark "is not registered
# anywhere until L5 puts the row where a finger can reach it". That comment has outlived what it
# described — `DebtSheet.tsx:125` calls `useCoachMark('payoff-schedule', isEdit)` and `:257` registers the
# `TutorialTarget`. The mark IS wired, on the EDIT sheet only. A flow written from the comment would have
# opened Add and waited for a mark that is correctly never offered there.
- tapOn: ".*Visa Test.*"
- assertVisible: "Edit debt"

# PASS: the callout is over the sheet, near the row it names. FAIL on device would be BEHIND the sheet —
# which, on a simulator, means simply not visible, because a sibling rendered under a presented Modal is
# not in the visible hierarchy at all. That is what makes this assertable rather than a judgement.
- assertVisible:
    id: "coach-mark"
- assertVisible:
    text: ".*See the whole payoff.*"
- takeScreenshot: maestro-debug/s13-1-mark-over-sheet

# ══ §13.2 · "Got it" actually dismisses, and stays gone ═════════════════════════════════════════
# The checklist notes the web suite "can never click this button — same flow-layout reason as §13.1 — so
# the dismiss is unverified off-device". The tap landing IS the check.
- tapOn: "Got it"
- assertNotVisible:
    id: "coach-mark"
- tapOn:
    id: "sheet-close"

# Once ever, not once per visit: `coachMarks` persists the shown set to `prefs.coachMarksSeen`, so the
# check that means anything is a real process restart, exactly as §14.6 does for the mis-file dismissal.
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000
- tapOn:
    id: "tab-money"
- tapOn: ".*Visa Test.*"
- assertVisible: "Edit debt"
- assertNotVisible:
    id: "coach-mark"
- takeScreenshot: maestro-debug/s13-2-stays-dismissed
- tapOn:
    id: "sheet-close"

# ══ §13.4 · the trajectory mark does not bury a different chart ═════════════════════════════════
# Offered unconditionally on Progress (progress.tsx:72). It is placed ABOVE its subject deliberately — a
# hint must not cover the thing it explains — and the open question is whether obscuring the chart above
# is an acceptable price.
#
# ⚠️ That question is a COMPOSITION CALL and is not assertable. What IS assertable is the half that would
# make it a defect rather than a judgement: the hint is readable AND the trajectory it names is still on
# screen. The screenshot carries the judgement to a human; the assertions carry the part that can fail.
- tapOn:
    id: "tab-progress"
# ⛔ `.*` WRAPPERS, like its two siblings. Run 31705617155 proved the mark is on screen — trace
# `draw:trajectory-scrub=DREW`, hierarchy `coach-mark` at [16,493][424,635] — and the assertion still
# failed, because the callout exposes ONE composed label:
#   "Drag the curve. Scrub any month to see what you owe and when you land."
# Maestro matches literal equality or a FULL regex, never "contains", so a bare title can never match.
# ⚡ This file documents that rule twice and §13.4 was written before it was understood — it simply never
# executed until today, so nothing corrected it. §13.3 and §13.1 already use the wrapped form.
- assertVisible:
    text: ".*Drag the curve.*"
- takeScreenshot: maestro-debug/s13-4-trajectory-mark
