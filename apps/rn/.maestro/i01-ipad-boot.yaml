# Maestro E2E — 4.1.5.1 · THE IPAD BOOT. [D30]'s iPad-only tier, first entry.
#
# ⛔ THIS FLOW IS A MEASUREMENT, NOT COVERAGE, AND MUST NOT BE COUNTED AS ANY. Its deliverable is the
# view-hierarchy dump and the screenshots, not its exit code. Every assertion below is one that holds on
# BOTH layouts by design — they exist to keep the flow moving to the next screenshot, and a green here
# says only "the app boots and navigates on an iPad". Recording it as more than that would be defect
# class ① from 3.5's phase after-scan ("an assertion that passes either way"), which this repo has
# already paid for.
#
# ⚡ WHY IT EXISTS. [D30] settled the iPad lane's SHAPE against a checked premise — `use-layout.ts`
# derives `isExpanded` from WIDTH and branches in seven places, so on a wide iPad Money becomes
# master-detail and the debt sheet renders INLINE rather than as a modal. What [D30] could not settle is
# whether the existing flows' iPhone-tuned mechanics survive the move, and it said so explicitly:
#
#   "Today's geometry is iPhone-specific — the swipe percentages come from a 440×956 viewport where the
#    keyboard covered the form. On iPad the keyboard takes proportionally less and the form may not need
#    scrolling at all — the swipe SHOULD clamp harmlessly, and 'should' is the word that cost a cycle."
#
# So the run that produces this dump also runs `01-launch-smoke.yaml` ahead of it, on the iPad, for a
# reason: 01 is the shared tier's hardest case (full onboarding, five text fields, the swipe-past-the-
# sticky-CTA fix from 4.1.3) and whether IT survives is the actual question. This flow is what reads the
# geometry once 01 has got the app into a usable state.
#
# ⚠️ ROTATION IS NOT HERE, deliberately. §11.8's rotation half needs a command this build has not been
# shown to have, and 4.1.1's rule is that an unproven command goes through `.maestro/probe/` first — a
# suite flow that fails on a missing command takes the dump down with it. → probe it, then add it.
appId: com.jasonsnyder.debtplanner
---
# `clearState: false` — 01 ran ahead of this and left an onboarded portfolio. Clearing here would drop
# the app back into onboarding and the geometry below would be of the wrong screens.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "tab-money"
    timeout: 20000

# ── Today. The reference frame for everything else: if the shared flows' swipes went wrong, they went
#    wrong here first. ────────────────────────────────────────────────────────────────────────────────
- takeScreenshot: maestro-debug/ipad-01-today

# ── Money. ⭐ THE ONE THAT DECIDES [D30]'s premise. On a wide iPad this should be MASTER-DETAIL, not the
#    single scrolling list the iPhone flows drive. The hierarchy dump is the evidence. ────────────────
- tapOn:
    id: "tab-money"
- takeScreenshot: maestro-debug/ipad-02-money-master-detail

# ── The debt sheet. `money.tsx:395` passes `inline` when expanded, so this should render INTO the detail
#    pane rather than presenting a modal. That is exactly why `02-sheet-native-tap.yaml` is iPhone-only
#    under [D30]: its subject is a header button inside a modal's swipe area, and there is no modal here
#    to put one in — it would go green while testing nothing. ─────────────────────────────────────────
- tapOn: ".*Visa.*"
- takeScreenshot: maestro-debug/ipad-03-debt-sheet-inline-or-modal

# ── Progress and More, for the two-column checks (§10, C6) that have no iPhone equivalent. No assertion
#    about column count: this build has not been shown to express one, and inventing a selector that
#    happens to match is how a check that proves nothing gets recorded as coverage. ───────────────────
- tapOn:
    id: "tab-progress"
- takeScreenshot: maestro-debug/ipad-04-progress
- tapOn:
    id: "more-button"
- takeScreenshot: maestro-debug/ipad-05-more-two-column
